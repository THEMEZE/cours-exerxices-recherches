# ============================================================
# nginx-cours.conf — cours-ondes-ipsa
#
# Sert deux choses sur le même port :
#   /            -> le site Quartz 5 (fichiers statiques, dossier
#                    Quartz5/public/ généré par `npx quartz build`)
#   /api/        -> l'API Flask du QCM (web/server/app.py, via gunicorn)
#   /qcm/<matiere>/ -> appli QCM de la matière (HTML statique, build/public/qcm/)
#   /pdfs/       -> PDF publiés (build/public/pdfs/, selon le profil actif)
#
# Comme RodTrip (listen 8090 au lieu de 80, pour rester derrière le
# tunnel Cloudflare et ne pas entrer en conflit avec d'autres projets
# du même Raspberry).
# ============================================================
server {
    listen 8091;   # port dédié à ce projet (RodTrip utilise déjà 8090)
    server_name cours.sunset-evasion.fr localhost 127.0.0.1;

    access_log /var/log/nginx/cours_access.log;
    error_log  /var/log/nginx/cours_error.log;

    # --- Site Quartz (statique) ---
    root /mnt/mariage_data/Quartz5/public;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # --- Figures / animations pré-rendues, servies en statique ---
    location /figures/ {
        alias /mnt/mariage_data/CoursOndes/web/public/figures/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /animations/ {
        alias /mnt/mariage_data/CoursOndes/animations/outputs/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- PDF : UNIQUEMENT ce que web/publish_hosting.py a publié pour le profil actif ---
    # (build/public/pdfs/ ne contient que les PDF réellement faits ET autorisés
    # par le profil ; avant, build/output/*.pdf était servi en entier, corrigés compris.)
    location /pdfs/ {
        alias /mnt/mariage_data/CoursOndes/build/public/pdfs/;
        index index.html;
        expires 1h;                      # un PDF recompilé doit apparaître vite
        add_header Cache-Control "public";
    }

    # --- QCM : une appli HTML statique par matière -> /qcm/<matiere>/ ---
    # Le HTML est statique ; seul le stockage des réponses passe par /api/ (Flask).
    location /qcm/ {
        alias /mnt/mariage_data/CoursOndes/build/public/qcm/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Graphe des sujets pondéré (pour une vue D3 personnalisée) ---
    location = /graph.json {
        alias /mnt/mariage_data/CoursOndes/build/public/graph.json;
        add_header Cache-Control "no-cache";
    }

    # --- API Flask (window.storage de secours, cf. web/server/app.py) ---
    location /api/ {
        proxy_pass http://unix:/run/gunicorn-cours.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
