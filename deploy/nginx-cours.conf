# ============================================================
# nginx-cours.conf — cours-ondes-ipsa
#
# Sert deux choses sur le même port :
#   /            -> le site Quartz 5 (fichiers statiques, dossier
#                    Quartz5/public/ généré par `npx quartz build`)
#   /api/        -> l'API Flask du QCM (web/server/app.py, via gunicorn)
#   /qcm/        -> l'appli QCM elle-même (build/output/qcm_app.html,
#                    servie par la même route Flask "/", donc on
#                    retire le préfixe /qcm/ en le passant à la racine
#                    du socket -- voir le "/" final sur proxy_pass)
#
# Comme RodTrip (listen 8090 au lieu de 80, pour rester derrière le
# tunnel Cloudflare et ne pas entrer en conflit avec d'autres projets
# du même Raspberry).
# ============================================================
server {
    listen 8091;   # port dédié à ce projet (RodTrip utilise déjà 8090)
    server_name cours.sunset-evasion.fr localhost 127.0.0.1;

    access_log /var/log/nginx/cours_access.log;
    error_log  /var/log/nginx/cours_error.log;

    # --- Site Quartz (statique) ---
    root /mnt/mariage_data/Quartz5/public;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # --- Figures / animations pré-rendues, servies en statique ---
    location /figures/ {
        alias /mnt/mariage_data/CoursOndes/web/public/figures/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /animations/ {
        alias /mnt/mariage_data/CoursOndes/animations/outputs/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~ ^/pdfs/(.+\.pdf)$ {
        alias /mnt/mariage_data/CoursOndes/build/output/$1;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Appli QCM (HTML + son propre JS, servie par Flask sur "/") ---
    location /qcm/ {
        proxy_pass http://unix:/run/gunicorn-cours.sock:/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Flask (window.storage de secours, cf. web/server/app.py) ---
    location /api/ {
        proxy_pass http://unix:/run/gunicorn-cours.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
