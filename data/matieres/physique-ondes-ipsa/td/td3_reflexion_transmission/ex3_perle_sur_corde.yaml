id: td3_ex3
intitule: "Perle sur une corde : jonction massive, filtre passe-bas puis passe-bande"
td: td3
facultatif: true
seance: 4

cours_rattache:
  - chap3.reflexion_transmission_corde
  - chap3.impedance_mecanique
  - chap3.coefficients_energie
  - chap3.equation_onde_corde

metadonnees:
  duree_estimee: "50 min"
  difficulte: 4
  priorite: 2
  type_exercice: "Approfondissement / Problème de synthèse"
  indispensable: false

enonce_intro: |
  Deux cordes tendues horizontalement avec la même tension $F$ sont reliées en $O$ ($x=0$) : la corde (1),
  de masse linéique $\mu_1$, occupe $x<0$ ; la corde (2), de masse linéique $\mu_2$, occupe $x>0$. On note
  $Z_i=\sqrt{F\mu_i}$ leurs impédances mécaniques. Contrairement à l'exercice 1, on fixe en $O$ une
  \emph{perle} ponctuelle de masse $M$, qui ne peut se déplacer que transversalement (pesanteur négligée).

  \textbf{Convention de cet exercice} (différente de l'exercice 1) : l'onde incidente se propage vers les $x$
  \emph{croissants}. En notation complexe $e^{i\omega t}$, les déplacements sont
  $$y_1(x,t)=A\big(e^{-ik_1x}+r\,e^{ik_1x}\big)e^{i\omega t}\ (x<0),\qquad y_2(x,t)=t\,A\,e^{-ik_2x}e^{i\omega t}\ (x>0),$$
  avec $k_i=\omega\sqrt{\mu_i/F}$, de sorte que $r$ et $t$ sont les coefficients de réflexion et de transmission
  en amplitude de \emph{déplacement}.

  Données numériques (cordes identiques, parties numériques) : $F=100$ N, $\mu_1=\mu_2=4{,}0~\text{g}\cdot\text{m}^{-1}$,
  $M=2{,}0$ g.

