id: td2_ex5
intitule: "Énergie, intensité acoustique et niveau sonore : de l'oreille humaine à l'onde stationnaire"
td: td2
facultatif: true
seance: 3

cours_rattache:
  - chap2.energie_acoustique
  - chap2.intensite_decibel
  - chap2.impedance_acoustique
  - chap2.ondes_stationnaires_acoustiques

metadonnees:
  duree_estimee: "50 min"
  difficulte: 4
  priorite: 2
  type_exercice: "Approfondissement"
  indispensable: false

enonce_intro: |
  L'air est modélisé comme un fluide parfait, de masse volumique au repos
  $\rho_0=1{,}2~\text{kg}\cdot\text{m}^{-3}$, de célérité $c=340~\text{m}\cdot\text{s}^{-1}$
  (impédance $Z=\rho_0c=408~\text{kg}\cdot\text{m}^{-2}\cdot\text{s}^{-1}$) et de pression moyenne
  $P_0=10^5$ Pa. On note $\chi=1/(\rho_0c^2)$ son coefficient de compressibilité isentropique.

  On rappelle les équations de l'acoustique linéaire à une dimension :
  $$\rho_0\frac{\partial v}{\partial t}=-\frac{\partial p}{\partial x},\qquad \frac{\partial\rho'}{\partial t}+\rho_0\frac{\partial v}{\partial x}=0,\qquad \rho'=\rho_0\chi\,p.$$

  L'\emph{intensité acoustique} est la moyenne temporelle de la puissance transportée par unité de surface, $I=\langle p\,v\rangle$. Le \emph{niveau sonore} est $L=10\log_{10}(I/I_0)$ avec $I_0=10^{-12}~\text{W}\cdot\text{m}^{-2}$ (seuil d'audition à 1 kHz), exprimé en décibels (dB).

