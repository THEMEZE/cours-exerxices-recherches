id: td4_ex9
intitule: "Complément (niveau 3, ENS) : anneau de N oscillateurs, modes de Fourier et propagation du signal"
td: td4
facultatif: true
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.matrices_masse_raideur
  - chap4.modes_propres
  - chap4.decomposition_modale
  - chap4.equations_differentielles_ordre_n
  - chap4.passage_au_continu

metadonnees:
  duree_estimee: "120 min"
  difficulte: 5 # Sur une échelle de 1 à 5
  priorite: 4
  type_exercice: "Complément original, problème de type ENS, passerelle vers les ondes"
  indispensable: false

enonce_intro: |
  \textbf{Exercice complémentaire original (niveau 3, type ENS).} $N$ masses identiques $m$ ($N\ge3$) glissent sans frottement sur un rail circulaire fixe. Chaque masse est reliée à ses deux voisines par un ressort de raideur $k$, idéalisé de façon à rester tangent au rail (ressorts « curvilignes ») ; à l'équilibre, les masses sont régulièrement espacées d'une longueur $a$ et tous les ressorts sont à leur longueur à vide. On numérote les masses $n=0,1,\dots,N-1$ et on note $x_n(t)$ l'écart (algébrique, le long du rail) de la masse $n$ à sa position d'équilibre ; les indices sont comptés modulo $N$ ($x_N=x_0$, $x_{-1}=x_{N-1}$). On pose $\omega_0=\sqrt{k/m}$.

  C'est l'exercice 6 sans parois : la symétrie par rotation (invariance par $n\to n+1$) remplace la symétrie miroir, et la diagonalisation devient une \emph{transformation de Fourier discrète}.

