id: td4_ex7
intitule: "Complément (niveau 2, ambitieux) : oscillateurs désaccordés, anticroisement et transfert d'énergie"
td: td4
facultatif: true
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.matrices_masse_raideur
  - chap4.modes_propres
  - chap4.battements
  - chap4.energie_des_modes

metadonnees:
  duree_estimee: "75 min"
  difficulte: 4 # Sur une échelle de 1 à 5
  priorite: 3
  type_exercice: "Complément original, problème guidé de type concours/ENS"
  indispensable: false

enonce_intro: |
  \textbf{Exercice complémentaire original (niveau 2).} Deux pendules simples de même masse $m$, de longueurs $\ell_a$ et $\ell_b$ légèrement différentes, sont suspendus côte à côte et couplés par un ressort horizontal de raideur $k_c$, accroché aux masses (ressort relâché quand les deux fils sont verticaux). On note $x_a$, $x_b$ les abscisses des masses (petits angles), $\omega_a^2=g/\ell_a$, $\omega_b^2=g/\ell_b$, $\Omega^2=k_c/m$ et $\omega_0^2=\dfrac{\omega_a^2+\omega_b^2}2$, $\Delta=\omega_b^2-\omega_a^2$ (désaccord). On suppose $\Omega^2\ll\omega_0^2$. Dans les applications numériques : $\omega_0^2=100\ \mathrm{s^{-2}}$, $\Omega^2=0{,}5\ \mathrm{s^{-2}}$.

  Le but est de comprendre ce qui se passe quand on \emph{désaccorde} deux oscillateurs couplés : comment les modes évoluent, pourquoi les fréquences ne se croisent jamais, et quelle fraction de l'énergie peut passer d'un oscillateur à l'autre.

