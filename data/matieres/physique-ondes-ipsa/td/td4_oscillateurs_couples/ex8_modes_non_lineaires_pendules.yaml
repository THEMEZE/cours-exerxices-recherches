id: td4_ex8
intitule: "Complément (niveau 3, ENS) : modes non linéaires de deux pendules couplés, stabilité et instabilité paramétrique"
td: td4
facultatif: true
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.petits_angles_et_developpements_limites
  - chap4.modes_propres
  - chap4.equations_differentielles_ordre_n

metadonnees:
  duree_estimee: "120 min"
  difficulte: 5 # Sur une échelle de 1 à 5
  priorite: 4
  type_exercice: "Complément original, problème de type ENS"
  indispensable: false

enonce_intro: |
  \textbf{Exercice complémentaire original (niveau 3, type ENS).} Deux pendules simples identiques (longueur $\ell=1{,}00$ m, masse $m$, $\omega_0^2=g/\ell$, $g=9{,}81\ \mathrm{m\cdot s^{-2}}$) sont suspendus à la même hauteur, à la distance $d$ l'un de l'autre, et couplés par un ressort de raideur $k$, de longueur à vide $d$, accroché aux deux masses. On note $\kappa=k/m$ et $\alpha_1,\alpha_2$ les angles des fils avec la verticale (positifs vers la droite). \emph{On ne fait aucune approximation des petits angles dans les questions 1 à 3.}

  Les équations exactes établies à l'exercice 1 sont, avec $u=d+\ell(\sin\alpha_2-\sin\alpha_1)$, $v=\ell(\cos\alpha_1-\cos\alpha_2)$ et $\ell_s=\sqrt{u^2+v^2}$ (longueur du ressort) :
  $$\ddot\alpha_1=-\omega_0^2\sin\alpha_1+\frac\kappa\ell\,\frac{\ell_s-d}{\ell_s}(u\cos\alpha_1+v\sin\alpha_1),\qquad\ddot\alpha_2=-\omega_0^2\sin\alpha_2-\frac\kappa\ell\,\frac{\ell_s-d}{\ell_s}(u\cos\alpha_2+v\sin\alpha_2).$$
  Dans la théorie linéaire, il y a deux modes : en phase ($\omega_s=\omega_0$) et en opposition de phase ($\omega_a=\sqrt{\omega_0^2+2\kappa}$). La question est : \emph{que deviennent ces modes à amplitude finie, et restent-ils stables ?}

