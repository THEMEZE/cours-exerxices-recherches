id: td4_ex3
intitule: "Oscillations libres et forcées d'un couplage pendule-chariot"
td: td4
facultatif: false
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.matrices_masse_raideur
  - chap4.modes_propres
  - chap4.oscillations_forcees
  - chap4.petits_angles_et_developpements_limites

metadonnees:
  duree_estimee: "60 min"
  difficulte: 4 # Sur une échelle de 1 à 5
  priorite: 2
  type_exercice: "Approfondissement, problème guidé"
  indispensable: false

enonce_intro: |
  On considère un pendule simple de longueur $\ell=OA$ et de masse $m$ supposée ponctuelle au point $A$, couplé au système oscillant constitué du chariot de masse $m$ et du ressort de raideur $k$, dont l'extrémité $O'$ est fixée. Le ressort qui est responsable du couplage est horizontal et de raideur $k_c$. L'extrémité $O$ du pendule est fixée. À l'équilibre, le pendule est vertical et les deux ressorts sont non déformés. On pose $\omega_1=\sqrt{\dfrac km}$, $\omega_2=\sqrt{\dfrac g\ell}$ et $\Omega=\sqrt{\dfrac{k_c}m}$. De plus, on considère que les déplacements $x_1(t)$ du centre de masse $G$ du chariot, et $x_2(t)$, de l'extrémité $A$ du pendule, à partir de leur position d'équilibre respectif, sont suffisamment petits pour admettre que les deux ressorts peuvent être considérés comme horizontaux.

  \textbf{1\textsuperscript{ère} partie : Oscillations libres et modes propres} (questions $1$ à $3$ de l'énoncé, notées q1 à q3). \textbf{2\textsuperscript{ème} partie : Oscillations forcées} (questions $1$ à $3$ de l'énoncé, notées q4 à q6) : l'extrémité $O'$ du ressort de raideur $k$ est maintenant soumise à un déplacement sinusoïdal imposé $x_0'=a_0\cos(\omega t)$.

