id: td4_ex6
intitule: "Complément (niveau 2, ambitieux) : trois masses, quatre ressorts, diagonalisation et perturbation"
td: td4
facultatif: true
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.matrices_masse_raideur
  - chap4.modes_propres
  - chap4.decomposition_modale
  - chap4.equations_differentielles_ordre_n

metadonnees:
  duree_estimee: "90 min"
  difficulte: 4 # Sur une échelle de 1 à 5
  priorite: 3
  type_exercice: "Complément original, problème guidé de type concours"
  indispensable: false

enonce_intro: |
  \textbf{Exercice complémentaire original (niveau 2).} Trois masses ponctuelles identiques $m=0{,}10$ kg, notées $M_1,M_2,M_3$, glissent sans frottement sur une tige horizontale fixe entre deux parois rigides. Elles sont reliées entre elles et aux parois par quatre ressorts identiques de raideur $k=20\ \mathrm{N\cdot m^{-1}}$ et de longueur à vide $\ell_0$ : paroi -- $M_1$ -- $M_2$ -- $M_3$ -- paroi. À l'équilibre, tous les ressorts sont à leur longueur à vide. On note $x_i(t)$ l'écart de $M_i$ à sa position d'équilibre et $\omega_0=\sqrt{k/m}$.

# figure:
#   - ref: td4_ex6_trois_masses
#     legende: "Trois masses identiques reliées par quatre ressorts identiques entre deux parois."
#     width: 0.8
#     label: "fig:trois_masses"
#   - ref: td4_ex6_modes
#     legende: |
#       Suggestion : les trois modes propres représentés par les déplacements des masses : $(1,\sqrt2,1)$ sans nœud, $(1,0,-1)$ avec un nœud (la masse centrale immobile), $(1,-\sqrt2,1)$ avec deux nœuds.
