id: td4_ex5
intitule: "Complément (niveau 1, CPGE) : pendules couplés par un ressort attaché à mi-hauteur"
td: td4
facultatif: true
seance: 5

cours_rattache:
  - chap4.oscillateurs_couples
  - chap4.petits_angles_et_developpements_limites
  - chap4.modes_propres
  - chap4.battements
  - chap4.energie_des_modes

metadonnees:
  duree_estimee: "60 min"
  difficulte: 3 # Sur une échelle de 1 à 5
  priorite: 3
  type_exercice: "Complément original, entraînement de type CPGE/concours"
  indispensable: false

enonce_intro: |
  \textbf{Exercice complémentaire original (niveau 1).} Deux pendules simples identiques sont formés chacun d'une tige rigide de masse négligeable, de longueur $\ell=1{,}00$ m, suspendue en un point fixe $O_i$ ($i=1,2$) et portant à son extrémité une masse ponctuelle $m=0{,}20$ kg. Les points de suspension sont alignés sur une horizontale, séparés de $d$. Un ressort de raideur $k=0{,}40\ \mathrm{N\cdot m^{-1}}$ et de longueur à vide $d$ est accroché aux deux tiges en des points $P_1$ et $P_2$ situés \emph{à la distance $h=\ell/2$ de leur point de suspension}, et non aux masses. Au repos, les tiges sont verticales et le ressort est horizontal et non déformé. Les angles $\alpha_1$ et $\alpha_2$ des tiges avec la verticale descendante sont comptés positivement vers $+x$. Les masses se déplacent dans le plan vertical $(Oxy)$, sans frottement, $g=9{,}81\ \mathrm{m\cdot s^{-2}}$.

  Cet exercice reprend la méthode de l'exercice 1 en déplaçant le point d'attache du ressort : il illustre que le couplage dépend de la géométrie, pas seulement de $k$.

