id: td1_ex5
intitule: "Expérience de Melde, oscillations forcées d'une corde, résonance"
td: td1
facultatif: true
seance: 1
cours_rattache:
  - chap1.oscillations_forcees
  - chap1.impedance_resonance

metadonnees:
  duree_estimee: "50 min"
  difficulte: 4 # Sur une échelle de 1 à 5
  priorite: 2
  type_exercice: "Application directe du cours"
  indispensable: false
  
enonce_intro: |
  Une corde $OA$ de longueur $\ell = 50\text{ cm}$ et $\mu = 0.02\text{ kg}\cdot\text{m}^{-1}$ est tendue avec $F = 50\text{ N}$. Un vibreur impose en $x=0$ : $y(0,t) = a e^{j\omega t}$. On pose $k = \omega\sqrt{\mu/F}$. La corde est fixée en $x=\ell$.


figure:
  ref: td1_ex5_PhV212_corde_melde
  legende: "Corde de Melde en régime forcé."
  scale: 0.8
  label: "fig:melde"

accroche_point_cours_essentiel:
  - titre: "Faire danser une corde : de l'amplitude infinie ?"
    duree_introduction: "5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Un vibreur fait osciller l'extrémité d'une corde. À certaines fréquences, de beaux « fuseaux » apparaissent avec une grande amplitude ; à d'autres, la corde reste presque immobile. Pourquoi ? Et que se passerait-il, selon le modèle, si l'on excitait {\bf exactement} à la bonne fréquence ?
    texte: |
      {\bf Idée clé : en régime forcé, la corde vibre à la fréquence imposée, avec un profil fixé par les conditions aux limites.} On cherche $\underline y(x,t)=\underline Y(x)e^{j\omega t}$ avec $\underline Y(0)=a$ et $\underline Y(\ell)=0$ :
      $$\underline Y(x)=a\,\frac{\sin\big(k(\ell-x)\big)}{\sin(k\ell)},\qquad k=\omega\sqrt{\mu/F}.$$
      L'amplitude diverge quand $\sin(k\ell)=0$, soit $f=Nf_1$ : c'est la {\bf résonance}. En pratique, l'amortissement la limite à une valeur finie.

outils_mathematiques:
  - titre: "Notation complexe"
    texte: |
      $\underline y=\underline Y(x)e^{j\omega t}$ : dériver par rapport à $t$ revient à multiplier par $j\omega$, donc $\partial_t^2\to-\omega^2$. L'équation de d'Alembert devient $\underline Y''+k^2\underline Y=0$. Le signal physique est la partie réelle.
  - titre: "EDO linéaire du second ordre à coefficients constants"
    texte: |
      $\underline Y''+k^2\underline Y=0$ a pour solution $A\cos kx+B\sin kx$. Les deux constantes sont fixées par les {\bf deux conditions aux limites} $\underline Y(0)=a$ et $\underline Y(\ell)=0$.
  - titre: "Formule de soustraction : $\\sin(a-b)=\\sin a\\cos b-\\cos a\\sin b$"
    texte: |
      Elle permet de regrouper $\sin(k\ell)\cos(kx)-\cos(k\ell)\sin(kx)$ en $\sin\big(k(\ell-x)\big)$ : c'est ce qui donne le profil final compact.
  - titre: "Résonance : dénominateur qui s'annule"
    texte: |
      $\dfrac1{\sin(k\ell)}$ diverge quand $k\ell=N\pi$, soit $f_N=N\dfrac c{2\ell}=50N$ Hz avec $c=\sqrt{F/\mu}=50$ m/s et $\ell=0{,}5$ m. Valeurs de $k\ell$ à connaître : $\pi,\,2\pi,\,\dots$
  - titre: "Amplitude des ventres"
    texte: |
      Le profil est $a\,\dfrac{\sin(k(\ell-x))}{\sin(k\ell)}$ ; son maximum en valeur absolue vaut $\dfrac a{|\sin(k\ell)|}\ge a$ : l'amplitude des ventres est toujours supérieure à celle du vibreur.

liens_autres_disciplines:
  - discipline: "Électrocinétique"
    texte: |
      Un circuit RLC en régime sinusoïdal forcé présente une résonance à $\omega_0=1/\sqrt{LC}$ avec la même notation complexe et le même rôle de l'amortissement (la résistance limite le pic).
  - discipline: "Mécanique (oscillateur forcé)"
    texte: |
      Une masse sur un ressort excitée à sa fréquence propre atteint une grande amplitude. La corde est un oscillateur à une infinité de modes, avec une résonance par mode.
  - discipline: "Génie civil et sécurité"
    texte: |
      Les ponts, passerelles et immeubles ont des fréquences propres à éviter : l'oscillation latérale de la passerelle du Millennium Bridge (Londres, 2000) a obligé à installer des amortisseurs. (L'effondrement du pont de Tacoma, souvent cité, relève en fait d'un flottement aéroélastique plus complexe.)
  - discipline: "Acoustique"
    texte: |
      Un verre en cristal peut se briser si on le soumet à un son pur de la fréquence de sa résonance propre ; un tuyau d'orgue amplifie sélectivement ses harmoniques.

questions:
  - id: q1
    enonce: |
      Établir en régime forcé l'équation $y(x,t)$ du mouvement de la corde en tout point $M(x)$ à l'instant $t$. Conclusion.

    coup_de_pouce:
      - titre: "Forme complexe"
        texte: |
          Cherchez une solution complexe $\underline{y}(x,t) = \underline{Y}(x)e^{j\omega t}$ vérifiant $\underline{Y}(0) = a$ et $\underline{Y}(\ell) = 0$.

    correction:
      - titre: "Résultat"
        texte: |
          $y(x,t) = a \dfrac{\sin(k(\ell-x))}{\sin(k\ell)} \cos(\omega t)$ (en partie réelle).
          L'onde complexe établie est une onde stationnaire forcée par le vibreur.

    solution:
      - titre: "Résolution complète"
        texte: |
          En régime sinusoïdal forcé à la pulsation $\omega$, on pose $\underline{y}(x,t) = \underline{Y}(x) e^{j\omega t}$.
          L'équation de d'Alembert impose : $\dfrac{d^2\underline{Y}}{dx^2} + k^2 \underline{Y} = 0 \implies \underline{Y}(x) = C_1 \cos(kx) + C_2 \sin(kx)$.
          
          \begin{itemize}[label = $\bullet$]
          \item Condition en $x=\ell$ : $\underline{Y}(\ell) = 0 \implies C_1 \cos(k\ell) + C_2 \sin(k\ell) = 0 \implies C_1 = -C_2 \tan(k\ell)$.
          \item Ainsi : $\underline{Y}(x) = C_2 \left[\sin(kx) - \tan(k\ell)\cos(kx)\right] = C_2 \dfrac{\sin(k(x-\ell))}{\cos(k\ell)}$.
          \item Condition en $x=0$ : $\underline{Y}(0) = a \implies -C_2 \tan(k\ell) = a \implies C_2 = -a \cot(k\ell)$.
          \end{itemize}
          On obtient : $\underline{Y}(x) = a \dfrac{\sin(k(\ell-x))}{\sin(k\ell)}$. \\

          {\bf Conclusion :} Le mouvement est celui d'une onde stationnaire d'amplitude spatiale $A(x) = a \left|\dfrac{\sin(k(\ell-x))}{\sin(k\ell)}\right|$.

    aller_plus_loin:

      - niveau: licence
        titre: "Résolution du régime forcé pour une corde vibrante fixée à une extrémité"
        texte: |
          {\bf 1. Établissement de l'équation du mouvement $y(x,t)$}

          La corde obéit à l'équation de d'Alembert unidimensionnelle :
          $$\frac{\partial^2 y}{\partial x^2} - \frac{1}{c^2}\frac{\partial^2 y}{\partial t^2} = 0 \quad \text{avec } c = \sqrt{\frac{F}{\mu}} = \sqrt{\frac{50}{0{,}02}} = 50\text{ m}\cdot\text{s}^{-1}$$

          En régime sinusoïdal forcé établi à la pulsation $\omega$ imposée par le vibreur, la solution est de la forme $y(x,t) = Y(x)e^{i\omega t}$.
          En injectant cette forme dans l'équation de d'Alembert :
          $$\frac{\mathrm{d}^2 Y}{\mathrm{d}x^2} + k^2 Y(x) = 0 \quad \text{avec } k = \frac{\omega}{c} = \omega\sqrt{\frac{\mu}{F}}$$

          La solution générale de cette EDO spatiale s'écrit :
          $$Y(x) = A \cos(kx) + B \sin(kx)$$

          On applique les conditions aux limites (CL) :
          \begin{itemize}[label = $\circ$]
            \item {\bf En $x = 0$ :} $y(0,t) = a e^{i\omega t} \implies Y(0) = a \implies A = a$.
            \item {\bf En $x = \ell$ (extrémité fixée) :} $y(\ell,t) = 0 \implies Y(\ell) = 0$.
          \end{itemize}

          D'où :
          $$a \cos(k\ell) + B \sin(k\ell) = 0 \implies B = -a \frac{\cos(k\ell)}{\sin(k\ell)}$$

          En réinjectant $B$ dans l'expression de $Y(x)$ :
          $$Y(x) = a \left[ \cos(kx) - \frac{\cos(k\ell)}{\sin(k\ell)} \sin(kx) \right] = a \frac{\sin(k\ell)\cos(kx) - \cos(k\ell)\sin(kx)}{\sin(k\ell)} = a \frac{\sin\big(k(\ell - x)\big)}{\sin(k\ell)}$$

          L'expression complexe du déplacement transversal est donc :
          $$y(x,t) = a \frac{\sin\big(k(\ell - x)\big)}{\sin(k\ell)} e^{i\omega t}$$

          {\bf Conclusion :}
          \begin{itemize}[label = $\circ$]
            \item Il s'agit d'une {\bf onde stationnaire} : tous les points de la corde oscillent en phase (ou opposition de phase) à la pulsation $\omega$, avec un profil d'amplitude spatiale $Y(x)$.
            \item {\bf Résonance :} Lorsque $\sin(k\ell) = 0$, c'est-à-dire pour $k\ell = n\pi$ ($n \in \mathbb{N}^*$), l'amplitude $Y(x)$ tend vers l'infini (en l'absence d'amortissement). Les pulsations de résonance sont $\omega_n = \frac{n\pi c}{\ell}$.
            \item {\bf Noeuds et Ventres :} La corde présente des noeuds de vibration fixes aux positions $x$ telles que $k(\ell - x) = p\pi$.
          \end{itemize}

      - niveau: licence
        titre: |
          Lustification rigoureuse du postulat $y(x,t) = Y(x)e^{i\omega t}$
        texte: |
          {\bf 1. Linéarité et invariance par translation temporelle}

          L'équation de d'Alembert $\mathcal{L}[y] = 0$ (où $\mathcal{L} = \frac{\partial^2}{\partial x^2} - \frac{1}{c^2}\frac{\partial^2}{\partial t^2}$) est un opérateur différentiel linéaire à coefficients constants.
          
          \begin{itemize}[label = $\circ$]
            \item {\bf Invariance temporelle :} L'opérateur $\mathcal{L}$ commute avec l'opérateur de dérivation temporelle $\frac{\partial}{\partial t}$. Les fonctions propres de la dérivation temporelle $\frac{\partial}{\partial t}$ sont les fonctions exponentielles $t \mapsto e^{s t}$ avec $s \in \mathbb{C}$.
            \item {\bf Excitation harmonique :} La source impose une sollicitation monochromatique $y(0,t) = a e^{i\omega t}$ à la frontière $x=0$.
          \end{itemize}

          {\bf 2. Théorème de la réponse en régime permanent (Analyse spectrale)}

          Par linéarité, la réponse d'un système linéaire invariant dans le temps (SLIT) à une entrée de la forme $e^{i\omega t}$ est obligatoirement, en régime permanent établi (après extinction des régimes transitoires propres), une sortie à la {\bf même fréquence} $\omega$, simplement modulée en amplitude et en phase selon la position spatiale :
          $$y(x,t) = Y(x) e^{i\omega t}$$
          où $Y(x) \in \mathbb{C}$ est l'amplitude complexe englobant le module $|Y(x)|$ et le déphasage spatial $\arg(Y(x))$.

          {\bf 3. Interprétation en termes d'ondes progressives croisées}

          En utilisant la représentation complexe, une onde stationnaire s'interprète comme la superposition d'une onde incidente et d'une onde réfléchie de même pulsation $\omega$ :
          $$y(x,t) = C_1 e^{i(\omega t - kx)} + C_2 e^{i(\omega t + kx)} = \underbrace{\left( C_1 e^{-ikx} + C_2 e^{ikx} \right)}_{Y(x)} e^{i\omega t}$$

          Cette factorisation isole complètement la dépendance temporelle imposée par la source de la structure spatiale $Y(x)$ imposée par la géométrie du milieu et les conditions aux limites.

  - id: q2
    enonce: |
      Pour les fréquences $f < f_1$, seul existe un nœud de vibration en $A$. Calculer $f_1$.

    coup_de_pouce:
      - titre: "Fréquence limite"
        texte: |
          $f_1$ correspond à la fréquence pour laquelle la demi-longueur d'onde égale la longueur de la corde ($\ell = \lambda/2$).

    correction:
      - titre: "Résultat"
        texte: |
          $c = 50\text{ m/s} \implies f_1 = \dfrac{c}{2\ell} = 50\text{ Hz}$.

    solution:
      - titre: "Application numérique"
        texte: |
          $c = \sqrt{\dfrac{F}{\mu}} = \sqrt{\dfrac{50}{0.02}} = 50\text{ m/s}$.
          La première fréquence de résonance (fondamental) est $f_1 = \dfrac{c}{2\ell} = \dfrac{50}{2 \times 0.50} = 50\text{ Hz}$.

  - id: q3
    enonce: |
      Pour les fréquences $f \ge f_1$, calculer l'amplitude des ventres de vibration. Pour quelles fréquences observe-t-on la résonance d'amplitude ?

    coup_de_pouce:
      - titre: "Dénominateur nul"
        texte: |
          L'amplitude devient infinie (en l'absence d'amortissement) quand le dénominateur $\sin(k\ell)$ s'annule.

    correction:
      - titre: "Résultat"
        texte: |
          Amplitude d'un ventre : $A_v = \dfrac{a}{|\sin(k\ell)|}$.
          Résonance d'amplitude si $\sin(k\ell) = 0$, soit $f = N f_1 = N \times 50\text{ Hz}$ ($N \in \mathbb{N}^*$).

    solution:
      - titre: "Analyse de la résonance"
        texte: |
          Les ventres de vibration correspondent aux maxima du sinus au numérateur ($|\sin(k(\ell-x))| = 1$).
          L'amplitude au niveau des ventres est donc :
          $$A_{\text{ventre}} = \frac{a}{|\sin(k\ell)|}$$
          Le phénomène de résonance d'amplitude a lieu lorsque le dénominateur tend vers zéro :
          $$\sin(k\ell) = 0 \implies k\ell = N\pi \implies \frac{2\pi f}{c}\ell = N\pi \implies f = N \frac{c}{2\ell} = N f_1$$
          On observe la résonance pour toutes les fréquences harmoniques $f_N = N \times 50\text{ Hz}$ ($50\text{ Hz}, 100\text{ Hz}, 150\text{ Hz}, \dots$).

    aller_plus_loin:
      - niveau: licence
        titre: "Prise en compte de l'amortissement"
        texte: |
          En réalité, les frottements fluides introduisent une partie imaginaire à la vitesse de propagation $c$, ce qui borne l'amplitude à la résonance à une valeur finie inversement proportionnelle au coefficient d'amortissement.