id: td1_ex6
intitule: "Ondes stationnaires sur une corde avec une extrémité libre"
td: td1
facultatif: true
seance: 1
cours_rattache:
  - chap1.conditions_aux_limites
  - chap1.modes_propres_libre

metadonnees:
  duree_estimee: "30 min"
  difficulte: 4 # Sur une échelle de 1 à 5
  priorite: 2
  type_exercice: "Application directe du cours"
  indispensable: false
  
enonce_intro: |
  On considère une corde de longueur $L$, fixée à l'extrémité $A(x=0)$ et totalement libre de se déplacer transversalement à l'extrémité $B(x=L)$. À l'extrémité libre, la force transversale est nulle, ce qui impose un nœud de tension transversale :
  $$T_y(L,t) = F \sin( \alpha( L , t )) \approx F\left.\frac{\partial y}{\partial x}\right|_{x=L} = 0$$

