  ref: td1_ex6_PhV212_corde_stationaire_libre
  legende: " "
  scale: 0.7
  label: "fig:???"

accroche_point_cours_essentiel:
  - titre: "Fixe d'un côté, libre de l'autre : quel changement ?"
    duree_introduction: "5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Une corde fixée aux deux bouts a un fondamental $f_1=c/(2L)$ et tous les harmoniques. Que se passe-t-il si l'un des bouts est {\bf libre} (par exemple attaché à un anneau qui glisse sans frottement le long d'une tige) ? Le fondamental est-il plus grave ou plus aigu ? Pourquoi une clarinette n'a-t-elle que des harmoniques {\bf impairs} ?
    texte: |
      {\bf Idée clé : une extrémité fixe est un nœud de déplacement, une extrémité libre est un ventre.} Fixe : $y(0,t)=0$. Libre : la force transversale est nulle, $T_y=F\,\partial_x y=0$, donc la {\bf pente} est nulle. Il en résulte
      $$k_NL=(2N-1)\frac\pi2,\qquad\lambda_N=\frac{4L}{2N-1},\qquad f_N=(2N-1)f_1,\ \ f_1=\frac c{4L}.$$
      Le fondamental tient en un {\bf quart} de longueur d'onde ($L=\lambda_1/4$) : il est deux fois plus grave que pour une corde fixée aux deux bouts, et seuls les harmoniques impairs existent.

outils_mathematiques:
  - titre: "Dérivées de $\\sin$ et $\\cos$"
    texte: |
      $\dfrac{\mathrm d}{\mathrm dx}\sin(kx)=k\cos(kx)$. La condition de pente nulle en $x=L$ s'écrit $k\cos(kL)=0$.
  - titre: "Zéros du cosinus : $\\cos u=0\\iff u=\\dfrac\\pi2+n\\pi$"
    texte: |
      $kL=\dfrac\pi2+n\pi=(2n+1)\dfrac\pi2$ : les multiples {\bf impairs} de $\pi/2$. En posant $N=n+1$, $kL=(2N-1)\pi/2$ avec $N\in\mathbb N^*$.
  - titre: "Conditions de Dirichlet et de Neumann"
    texte: |
      Fixé : la fonction s'annule ($y=0$, condition de Dirichlet). Libre : sa dérivée s'annule ($\partial_x y=0$, condition de Neumann). Les deux types de conditions aux limites se retrouvent dans tous les problèmes ondulatoires et de diffusion.
  - titre: "Décalage de phase : $\\sin\\!\\left(\\dfrac\\pi2-u\\right)=\\cos u$"
    texte: |
      En repérant le mode depuis l'extrémité libre, $y_N\propto\cos\!\big(k_N(L-x)\big)$ : on retrouve la symétrie $\sin(\pi/2-u)=\cos u$ et le ventre en $x=L$.
  - titre: "Lien longueur-longueur d'onde"
    texte: |
      $L=(2N-1)\lambda_N/4$ : un nombre impair de quarts d'onde. Comparer avec $L=N\lambda_N/2$ (fixe-fixe, nombre entier de demi-ondes).

liens_autres_disciplines:
  - discipline: "Acoustique et instruments à vent"
    texte: |
      Un tuyau fermé à une extrémité et ouvert à l'autre (clarinette, tuyau d'orgue bouché) a un nœud de pression à l'extrémité ouverte et un ventre à l'extrémité fermée : $f_N=(2N-1)c/(4L)$. C'est exactement le cas fixe-libre de la corde.
  - discipline: "Électricité et antennes"
    texte: |
      Une antenne quart d'onde ($L=\lambda/4$) fonctionne sur le même principe : ventre de courant ou de tension d'un côté, nœud de l'autre ; une ligne quart d'onde transforme les impédances.
  - discipline: "Mathématiques"
    texte: |
      Problème de Sturm-Liouville avec conditions de Dirichlet (fixe) ou de Neumann (libre) : les valeurs propres changent selon les conditions aux limites.
  - discipline: "Génie civil"
    texte: |
      Une poutre encastrée à un bout et libre à l'autre (mât, gratte-ciel, diapason) a des modes propres qui s'écrivent aussi avec un nœud d'un côté et un ventre de l'autre.

questions:
  - id: q1
    enonce: |
      Déterminer la forme des modes propres $y_N(x,t)$ de cette corde et exprimer les fréquences propres $f_N$ en fonction de $N$, $c$ et $L$.

    coup_de_pouce:
      - titre: "Conditions aux limites fixée/libre"
        texte: |
          Appliquez $y(0,t) = 0$ (extrémité fixe) et $\left.\dfrac{\partial y}{\partial x}\right|_{x=L} = 0$ (extrémité libre).

    correction:
      - titre: "Résultat"
        texte: |
          $y_N(x,t) = A_N \sin\left((2N-1)\dfrac{\pi x}{2L}\right)\cos(\omega_N t + \phi_N)$.
          $f_N = (2N-1) f_1$ avec $f_1 = \dfrac{c}{4L}$ ($N \in \mathbb{N}^*$).

    solution:
      - titre: "Démonstration complète"
        texte: |
          En partant de la forme séparée $y(x,t) = A\cos(kx+\varphi)\cos(\omega t+\phi)$ :
          1. En $x=0$ (extrémité fixe) : $y(0,t) = 0 \implies \varphi = \dfrac{\pi}{2} [\pi]$, donc $f(x) \propto \sin(kx)$.
          2. En $x=L$ (extrémité libre) : $\left.\dfrac{\partial y}{\partial x}\right|_{x=L} = 0 \implies k \cos(kL) = 0$.
          
          Ceci impose $k_N L = (2N-1)\dfrac{\pi}{2}$ avec $N \in \mathbb{N}^*$ (entiers impairs).
          Les longueurs d'onde possibles sont $\lambda_N = \dfrac{4L}{2N-1}$.
          
          Les fréquences propres s'écrivent :
          $$f_N = \frac{c}{\lambda_N} = (2N-1)\frac{c}{4L} = (2N-1)f_1 \quad \text{avec } f_1 = \frac{c}{4L}$$
          Seuls les harmoniques {\bf impairs} de la fréquence fondamentale $f_1$ sont présents.

  - id: q2
    enonce: |
      Préciser la position du premier ventre et du premier nœud pour le mode fondamental ($N=1$).

    coup_de_pouce:
      - titre: "Analyse du mode N=1"
        texte: |
          Pour $N=1$, $y_1(x,t) \propto \sin\left(\dfrac{\pi x}{2L}\right)$.

    correction:
      - titre: "Résultat"
        texte: |
          Nœud en $x=0$ (extrémité fixe).
          Ventre en $x=L$ (extrémité libre, la corde y oscille avec l'amplitude maximale).

    solution:
      - titre: "Interprétation physique"
        texte: |
          Pour le fondamental $N=1$, la corde contient un quart de longueur d'onde ($L = \lambda_1/4$) :
          \begin{itemize}[label=$\bullet$]
          \item {\bf Nœud :} en $x=0$ (déplacement imposé nul).
          \item {\bf Ventre :}  en $x=L$ (déplacement transversal maximal, pente spatiale nulle).
          \end{itemize}

    aller_plus_loin:
      - niveau: licence
        titre: "Analogie avec les tuyaux sonores"
        texte: |
          Une corde fixée/libre est l'analogue mécanique exact d'un tuyau sonore fermé à une extrémité et ouvert à l'autre (tube de Kundt demi-ouvert, instrument à vent comme la clarinette), qui ne produit également que des harmoniques impairs ($f_N = (2N-1)f_1$).