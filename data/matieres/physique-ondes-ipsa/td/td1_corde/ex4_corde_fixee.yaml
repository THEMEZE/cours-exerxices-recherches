id: td1_ex4
intitule: "Corde fixée à ses deux extrémités et ondes stationnaires"
td: td1
facultatif: false
seance: 1
cours_rattache:
  - chap1.separation_variables
  - chap1.ondes_stationnaires
  - chap1.modes_propres

metadonnees:
  duree_estimee: "40 min"
  difficulte: 3 # Sur une échelle de 1 à 5
  type_exercice: "Application directe du cours"
  indispensable: true

enonce_intro: |
  Une corde homogène, de masse linéique $\mu$ et de longueur $L$, est fixée en ses deux extrémités $A(x=0)$ et $B(x=L)$. La corde de tension $F$, écartée de sa position d'équilibre, est abandonnée à l'instant $t=0$. Le déplacement transversal $y(x,t)$ obéit à l'équation de d'Alembert :
  $$\frac{\partial^2 y}{\partial x^2} = \frac{\mu}{F} \frac{\partial^2 y}{\partial t^2}$$

