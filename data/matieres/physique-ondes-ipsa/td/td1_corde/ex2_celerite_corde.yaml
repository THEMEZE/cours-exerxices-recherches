id: td1_ex2
intitule: "Célérité d’une onde sur une corde homogène"
td: td1
facultatif: false
seance: 1
cours_rattache:
  - chap1.celerite_corde
  - chap1.reflexion_transmission

metadonnees:
  duree_estimee: "5 min"
  difficulte: 1 # Sur une échelle de 1 à 5
  priorite: 2
  type_exercice: "Application directe du cours"
  indispensable: true

enonce_intro: |
  Deux cordes ont été nouées ensemble au point $O$ et leurs autres extrémités
  ont été attachées à deux supports rigides. La première corde est soumise à
  une tension de $400$ N. Les longueurs et masses linéiques des deux cordes
  sont : $L_1 = 3$ m, $L_2 = 2$ m, $\mu_1 = 1.4\times10^{-4}$ kg·m$^{-1}$,
  $\mu_2 = 2.8\times10^{-4}$ kg·m$^{-1}$.

figure:
  ref: td1_ex2_cordes_nouees
  legende: "Cordes nouées au point O."
  scale: 0.8
  label: "fig:cordes_nouees"

accroche_point_cours_essentiel:
  - titre: "Course entre deux impulsions"
    duree_introduction: "3 min, avant de lire l'énoncé"
    question_d_accroche: |
      Deux cordes sont nouées l'une à l'autre : l'une est deux fois plus lourde au mètre, mais plus courte. On envoie en même temps une impulsion depuis chaque extrémité. {\bf Laquelle arrive la première au nœud ?} Le plus court trajet l'emporte-t-il forcément ?
    texte: |
      {\bf Idée clé : la vitesse d'une impulsion est fixée par le milieu, pas par l'impulsion.} Sur une corde de tension $F$ et de masse linéique $\mu$, $c=\sqrt{F/\mu}$ ; la durée d'un trajet de longueur $L$ est donc $t=L/c=L\sqrt{\mu/F}$. Comme le nœud est de masse nulle, la {\bf tension est la même} des deux côtés ; seule la masse linéique change, donc la célérité.

outils_mathematiques:
  - titre: "Racine carrée et comparaison de rapports"
    texte: |
      Comparer $t_1$ et $t_2$ sans calculatrice : $\dfrac{t_1}{t_2}=\dfrac{L_1}{L_2}\sqrt{\dfrac{\mu_1}{\mu_2}}=\dfrac32\times\dfrac1{\sqrt2}\approx1{,}06>1$. Un rapport suffit, inutile de connaître $F$.
  - titre: "Proportionnalités"
    texte: |
      $c\propto\mu^{-1/2}$ : doubler $\mu$ divise $c$ par $\sqrt2$ ($\approx1{,}41$, d'où $c_1/c_2=1690/1195$). Savoir lire une loi en puissance.
  - titre: "Notation scientifique et ordres de grandeur"
    texte: |
      $1{,}4\times10^{-4}$ kg/m, $1{,}7\times10^3$ m/s, $1{,}8\times10^{-3}$ s. Une corde de piano typique a des vitesses de l'ordre de quelques centaines de m/s : les durées sont de l'ordre de la milliseconde.
  - titre: "Relation distance-vitesse-durée"
    texte: |
      $t=L/c$ : application directe de la cinématique à un signal qui avance à vitesse constante.

liens_autres_disciplines:
  - discipline: "Optique"
    texte: |
      Une corde lourde joue le rôle d'un milieu où l'onde va plus lentement, comme la lumière dans le verre (indice $n=c_0/c$). Au passage d'un milieu à l'autre, une partie de l'onde est réfléchie et une partie transmise : même phénomène qu'à la surface d'une vitre.
  - discipline: "Électronique et télécommunications"
    texte: |
      La réflectométrie envoie une impulsion dans un câble et mesure le temps d'écho : la distance à un défaut est $d=c\,\Delta t/2$. Même principe qu'au nœud entre deux cordes.
  - discipline: "Sismologie"
    texte: |
      Les ondes sismiques sont partiellement réfléchies et transmises aux interfaces entre couches de nature différente : la mesure des retards permet de reconstituer la structure du sous-sol (prospection pétrolière).

questions:
  - id: q1
    enonce: |
      Simultanément, de chaque extrémité est envoyée une impulsion vers $O$.
      Quelle est celle qui atteint $O$ la première ?

    coup_de_pouce:
      - titre: "Calcul des vitesses et durées"
        texte: |
          Calculez la vitesse de propagation dans chaque corde avec $c_i = \sqrt{F/\mu_i}$
          (la tension $F$ est identique de chaque côté), puis comparez les temps de parcours $t_i = L_i / c_i$.

    correction:
      - titre: "Résultat synthétique"
        texte: |
          $c_1 \approx 1690$ m/s, $c_2 \approx 1195$ m/s ; $t_1 = L_1/c_1 \approx 1.78$ ms, $t_2 = L_2/c_2 \approx 1.67$ ms.
          C'est l'impulsion provenant de la {\bf corde 2} qui atteint le point $O$ en premier.

    solution:
      - titre: "Calculs détaillés pas à pas"
        texte: |
          \begin{itemize}[label = $\bullet$]
            \item \underline{\em \bf Corde 1 :}
              \begin{itemize}[label = $\circ$]
                \item {\bf Célérité :} $c_1 = \sqrt{\dfrac{F}{\mu_1}} = \sqrt{\dfrac{400}{1.4\times 10^{-4}}} \approx 1690\ \text{m/s}$.
                \item {\bf Durée du trajet :} $t_1 = \dfrac{L_1}{c_1} = \dfrac{3}{1690} \approx 1.78\times 10^{-3}\ \text{s} = 1.78\ \text{ms}$.
              \end{itemize}
            \item \underline{\em \bf Corde 2 :}
              \begin{itemize}[label = $\circ$]
                \item {\bf Célérité :} $c_2 = \sqrt{\dfrac{F}{\mu_2}} = \sqrt{\dfrac{400}{2.8\times 10^{-4}}} \approx 1195\ \text{m/s}$.
                \item {\bf Durée du trajet :} $t_2 = \dfrac{L_2}{c_2} = \dfrac{2}{1195} \approx 1.67\times 10^{-3}\ \text{s} = 1.67\ \text{ms}$.
              \end{itemize}
          \end{itemize}

          Puisque $t_2 < t_1$, l'impulsion sur la corde 2 met moins de temps à parcourir la distance $L_2$ et atteint le nœud $O$ en premier.

    aller_plus_loin:
      - niveau: licence
        titre: "Que se passe-t-il au nœud O ?"
        texte: |
          Lorsque l'impulsion atteint la jonction $O$, une partie de l'onde est transmise dans l'autre corde et une partie est réfléchie. C'est l'objet de l'étude des coefficients de réflexion et de transmission (TD 3).