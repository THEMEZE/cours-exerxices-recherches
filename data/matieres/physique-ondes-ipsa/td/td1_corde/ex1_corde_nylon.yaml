  - id: q2e
    parent: "2"
    enonce: "Donner la loi $y(x,t)$."
    coup_de_pouce:
      - titre: "Forme générale"
        texte: "Une onde plane progressive sinusoïdale se propageant vers les $x$ croissants s'écrit $y(x,t)=a\\cos(kx-\\omega t+\\phi)$."
    correction:
      - titre: "Expression"
        texte: "$y(x,t) = a\\cos\\!\\big(k(x-ct)+\\phi\\big)$ avec $k=2\\pi/\\lambda$, $a$ et $\\phi$ fixés par la figure 1."

    solution:
      - titre: "Expression"
        texte: "$y(x,t) = a\\cos\\!\\big(k(x-ct)+\\phi\\big)$ avec $k=2\\pi/\\lambda$, $a$ et $\\phi$ fixés par la figure 1."


  - id: q2f
    parent: "2"
    enonce: "Quelle est la vitesse du point $P$ de la corde à l'instant $t=0$ ?"
    coup_de_pouce:
      - titre: "Vitesse particulaire vs célérité"
        texte: "La vitesse transversale d'un point est $\\partial y/\\partial t$, à ne pas confondre avec la célérité $c$ de l'onde."
    correction:
      - titre: "Derivation temporel"
        texte: "$v_y(x_P,0) = \\partial_t y(x_P,0) = a\\,\\omega\\sin(kx_P+\\phi)$, lue sur la pente de la courbe en $x_P$."

    solution:
      - titre: "Derivation temporel"
        texte: |
          $v_y(x_P,0) = \partial_t y(x_P,0) = a\,\omega\sin(kx_P+\phi)$, lue sur la pente de la courbe en $x_P$.\\

          On note $\Phi(x, t) = k(x-ct)+\phi$ la phase. Or $y(x_P,0) \propto \cos(\Phi(x_p, t=0)) = 0$ donc $v_y(x_P,0) \propto \sin(\Phi(x_p, t=0)) = \pm 1$. Donc $v_y(x_P,0)  = \pm \, a\,\omega$. 