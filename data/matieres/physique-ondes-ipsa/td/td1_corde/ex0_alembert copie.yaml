  - id: q1
    enonce: |
      Soit $f$ une fonction de classe $\mathcal{C}^2$. Montrer que

      $$
      y(x,t)=f(x-ct)
      $$

      est solution de l'équation de d'Alembert.

    prerequis : 
      - titre: "???"
