id: td1_ex0
intitule: "Solutions de l'équation de d'Alembert"
td: td1
facultatif: false
seance: 1

cours_rattache:
  - chap1.equation_d_alembert
  - chap1.ondes_progressives
  - chap1.celerite_onde

metadonnees:
  duree_estimee: "40 min"
  difficulte: 2 # Sur une échelle de 1 à 5
  type_exercice: "Application directe du cours"
  indispensable: true

enonce_intro: |
  Le déplacement transversal $y(x,t)$ d'une corde est solution de l'équation
  de d'Alembert :

  $$
  \frac{\partial^2 y}{\partial x^2}
  =
  \frac{1}{c^2}
  \frac{\partial^2 y}{\partial t^2},
  $$

  où $c$ désigne la célérité des ondes transversales se propageant le long
  de la corde.

prerequis : 
  - titre: "Dérivées partielles et composition"
    texte: |
      Savoir dériver une fonction composée à plusieurs variables par la règle
      de la chaîne ({\bf chain rule}). Connaître la définition d'une onde progressive
      et de sa célérité $c$.

objectifs_pedagogiques_etudiants :
  - titre: "Vérification formelle et sens de propagation"
    texte: |
      \begin{itemize}[label=$\bullet$]
      \item Vérifier mathématiquement qu'une fonction de la forme $f(x \mp ct)$ est solution de l'équation de d'Alembert.
      \item Associer le signe devant le terme $ct$ au sens de propagation de l'onde progressive.
      \item Utiliser la propriété de linéarité de l'équation d'onde.
      \end{itemize}

objectifs_pedagogiques_enseignants :
  - titre: "Ancrage des représentations d'ondes"
    texte: |
      \begin{itemize}[label=$\bullet$]
      \item Démystifier le formalisme des fonctions à deux variables $y(x,t)$.
      \item Faire le lien entre le mouvement spatial d'un profil et le concept d'argument constant.
      \end{itemize}

point_cours :
  - titre: "Équation de d'Alembert à 1D"
    texte: |
      Toute fonction de classe $\mathcal{C}^2$ de la forme $y(x,t) = f(x-ct) + g(x+ct)$ est solution de l'équation d'onde 1D.\\

      La fonction $f(x-ct)$ représente une onde progressive se déplaçant vers les $x$ croissants à la vitesse $c$, tandis que
      $g(x+ct)$ représente une onde se déplaçant vers les $x$ décroissants.

remarques_pedagogiques_ecueils_classiques: 
  - titre: "Confusion de signe sur le sens de propagation"
    texte: |
      Les étudiants associent souvent à tort le signe minus (« $-$ ») à un déplacement vers la gauche (vers les $x$ négatifs). Il faut insister sur le raisonnement à argument constant : si $t$ augmente, $x$ doit augmenter pour maintenir $x-ct$ constant.

remarques_pedagogiques_conseils_animation: 
  - titre: "Animation au tableau ou géométrie dynamique"
    texte: |
      Tracer au tableau un motif simple (par exemple un triangle ou une demi-sinusoïde)
      en $t=0$, puis décaler ce motif vers la droite pour matérialiser le profil en $t > 0$.
      Identifier la position d'un sommet $x_{\text{sommet}}(t) = x_0 + ct$.

bilan: 
  - titre: "Forme générale de d'Alembert"
    texte: |
      La solution générale de l'équation d'onde unidimensionnelle dans un milieu homogène
      et non dispersif est la superposition de deux ondes progressives indéformables
      se propageant en sens opposés à la célérité $c$.

aller_plus_loin: 
  - niveau: lycee
    titre: "Retard temporel"
    texte: |
      En physique au lycée, l'onde se propageant vers la droite s'écrit souvent $y(x,t) = s(t - \tau)$
      avec $\tau = x/c$ le retard à l'origine. On remarque que $t - x/c = -\frac{1}{c}(x - ct)$,
      ce qui est bien une fonction de $x-ct$.

  - niveau: prepa
    titre: "Superposition et ondes stationnaires"
    texte: |
      La superposition de deux ondes identiques se propageant en sens opposés $f(x-ct) + f(x+ct)$
      peut conduire, dans le cas d'ondes sinusoïdales, à une onde stationnaire de la forme
      $A \cos(kx) \cos(\omega t)$ où la dépendance spatiale et la dépendance temporelle sont séparées.

  - niveau: licence
    titre: "Lien avec la méthode des caractéristiques"
    texte: |
      En introduisant les variables $\xi = x-ct$ et $\eta = x+ct$, l'équation de d'Alembert
      se réduit à $\frac{\partial^2 y}{\partial \xi \partial \eta} = 0$, dont l'intégration
      directe fournit la forme $y(\xi,\eta) = f(\xi) + g(\eta)$.

  - niveau: master
    titre: "Lien avec les coordonnées caractéristiques et la notation covariante"
    texte: |
      Introduire les coordonnées caractéristiques :
      \[
        \xi=x-ct,
        \qquad
        \eta=x+ct.
      \]

      Dans ces coordonnées, l'opérateur d'onde se factorise :
      \[
        \frac{\partial^2}{\partial x^2}
        -
        \frac{1}{c^2}
        \frac{\partial^2}{\partial t^2}
        =
        4
        \frac{\partial^2}{\partial\xi\,\partial\eta}.
      \]

      Les fonctions $f(\xi)$ et $g(\eta)$ sont alors directement
      identifiées comme les deux familles d'ondes se propageant dans
      les directions opposées.

      \medskip

      \textbf{Ouverture vers la notation covariante.}

      En relativité, les coordonnées d'espace et de temps peuvent être
      regroupées dans un quadrivecteur
      \[
        x^\mu=(ct,x,y,z).
      \]
      On introduit alors la dérivée covariante
      \[
        \partial_\mu
        \equiv
        \frac{\partial}{\partial x^\mu}.
      \]
      Avec la convention de signature
      \[
        \eta_{\mu\nu}=\operatorname{diag}(1,-1,-1,-1),
      \]
      on obtient
      \[
        \partial_\mu
        =
        \left(
          \frac{1}{c}\frac{\partial}{\partial t},
          \frac{\partial}{\partial x},
          \frac{\partial}{\partial y},
          \frac{\partial}{\partial z}
        \right).
      \]

      La dérivée à indice contravariant est obtenue en relevant l'indice
      avec la métrique :
      \[
        \partial^\mu
        =
        \eta^{\mu\nu}\partial_\nu.
      \]
      Ainsi,
      \[
        \partial^\mu
        =
        \left(
          \frac{1}{c}\frac{\partial}{\partial t},
          -\frac{\partial}{\partial x},
          -\frac{\partial}{\partial y},
          -\frac{\partial}{\partial z}
        \right).
      \]

      La contraction des deux dérivées donne alors l'opérateur
      de d'Alembert :
      \[
        \boxed{
        \partial_\mu\partial^\mu
        =
        \frac{1}{c^2}\frac{\partial^2}{\partial t^2}
        -
        \nabla^2
        }.
      \]

      L'équation d'onde dans le vide,
      \[
        \frac{1}{c^2}\frac{\partial^2\psi}{\partial t^2}
        -
        \nabla^2\psi
        =0,
      \]
      peut donc s'écrire de manière compacte
      \[
        \boxed{\partial_\mu\partial^\mu\psi=0}.
      \]

      Dans le cas unidimensionnel,
      \[
        \partial_\mu\partial^\mu
        =
        \frac{1}{c^2}\frac{\partial^2}{\partial t^2}
        -
        \frac{\partial^2}{\partial x^2},
      \]
      qui est, à un signe près selon la convention choisie pour
      l'opérateur d'onde, l'opérateur rencontré précédemment.

      \medskip

      \textbf{Point important :} la distinction entre $\partial_\mu$
      et $\partial^\mu$ ne signifie pas qu'il s'agit de deux dérivées
      différentes. L'indice est simplement abaissé ou relevé à l'aide
      de la métrique :
      \[
        \partial^\mu=\eta^{\mu\nu}\partial_\nu.
      \]
      Cette notation permet d'écrire les équations relativistes sous une
      forme indépendante du choix particulier des coordonnées.

  - niveau: master
    titre: "Solutions fondamentales et fonction de Green"
    texte: |
      La formule de d'Alembert permet d'exprimer la solution du problème de Cauchy pour l'équation
      des ondes avec conditions initiales $y(x,0) = y_0(x)$ et $\frac{\partial y}{\partial t}(x,0) = v_0(x)$ :
      $y(x,t) = \frac{1}{2}[y_0(x-ct) + y_0(x+ct)] + \frac{1}{2c} \int_{x-ct}^{x+ct} v_0(s) \, \mathrm{d}s$.

  

questions:

  - id: q1
    enonce: |
      Soit $f$ une fonction de classe $\mathcal{C}^2$. Montrer que

      $$
      y(x,t)=f(x-ct)
      $$

      est solution de l'équation de d'Alembert.

    prerequis : 
      - titre: "Dérivation de fonction composée"
        texte: |
          Règle de dérivation : si $u(x,t) = x - ct$, alors $\frac{\partial}{\partial x} f(u) = \frac{\partial u}{\partial x} f'(u)$.

    objectifs_pedagogiques_etudiants :
      - titre: "Calcul des dérivées partielles secondes"
        texte: |
          Savoir dériver deux fois par rapport à $x$ et par rapport à $t$ une fonction dépendante de $x-ct$.

    objectifs_pedagogiques_enseignants :
      - titre: "Gestion des constantes multiplicatives"
        texte: |
          Vérifier que le terme $-c$ sort correctement au carré lors de la seconde dérivation temporelle.

    point_cours :
      - titre: "Onde progressive se propageant à la célérité c"
        texte: |
          Toute fonction $f(x-ct)$ vérifie algébriquement $\frac{\partial^2 y}{\partial x^2} = \frac{1}{c^2} \frac{\partial^2 y}{\partial t^2}$.

    coup_de_pouce:
      - titre: "Changement de variable"
        texte: |
          Poser $u=x-ct$. La fonction s'écrit alors $y(x,t)=f(u)$.
          Calculer successivement les dérivées partielles premières puis
          secondes par rapport à $x$ et à $t$ en utilisant la règle de
          dérivation des fonctions composées.

      - titre: "Attention aux dérivées temporelles"
        texte: |
          On a

          $$
          \frac{\partial u}{\partial x}=1
          \qquad\text{et}\qquad
          \frac{\partial u}{\partial t}=-c.
          $$

          Le facteur $-c$ apparaît donc dans chaque dérivée temporelle.

    correction:
      - titre: "Dérivées spatiales"
        texte: |
          En posant $u=x-ct$, on obtient :

          $$
          \frac{\partial y}{\partial x}
          =
          f'(u)\frac{\partial u}{\partial x}
          =
          f'(x-ct).
          $$

          Par conséquent :

          $$
          \frac{\partial^2 y}{\partial x^2}
          =
          f''(x-ct).
          $$

      - titre: "Dérivées temporelles"
        texte: |
          De même :

          $$
          \frac{\partial y}{\partial t}
          =
          f'(u)\frac{\partial u}{\partial t}
          =
          -c\,f'(x-ct).
          $$

          En dérivant une seconde fois :

          $$
          \frac{\partial^2 y}{\partial t^2}
          =
          c^2f''(x-ct).
          $$

      - titre: "Conclusion"
        texte: |
          On a donc :

          $$
          \frac{1}{c^2}
          \frac{\partial^2 y}{\partial t^2}
          =
          \frac{1}{c^2}
          c^2f''(x-ct)
          =
          f''(x-ct)
          =
          \frac{\partial^2 y}{\partial x^2}.
          $$

          Ainsi $y(x,t)=f(x-ct)$ vérifie bien l'équation de d'Alembert.

    solution:
      - titre: "Démonstration détaillée"
        texte: |
          Introduisons la variable intermédiaire :

          $$
          u=x-ct.
          $$

          La fonction étudiée s'écrit donc $y(x,t)=f(u)$.

          Comme $u$ dépend de $x$ et de $t$, les dérivées partielles sont
          obtenues par la règle de dérivation des fonctions composées.

          Pour la dérivée spatiale :

          $$
          \frac{\partial y}{\partial x}
          =
          f'(u)\frac{\partial u}{\partial x}
          =
          f'(u),
          $$

          car $\partial u/\partial x=1$. On obtient alors :

          $$
          \frac{\partial^2y}{\partial x^2}
          =
          f''(u)
          =
          f''(x-ct).
          $$

          Pour la dérivée temporelle :

          $$
          \frac{\partial y}{\partial t}
          =
          f'(u)\frac{\partial u}{\partial t}
          =
          -c\,f'(u),
          $$

          puisque $\partial u/\partial t=-c$.

          On dérive une seconde fois :

          $$
          \frac{\partial^2y}{\partial t^2}
          =
          -c\,f''(u)
          \frac{\partial u}{\partial t}
          =
          c^2f''(u).
          $$

          Ainsi :

          $$
          \frac{1}{c^2}
          \frac{\partial^2y}{\partial t^2}
          =
          f''(x-ct)
          =
          \frac{\partial^2y}{\partial x^2}.
          $$

          La fonction $y(x,t)=f(x-ct)$ est donc bien une solution de
          l'équation de d'Alembert.

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Oubli de la dérivée interne"
        texte: |
          L'erreur fréquente est d'oublier de dériver la fonction interne $u(t) = -ct$,
          ce qui conduit à oublier le facteur $-c$ ou le facteur $c^2$.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Écriture explicite des variables"
        texte: |
          Conseiller aux étudiants d'écrire explicitement la chaîne de dérivation $\frac{\partial y}{\partial t} = \frac{\mathrm{d}f}{\mathrm{d}u} \cdot \frac{\partial u}{\partial t}$ pour éviter les fautes d'inattention.

    bilan: 
      - titre: "Comportement vis-à-vis de d'Alembert"
        texte: |
          Toute fonction deux fois dérivable d'un seul bloc $(x-ct)$ est automatiquement solution de l'équation d'onde.

    aller_plus_loin: 
      - niveau: lycee
        titre: "Fonctions simples"
        texte: |
          Tester le résultat avec $f(u) = \sin(u)$ ou $f(u) = e^{-u^2}$.

      - niveau: prepa
        titre: "Équation aux dérivées partielles"
        texte: |
          Remarquer que $f$ n'a pas besoin d'être sinusoïdale : elle peut représenter un paquet d'onde ou une impulsion quelconque.

      - niveau: licence
        titre: |
          Régularité $\mathcal{C}^2$
        texte: |
          Discuter le besoin de la classe $\mathcal{C}^2$ pour la définition au sens classique des dérivées.

      - niveau: master
        titre: "Solutions faibles"
        texte: |
          Si $f$ est seulement continue par morceaux (par exemple une onde créneau), $f(x-ct)$ reste solution de l'équation des ondes au sens des distributions.

  - id: q2
    enonce: |
      Soit $g$ une fonction de classe $\mathcal{C}^2$. Montrer que

      $$
      y(x,t)=g(x+ct)
      $$

      est également solution de l'équation de d'Alembert.

    prerequis : 
      - titre: "Dérivation de fonction composée"
        texte: |
          Utilisation du changement de variable $v = x+ct$.

    objectifs_pedagogiques_etudiants :
      - titre: "Calcul analogue avec changement de signe"
        texte: |
          Observer l'effet du signe positif devant le terme $ct$ lors de la première et de la seconde dérivation.

    objectifs_pedagogiques_enseignants :
      - titre: "Invariance par parité du temps/espace dans le carré"
        texte: |
          Montrer que l'élévation au carré de la dérivée première efface le signe de $c$, conduisant au même résultat que pour $f(x-ct)$.

    point_cours :
      - titre: "Onde rétrograde"
        texte: |
          La fonction $g(x+ct)$ est une solution de d'Alembert associée à une propagation en sens inverse.

    coup_de_pouce:
      - titre: "Même méthode"
        texte: |
          Poser cette fois :

          $$
          u=x+ct.
          $$

          Calculer les dérivées secondes par rapport à $x$ et à $t$.

      - titre: "Comparaison avec la question précédente"
        texte: |
          La seule différence est le signe de $c$ dans la dérivée première
          par rapport au temps. Que devient ce signe après deux dérivations ?

    correction:
      - titre: "Calcul des dérivées"
        texte: |
          Pour $u=x+ct$ :

          $$
          \frac{\partial^2y}{\partial x^2}
          =
          g''(x+ct).
          $$

          De plus :

          $$
          \frac{\partial y}{\partial t}
          =
          c\,g'(x+ct),
          $$

          puis :

          $$
          \frac{\partial^2y}{\partial t^2}
          =
          c^2g''(x+ct).
          $$

      - titre: "Conclusion"
        texte: |
          Ainsi :

          $$
          \frac{1}{c^2}
          \frac{\partial^2y}{\partial t^2}
          =
          g''(x+ct)
          =
          \frac{\partial^2y}{\partial x^2}.
          $$

          La fonction $y(x,t)=g(x+ct)$ est donc également solution de
          l'équation de d'Alembert.

    solution:
      - titre: "Démonstration détaillée"
        texte: |
          Posons :

          $$
          u=x+ct.
          $$

          On a alors $y(x,t)=g(u)$.

          Pour les dérivées spatiales :

          $$
          \frac{\partial y}{\partial x}
          =
          g'(u)\frac{\partial u}{\partial x}
          =
          g'(u),
          $$

          puis :

          $$
          \frac{\partial^2y}{\partial x^2}
          =
          g''(u)
          =
          g''(x+ct).
          $$

          Pour les dérivées temporelles :

          $$
          \frac{\partial y}{\partial t}
          =
          g'(u)\frac{\partial u}{\partial t}
          =
          c\,g'(u).
          $$

          En dérivant une seconde fois :

          $$
          \frac{\partial^2y}{\partial t^2}
          =
          c\,g''(u)
          \frac{\partial u}{\partial t}
          =
          c^2g''(u).
          $$

          Il vient donc :

          $$
          \frac{1}{c^2}
          \frac{\partial^2y}{\partial t^2}
          =
          g''(x+ct)
          =
          \frac{\partial^2y}{\partial x^2}.
          $$

          La fonction $y(x,t)=g(x+ct)$ est donc solution de l'équation
          de d'Alembert.

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Inversion de signe intempestive"
        texte: |
          Attention à ne pas réintroduire un signe moins par habitude lors de la dérivation de $x+ct$.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Rapidité d'exécution"
        texte: |
          Encourager les étudiants à aller plus vite sur cette question en mettant en valeur la symétrie avec la Q1.

    bilan: 
      - titre: "Symétrie spatio-temporelle"
        texte: |
          L'équation des ondes ne distingue pas la direction de propagation $x-ct$ de $x+ct$ car le temps y apparaît au carré ($\partial^2/\partial t^2$).

    aller_plus_loin: 
      - niveau: lycee
        titre: "Exemple concret"
        texte: |
          Une onde réfléchie sur un obstacle revient vers l'origine : elle est décrite par une fonction du type $g(x+ct)$.

      - niveau: prepa
        titre: "Invariance par réflexion"
        texte: |
          C'est la parité spatio-temporelle de l'opérateur $\square = \frac{\partial^2}{\partial x^2} - \frac{1}{c^2}\frac{\partial^2}{\partial t^2}$ qui garantit cette double possibilité.

      - niveau: licence
        titre: "Ondes stationnaires"
        texte: |
          $g(x+ct)$ permet d'annuler les conditions aux limites (ex: corde fixée à une extrémité).

      - niveau: master
        titre: "Invariance de Lorentz"
        texte: |
          L'équation d'onde est invariante sous les transformations de Lorentz, conservant le cône de lumière $x^2 - c^2t^2 = 0$.

  - id: q3
    enonce: |
      En déduire que toute fonction de la forme

      $$
      y(x,t)=f(x-ct)+g(x+ct)
      $$

      est également solution de l'équation de d'Alembert.

    prerequis : 
      - titre: "Linéarité de la dérivation"
        texte: |
          Propriété de l'opérateur dérivée : $\frac{\partial}{\partial x}(u+v) = \frac{\partial u}{\partial x} + \frac{\partial v}{\partial x}$.

    objectifs_pedagogiques_etudiants :
      - titre: "Principe de superposition"
        texte: |
          Comprendre et appliquer le principe de superposition pour une équation différentielle linéaire et homogène.

    objectifs_pedagogiques_enseignants :
      - titre: "Structure de l'espace des solutions"
        texte: |
          Faire prendre conscience que l'ensemble des solutions forme un espace vectoriel.

    point_cours :
      - titre: "Principe de superposition"
        texte: |
          Toute combinaison linéaire de solutions d'une équation linéaire homogène est encore une solution.

    coup_de_pouce:
      - titre: "Linéarité"
        texte: |
          L'équation de d'Alembert est une équation différentielle
          linéaire homogène.

          Si deux fonctions sont solutions, étudier ce que deviennent les
          dérivées secondes de leur somme.

    correction:
      - titre: "Principe de superposition"
        texte: |
          Les fonctions

          $$
          y_1(x,t)=f(x-ct)
          $$

          et

          $$
          y_2(x,t)=g(x+ct)
          $$

          sont toutes deux solutions de l'équation de d'Alembert.

          Comme les dérivées partielles sont linéaires :

          $$
          \frac{\partial^2(y_1+y_2)}{\partial x^2}
          =
          \frac{\partial^2y_1}{\partial x^2}
          +
          \frac{\partial^2y_2}{\partial x^2},
          $$

          et :

          $$
          \frac{\partial^2(y_1+y_2)}{\partial t^2}
          =
          \frac{\partial^2y_1}{\partial t^2}
          +
          \frac{\partial^2y_2}{\partial t^2}.
          $$

          La somme $y=y_1+y_2$ est donc également solution.

    solution:
      - titre: "Principe de superposition"
        texte: |
          Posons :

          $$
          y_1(x,t)=f(x-ct)
          \qquad\text{et}\qquad
          y_2(x,t)=g(x+ct).
          $$

          D'après les deux questions précédentes :

          $$
          \frac{\partial^2y_1}{\partial x^2}
          =
          \frac{1}{c^2}
          \frac{\partial^2y_1}{\partial t^2}
          $$

          et :

          $$
          \frac{\partial^2y_2}{\partial x^2}
          =
          \frac{1}{c^2}
          \frac{\partial^2y_2}{\partial t^2}.
          $$

          Pour $y=y_1+y_2$, la linéarité des dérivées donne :

          $$
          \frac{\partial^2y}{\partial x^2}
          =
          \frac{\partial^2y_1}{\partial x^2}
          +
          \frac{\partial^2y_2}{\partial x^2}.
          $$

          En utilisant les équations vérifiées par $y_1$ et $y_2$ :

          $$
          \frac{\partial^2y}{\partial x^2}
          =
          \frac{1}{c^2}
          \left(
          \frac{\partial^2y_1}{\partial t^2}
          +
          \frac{\partial^2y_2}{\partial t^2}
          \right).
          $$

          Finalement :

          $$
          \boxed{
          \frac{\partial^2y}{\partial x^2}
          =
          \frac{1}{c^2}
          \frac{\partial^2y}{\partial t^2}
          }
          $$

          et donc :

          $$
          \boxed{
          y(x,t)=f(x-ct)+g(x+ct)
          }
          $$

          est une solution de l'équation de d'Alembert.

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Refaire tous les calculs de dérivées"
        texte: |
          Certains étudiants re-dérivent tout depuis le début au lieu d'invoquer simplement la linéarité de l'opérateur d'onde.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Insister sur la mot-clé Linéarité"
        texte: |
          Profiter de cette question pour faire verbaliser le concept de système linéaire et de principe de superposition.

    bilan: 
      - titre: "Théorème de d'Alembert"
        texte: |
          La somme de deux ondes se propageant en sens opposés reste une solution exacte de l'équation d'onde.

    aller_plus_loin: 
      - niveau: lycee
        titre: "Croisement d'ondes"
        texte: |
          Deux vagues arrivant en sens inverse se croisent, s'additionnent, puis poursuivent leur chemin sans altération.
      
      - niveau: prepa
        titre: "Linéarité de l'équation de d'Alembert"
        texte: |
          L'équation de d'Alembert pour une onde se propageant dans un milieu
          homogène s'écrit
          \[
            \frac{\partial^2 y}{\partial t^2}
            -
            c^2\frac{\partial^2 y}{\partial x^2}
            =0.
          \]
          On peut introduire l'opérateur d'onde
          \[
            \mathcal{D}
            =
            \frac{\partial^2}{\partial t^2}
            -
            c^2\frac{\partial^2}{\partial x^2}.
          \]
          Cet opérateur est \textbf{linéaire} : pour deux fonctions $y_1$ et
          $y_2$ et deux constantes $\alpha$ et $\beta$,
          \[
            \mathcal{D}(\alpha y_1+\beta y_2)
            =
            \alpha\mathcal{D}(y_1)
            +
            \beta\mathcal{D}(y_2).
          \]
          Ainsi, si $y_1$ et $y_2$ sont deux solutions de l'équation de
          d'Alembert, alors
          \[
            y=\alpha y_1+\beta y_2
          \]
          est également une solution. C'est la base mathématique du
          \textbf{principe de superposition} des ondes.

          En revanche, si l'équation comportait un terme non linéaire, par
          exemple
          \[
            \frac{\partial^2 y}{\partial t^2}
            -
            c^2\frac{\partial^2 y}{\partial x^2}
            +\lambda y^2=0,
          \]
          l'opérateur associé ne serait plus linéaire et le principe de
          superposition ne serait plus valable en général.

          \textbf{À retenir :} la superposition des ondes n'est pas une
          propriété indépendante de l'équation : elle découle directement de
          la linéarité de l'équation de propagation.

      - niveau: prepa
        titre: "Équations non linéaires"
        texte: |
          Si l'équation contenait des termes non linéaires (ex: $y^2$), le principe de superposition ne s'appliquerait plus.

      - niveau: licence
        titre: "Analyse spectrale"
        texte: |
          Toute solution peut être décomposée en une somme (ou intégrale) de Fourier de fonctions sinusoïdales $\alpha_k e^{i(kx-\omega t)} + \beta_k e^{i(kx+\omega t)}$.

      - niveau: master
        titre: "Croisement de solitones"
        texte: |
          Pour des équations non linéaires intégratibles (type KdV), les solitons se croisent avec seulement un déphasage, mimant la linéarité.

  - id: q4_intro
    enonce: |
      On rappelle qu'une onde progressive correspond à un profil qui se
      déplace sans se déformer.

      On suit un point identifiable du profil, par exemple une crête ou un
      creux, repéré par une valeur constante de l'argument de la fonction.

    is_intro_only: true

    prerequis : 
      - titre: "Concept de profil d'onde"
        texte: |
          Représentation graphique de $y(x,t)$ en fonction de $x$ à un instant $t$ donné.

    objectifs_pedagogiques_etudiants :
      - titre: "Compréhension de l'argument de phase"
        texte: |
          Associer la conservation de la forme d'une onde à la conservation de la valeur de l'argument de sa fonction.

    objectifs_pedagogiques_enseignants :
      - titre: "Introduction à la méthode de la phase constante"
        texte: |
          Préparer la démonstration graphique et algébrique du sens de propagation.

    point_cours :
      - titre: "Phase/Argument constant"
        texte: |
          Suivre un point d'une onde au cours du temps revient à imposer que l'argument de la fonction reste constant.

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Confusion entre déplacement de matière et déplacement d'onde"
        texte: |
          Rappeler qu'un point du profil (ex: le sommet) se déplace le long de l'axe $x$, mais que le milieu (la corde) oscille localement.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Utiliser une image parlante"
        texte: |
          Prendre l'analogie d'une « ola » dans un stade : le motif tourne, mais les spectateurs restent sur place.

    bilan: 
      - titre: "Condition de suivi de motif"
        texte: |
          Pour un motif invariant, $\text{argument} = \text{constante}$.

    aller_plus_loin: 
      - niveau: lycee
        titre: "Observation d'une vague"
        texte: |
          Sur l'eau, on suit des yeux la crête de la vague qui avance.

      - niveau: prepa
        titre: "Vitesse de phase"
        texte: |
          La vitesse à laquelle se déplace ce point d'argument constant est la vitesse de phase $v_\varphi = \frac{\mathrm{d}x}{\mathrm{d}t}$.

      - niveau: licence
        titre: "Paquets d'ondes"
        texte: |
          Pour un paquet d'ondes dispersif, il faut distinguer la vitesse de phase (vitesse des crêtes) de la vitesse de groupe (vitesse de l'enveloppe).

      - niveau: master
        titre: "Propagateurs"
        texte: |
          Dans les milieux non homogènes, les courbes d'argument constant deviennent les caractéristiques le long desquelles l'information se propage.

  - id: q4a
    parent: "4"
    enonce: |
      Pour une onde :

      $$
      y(x,t)=f(x-ct),
      $$

      on note $(x_1,t_1)$ puis $(x_2,t_2)$, avec $t_2>t_1$, les coordonnées
      de ce même point du profil à deux instants différents.

      Montrer que :

      $$
      x_2=x_1+c(t_2-t_1).
      $$

      Représenter schématiquement le profil de l'onde aux instants $t_1$
      et $t_2$ sur un même graphique, en faisant apparaître le déplacement
      du point considéré. Conclure quant au sens de propagation de l'onde.

    # figure:
    #   - ref: td1_ex0_onde_x_minus_ct
    #     legende: |
    #       Translation du profil d'une onde $y(x,t)=f(x-ct)$ entre
    #       les instants $t_1$ et $t_2$.
    #     scale: 0.7
    #     label: "fig:onde_x_minus_ct"

    prerequis : 
      - titre: "Maniement des inégalités"
        texte: |
          Si $t_2 > t_1$ et $c > 0$, alors $c(t_2-t_1) > 0$.

    objectifs_pedagogiques_etudiants :
      - titre: "Démonstration du sens de propagation"
        texte: |
          Établir formellement que $f(x-ct)$ se propage vers les $x$ croissants.

    objectifs_pedagogiques_enseignants :
      - titre: "Interprétation graphique de la translation"
        texte: |
          Faire lier l'équation $x_2 = x_1 + c\Delta t$ à une translation spatiale vers la droite de quantité $c\Delta t$.

    point_cours :
      - titre: "Onde progressive dans le sens direct"
        texte: |
          L'expression $f(x-ct)$ décrit une onde progressive se propageant dans le sens des $x$ croissants à la célérité $c$.

    coup_de_pouce:
      - titre: "Même point du profil"
        texte: |
          Une crête donnée correspond à la même valeur de l'argument de
          la fonction $f$ aux deux instants :

          $$
          x_1-ct_1=x_2-ct_2.
          $$

          Isoler ensuite $x_2$.

      - titre: "Interprétation"
        texte: |
          Puisque $t_2>t_1$ et $c>0$, comparer $x_2$ et $x_1$.

    correction:
      - titre: "Position du même point du profil"
        texte: |
          Pour suivre exactement le même motif, l'argument de la fonction
          doit rester constant :

          $$
          x_1-ct_1=x_2-ct_2.
          $$

          On obtient alors :

          $$
          x_2=x_1+c(t_2-t_1).
          $$

      - titre: "Sens de propagation"
        texte: |
          Comme $t_2>t_1$ et $c>0$ :

          $$
          x_2>x_1.
          $$

          Le point suivi se déplace donc vers les valeurs croissantes de
          $x$.

          L'onde $f(x-ct)$ se propage dans le sens des $x$ croissants.

    solution:
      - titre: "Suivi d'une crête"
        texte: |
          Considérons une crête particulière du profil. Sa position
          correspond à une valeur constante de l'argument de la fonction
          $f$.

          À l'instant $t_1$, son argument vaut :

          $$
          x_1-ct_1.
          $$

          À l'instant $t_2$, ce même point du profil est situé en $x_2$.
          Son argument est donc :

          $$
          x_2-ct_2.
          $$

          Puisqu'il s'agit du même point du profil :

          $$
          x_1-ct_1=x_2-ct_2.
          $$

          En isolant $x_2$, on obtient :

          $$
          \boxed{
          x_2=x_1+c(t_2-t_1)
          }.
          $$

          Le déplacement spatial du motif vaut donc :

          $$
          \Delta x=x_2-x_1=c(t_2-t_1).
          $$

          Puisque $c>0$ et $t_2-t_1>0$, on a $\Delta x>0$.

          Le profil entier est donc translaté vers la droite, c'est-à-dire
          dans le sens des $x$ croissants.

          Ainsi :

          $$
          \boxed{
          y(x,t)=f(x-ct)
          \quad\text{est une onde se propageant vers les }x\text{ croissants.}
          }
          $$

        figure:
          - ref: td1_ex0_onde_x_minus_ct
            legende: |
              Translation du profil d'une onde $y(x,t)=f(x-ct)$ entre
              les instants $t_1$ et $t_2$.
            scale: 0.7
            label: "fig:onde_x_minus_ct"

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Piège du signe moins"
        texte: |
          Beaucoup d'étudiants pensent que le « $-$ » signifie une propagation vers la gauche. La preuve montre clairement l'inverse.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Tracer de graphe"
        texte: |
          Demander aux étudiants de dessiner la courbe $y=f(x)$ puis $y=f(x-2)$ pour bien visualiser le glissement vers la droite.

    bilan: 
      - titre: "Règle du signe pour la propagation"
        texte: |
          $f(x-ct) \implies$ propagation vers les $x$ croissants ($x_2 > x_1$).

    aller_plus_loin: 
      - niveau: lycee
        titre: "Sens direct"
        texte: |
          Une onde de choc créée à gauche avance vers la droite au cours du temps.

      - niveau: prepa
        titre: "Dérivation temporelle du suivi"
        texte: |
          En dérivant $x(t) - ct = \text{Cte}$ par rapport à $t$, on obtient directement la vitesse de la crête $\frac{\mathrm{d}x}{\mathrm{d}t} = +c > 0$.

      - niveau: licence
        titre: "Représentation complexe"
        texte: |
          Une onde plane $e^{i(kx-\omega t)}$ a pour argument $k(x - \frac{\omega}{k}t)$, ce qui équivaut à $x-ct$ avec $c=\omega/k$.

      - niveau: master
        titre: "Ondes dans l'espace 3D"
        texte: |
          L'équivalent 3D est une onde plane progressive $f(\mathbf{k}\cdot\mathbf{r} - \omega t)$ se propageant dans la direction du vecteur d'onde $\mathbf{k}$.

  - id: q4b
    parent: "4"
    enonce: |
      Reprendre les mêmes questions pour une onde :

      $$
      y(x,t)=g(x+ct).
      $$

      Conclure quant au sens de propagation de cette onde.

    

    prerequis : 
      - titre: "Raisonnements de la question 4a"
        texte: |
          Maniement de l'argument de phase constant.

    objectifs_pedagogiques_etudiants :
      - titre: "Démonstration de la propagation rétrograde"
        texte: |
          Établir formellement que $g(x+ct)$ se propage vers les $x$ décroissants.

    objectifs_pedagogiques_enseignants :
      - titre: "Consolidation des acquis"
        texte: |
          Ancrer définitivement le lien entre signe dans l'argument et sens de propagation.

    point_cours :
      - titre: "Onde progressive rétrograde"
        texte: |
          L'expression $g(x+ct)$ décrit une onde progressive se propageant dans le sens des $x$ décroissants à la célérité $c$.

    coup_de_pouce:
      - titre: "Argument constant"
        texte: |
          Pour suivre le même point du profil :

          $$
          x_1+ct_1=x_2+ct_2.
          $$

          Isoler $x_2$ et comparer sa valeur à $x_1$.

    correction:
      - titre: "Position du même point du profil"
        texte: |
          Le même motif est caractérisé par une valeur constante de
          l'argument :

          $$
          x_1+ct_1=x_2+ct_2.
          $$

          On obtient :

          $$
          x_2=x_1-c(t_2-t_1).
          $$

      - titre: "Sens de propagation"
        texte: |
          Puisque $t_2>t_1$ et $c>0$ :

          $$
          x_2<x_1.
          $$

          Le point du profil se déplace donc vers les valeurs décroissantes
          de $x$.

          L'onde $g(x+ct)$ se propage dans le sens des $x$ décroissants.

    solution:
      - titre: "Suivi d'un motif"
        texte: |
          Pour suivre un même point identifiable du profil, l'argument de
          la fonction $g$ doit rester constant.

          On écrit donc :

          $$
          x_1+ct_1=x_2+ct_2.
          $$

          En isolant $x_2$ :

          $$
          x_2=x_1-c(t_2-t_1).
          $$

          Le déplacement du motif vaut ainsi :

          $$
          \Delta x=x_2-x_1=-c(t_2-t_1).
          $$

          Comme $t_2>t_1$ et $c>0$, on a :

          $$
          \Delta x<0.
          $$

          Le profil se déplace donc vers les valeurs décroissantes de $x$.

          Ainsi :

          $$
          \boxed{
          y(x,t)=g(x+ct)
          \quad\text{est une onde se propageant vers les }x\text{ décroissants.}
          }
          $$
        figure:
          - ref: td1_ex0_onde_x_plus_ct
            legende: |
              Translation du profil d'une onde $y(x,t)=g(x+ct)$ entre
              les instants $t_1$ et $t_2$.
            scale: 0.7
            label: "fig:onde_x_plus_ct"

        

    remarques_pedagogiques_ecueils_classiques: 
      - titre: "Confondre célérité et vitesse algébrique"
        texte: |
          La célérité $c$ est toujours positive par définition. C'est la vitesse algébrique de propagation qui vaut $v = \frac{\mathrm{d}x}{\mathrm{d}t} = -c < 0$.

    remarques_pedagogiques_conseils_animation: 
      - titre: "Synthèse sous forme de tableau"
        texte: |
          Proposer au tableau un récapitulatif synthétique : $x-ct \leftrightarrow$ vers la droite ($x$ croissants) ; $x+ct \leftrightarrow$ vers la gauche ($x$ décroissants).

    bilan: 
      - titre: "Règle générale de propagation"
        texte: |
          $g(x+ct) \implies$ propagation vers les $x$ décroissants ($\Delta x < 0$).

    aller_plus_loin:
      - niveau: lycee
        titre: "Sens de propagation"
        texte: |
          Retenir la règle pratique :

          $$
          f(x-ct)
          $$

          correspond à une propagation vers la droite, dans le sens des
          $x$ croissants, tandis que :

          $$
          g(x+ct)
          $$

          correspond à une propagation vers la gauche, dans le sens des
          $x$ décroissants.

      - niveau: prepa
        titre: "Vitesse de phase"
        texte: |
          Pour une onde sinusoïdale :

          $$
          y(x,t)=A\cos(kx-\omega t+\phi),
          $$

          une surface de phase constante vérifie :

          $$
          kx-\omega t=\text{constante}.
          $$

          On retrouve ainsi une vitesse de propagation :

          $$
          v_\varphi=\frac{\omega}{k}=c.
          $$

      - niveau: licence
        titre: "Solution générale de d'Alembert"
        texte: |
          La solution générale de l'équation de d'Alembert à une dimension
          peut s'écrire :

          $$
          y(x,t)=f(x-ct)+g(x+ct).
          $$

          Elle correspond à la superposition de deux ondes progressives se
          propageant en sens opposés.

      - niveau: master
        titre: "Lien avec les coordonnées caractéristiques"
        texte: |
          Introduire les coordonnées caractéristiques :

          $$
          \xi=x-ct,
          \qquad
          \eta=x+ct.
          $$

          Dans ces coordonnées, l'opérateur d'onde se factorise :

          $$
          \frac{\partial^2}{\partial x^2}
          -
          \frac{1}{c^2}
          \frac{\partial^2}{\partial t^2}
          =
          4
          \frac{\partial^2}{\partial\xi\partial\eta}.
          $$

          Les fonctions $f(\xi)$ et $g(\eta)$ sont alors directement
          identifiées comme les deux familles d'ondes se propageant dans
          les directions opposées.