id: td1_ex6
intitule: |
  (*) Grandeurs numériques : mesures, incertitudes $\&$ chiffres significatifs
td: td1
facultatif: false
seance: 1

cours_rattache:
  - chap1.mesures_et_incertitudes

metadonnees:
  duree_estimee: "25 min"
  difficulte: 1 # Sur une échelle de 1 à 5
  type_exercice: "Révision"
  indispensable: true

enonce_intro: |
  Cet exercice aborde la manipulation des grandeurs expérimentales, la gestion des incertitudes et l'application stricte des règles sur les chiffres significatifs lors des opérations physiques.

prerequis : 
  - titre: |
      Notions de base de métrologie
    texte: |
      Connaître les opérations arithmétiques de base, la notion de pourcentage, l'écriture scientifique et la définition d'un chiffre significatif.

objectifs_pedagogiques_etudiants :
  - titre: |
      Savoir présenter un résultat expérimental
    texte: |
      * Distinguer incertitude absolue et incertitude relative.
      * Écrire un résultat sous la forme $x = (x_m \pm \Delta x) \text{ unité}$ de manière cohérente.
      * Conserver le bon nombre de chiffres significatifs après une opération (somme ou produit).

objectifs_pedagogiques_enseignants :
  - titre: |
      Installer la rigueur métrologique dès le début d'année
    texte: |
      * Éliminer l'habitude de recopier les affichages complets des calculatrices.
      * Faire prendre conscience qu'une mesure physique n'est jamais exacte et n'a de sens sans son unité.

coup_de_pouce: 
  - titre: |
      Gestion des chiffres significatifs
    texte: |
      * Pour une addition/soustraction, aligne les puissances de 10 puis compte le nombre de chiffres **après la virgule** (décimales).
      * Pour une multiplication/division, compte le nombre total de **chiffres significatifs** des données entrantes.
      * L'incertitude absolue subit la même unité et la même dimension que la grandeur mesurée.

point_cours :
  - titre: |
      Incertitudes et chiffres significatifs
    texte: |
      * **Incertitude absolue** $\Delta x$ : même dimension et unité que $x$. Elle s'arrondit généralement à $1$ seul chiffre significatif par excès.
      * **Incertitude relative** $\frac{\Delta x}{x}$ : grandeur adimensionnelle (souvent exprimée en $\%$).
      * Le dernier chiffre significatif conservé sur la valeur mesurée $x_m$ doit correspondre à la position du chiffre de l'incertitude $\Delta x$.

remarques_pedagogiques_ecueils_classiques: 
  - titre: |
      Erreurs récurrentes chez les étudiants
    texte: |
      * Incohérence du nombre de décimales entre la valeur mesurée et l'incertitude absolue (ex. $15,62 \pm 0,042$).
      * Oubli des parenthèses lors du facteur d'échelle ou de l'unité : écrire $15,6 \pm 0,3 \text{ g}$ au lieu de $(15,6 \pm 0,3) \text{ g}$.
      * Inversion des règles entre addition (comptage des décimales) et multiplication (comptage des chiffres significatifs).

remarques_pedagogiques_conseils_animation: 
  - titre: |
      Pédagogie en classe
    texte: |
      * Demander aux étudiants ce que leur affiche la calculatrice pour $\pi \times 1,26^2 \times 7,3$ pour leur faire prendre conscience de l'absurdité physique de recopier $10$ chiffres.
      * Insister sur le fait que la précision d'un résultat ne peut jamais dépasser la précision de la donnée la moins précise.

bilan: 
  - titre: |
      Synthèse de l'exercice
    texte: |
      Toute mesure physique est indissociable de son incertitude et de son unité. L'application rigoureuse des règles de calcul évite de surévaluer artificiellement la précision d'un résultat.

aller_plus_loin: 
  - niveau: lycee
    titre: |
      Vocabulaire des mesures
    texte: |
      Identifier l'incertitude de lecture sur des instruments gradués (règle, éprouvette) ou digitaux (balance).

  - niveau: prepa
    titre: |
      Propagation des incertitudes
    texte: |
      Utiliser la méthode des différentielles logarithmiques ou le calcul d'incertitude-type composée (NF EN ISO/IEC Guide 98-3) pour des fonctions à plusieurs variables.

  - niveau: licence
    titre: |
      Incertitudes de type A et B
    texte: |
      Évaluer l'incertitude-type par approche statistique (Type A, écart-type de la moyenne) ou par loi de probabilité a priori (Type B, distribution uniforme/rectangulaire).

  - niveau: master
    titre: |
      Inférence bayésienne en métrologie
    texte: |
      Traiter l'ajustement de données expérimentales complexes et estimer les incertitudes via des méthodes Monte-Carlo.

questions:

  - id: q1

    enonce: |
      {\bf Mesures $\&$ incertitudes}\\

      Les valeurs numériques obtenues à partir de mesures comportent toujours une incertitude.\\

      Soit une mesure de la masse $m$ dont le résultat est $15,6 ~g$ avec une incertitude de $2 \%$


      \begin{enumerate}[label=\alph*)]
        \item Donner l’incertitude relative et absolue de la mesure, en précisant leur dimension.
        \item Comment écrit-on le résultat de la mesure de $m$?
        \item Donner l’intervalle contenant la valeur réelle.
        \item Combien de chiffres significatifs contient la mesure ? Le chiffre 6 est-il certain ?
      \end{enumerate}

    point_cours :
      - titre: |
          Définitions de base
        texte: |
          Soit $x$ une grandeur physique.\\
          \begin{itemize}[label=$\bullet$]
            \item L’{\bf incertitude absolue} sur $x$, notée $\Delta x$ est la différence entre la valeur mesurée $x_m$ et la valeur exacte $x_e$ (vraie valeur inaccessible) :
              $$
              \Delta x = \vert x_m - x_e \vert \quad \text{Donc } x_e = x_m \pm \Delta x
              $$
            \item L’{\bf incertitude relative} sur $x$ est le quotient : ${\displaystyle \frac{\Delta x}{x_m}}$
          \end{itemize}
          En général, l’erreur sur la mesure (absolue ou relative) est une donnée de l’expérience. Elle dépend des méthodes de mesure et de l’appareillage.

    coup_de_pouce: 
      - titre: |
          Calcul de $\Delta m$
        texte: |
          Calculer l'incertitude absolue en effectuant $2\%$ de $15,6 \text{ g}$, puis arrondir l'incertitude absolue à $1$ chiffre significatif par excès.

    solution: 
      - titre: |
          Correction détaillée de la question 1
        texte : |
          \begin{enumerate}[label=\alph*)]
            \item 
            \begin{itemize}[label=$\bullet$]
              \item **Incertitude relative** : $\frac{\Delta m}{m} = 2 \% = 0,02$. Elle est adimensionnelle (dimension 1).
              \item **Incertitude absolue** : $\Delta m = 0,02 \times 15,6 \text{ g} = 0,312 \text{ g}$. En arrondissant à un chiffre significatif par excès : $\Delta m = 0,3 \text{ g}$. Sa dimension est une masse ($[\Delta m] = M$).
            \end{itemize}
            \item L'écriture rigoureuse demande d'aligner le nombre de décimales de la valeur mesurée sur celui de l'incertitude absolue :
            $$m = (15,6 \pm 0,3) \text{ g}$$
            \item L'intervalle de confiance est $m_e \in [15,6 - 0,3 ~;~ 15,6 + 0,3]$, soit $m_e \in [15,3 \text{ g} ~;~ 15,9 \text{ g}]$.
            \item La valeur $15,6 \text{ g}$ comporte **3 chiffres significatifs** ($1$, $5$ et $6$). Le chiffre $6$ est incertain (sa valeur réelle oscille entre $3$ et $9$).
          \end{enumerate}

  - id: q2

    enonce: |
      {\bf Expression rigoureuse d’une grandeur numérique}\\

      \begin{enumerate}[label=\alph*)]
        \item Indiquer si ces écritures sont correctes pour la mesure de la longueur $\ell$ :
          \begin{itemize}[label=$\bullet$]
            \item $\ell = 15,62 \pm 0,016 ~ cm$
            \item $\ell = 15,62 \pm 0,08$
            \item $\ell = 15,62 \pm 0,04 ~ cm$
          \end{itemize}
        \item Calculer le volume $V$ d’un cylindre de rayon $r= 1,26 ~ cm$ et de hauteur $h= 7,3 ~cm$.
        \item Exprimer avec le bon nombre de chiffres significatifs la somme de : $0,056 \times 10^2 + 11,8 \times 10^{-1}$
      \end{enumerate}

    point_cours :
      - titre: |
          Règles de présentation et de calcul
        texte: |
          Symbole de la grandeur = (Valeur numérique $\pm$ Incertitude) (Symbole de l’unité).\\
          \begin{itemize}[label=$\bullet$]
            \item L’unité de la grandeur numérique doit toujours être précisée.
            \item La valeur numérique est donnée en écriture scientifique de préférence.
            \item Le {\bf nombre} de {\bf chiffres significatifs} doit être adapté à la précision de la mesure.
            \item Le résultat d’une addition/soustraction comporte au maximum autant de décimales que la grandeur qui en a le moins.
            \item Le résultat d’un produit/quotient comporte au maximum autant de chiffres significatifs que le facteur qui en a le moins.
          \end{itemize}

    coup_de_pouce: 
      - titre: |
          Calculs géométriques et sommes
        texte: |
          * Volume du cylindre : $V = \pi r^2 h$. Compter le nombre de CS de $r$ ($3$ CS) et $h$ ($2$ CS).
          * Pour la somme : écrire les deux nombres avec la même puissance de $10$ avant d'additionner.

    solution: 
      - titre: |
          Correction détaillée de la question 2
        texte : |
          \begin{enumerate}[label=\alph*)]
            \item 
            \begin{itemize}[label=$\bullet$]
              \item $\ell = 15,62 \pm 0,016 \text{ cm}$ : **Incorrecte**. L'incertitude a $3$ décimales alors que la valeur mesurée n'en a que $2$. De plus, il manque des parenthèses.
              \item $\ell = 15,62 \pm 0,08$ : **Incorrecte**. L'unité est absente.
              \item $\ell = 15,62 \pm 0,04 \text{ cm}$ : **Incorrecte** (sans parenthèses), mais la cohérence des décimales est respectée. L'écriture rigoureuse est $\ell = (15,62 \pm 0,04) \text{ cm}$.
            \end{itemize}
            \item $V = \pi \times r^2 \times h = \pi \times (1,26)^2 \times 7,3 \approx 36,408 \text{ cm}^3$.\\
            Le facteur le moins précis est $h = 7,3 \text{ cm}$ ($2$ chiffres significatifs). Le résultat doit donc être arrondi à **2 chiffres significatifs** :
            $$V = 36 \text{ cm}^3 \quad \text{ou} \quad V = 3,6 \times 10^1 \text{ cm}^3$$
            \item Ramenons les deux termes à la même puissance de $10$ (par exemple $10^0 = 1$) :
            $$A = 0,056 \times 10^2 = 5,6 \quad (\text{1 décimale})$$
            $$B = 11,8 \times 10^{-1} = 1,18 \quad (\text{2 décimales})$$
            La somme donne $5,6 + 1,18 = 6,78$. Le résultat doit être arrondi à la donnée ayant le moins de décimales ($1$ seule décimale, imposée par $5,6$) :
            $$\text{Somme} = 6,8$$
          \end{enumerate}