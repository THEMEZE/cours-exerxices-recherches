  #     =\frac{1}{3{,}6}\,\mathrm{m/s}.
  #     \]

  #     Donc, pour passer de $\mathrm{km/h}$ à $\mathrm{m/s}$,
  #     on divise par $3{,}6$, et pour passer de $\mathrm{m/s}$ à
  #     $\mathrm{km/h}$, on multiplie par $3{,}6$.

remarques_pedagogiques_ecueils_classiques: 
  - titre: |
      Écueils classiques

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Confusion entre dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Les étudiants confondent fréquemment la dimension d'une grandeur
              et son unité.

              Rappeler que $\mathsf{L}\mathsf{T}^{-1}$ est une dimension,
              tandis que $\mathrm{m}\cdot\mathrm{s}^{-1}$ est une unité.
          \end{itemize}

        \item {\bf Confusion entre grandeur fondamentale et dérivée}
          \begin{itemize}[label = $\circ$]
            \item Faire expliciter la relation qui définit la grandeur afin
              d'identifier les grandeurs fondamentales dont elle dépend.
          \end{itemize}

        \item {\bf Erreurs sur les surfaces et les volumes}
          \begin{itemize}[label = $\circ$]
            \item Une erreur classique consiste à appliquer directement le facteur
              de conversion de longueur à une surface ou à un volume.

              Rappeler que si $1\,\mathrm{cm}=10^{-2}\,\mathrm{m}$ alors

              \[
              1\,\mathrm{cm}^2=10^{-4}\,\mathrm{m}^2
              \]

              et

              \[
              1\,\mathrm{cm}^3=10^{-6}\,\mathrm{m}^3.
              \]
          \end{itemize}

        \item {\bf Erreurs de conversion des vitesses}
          \begin{itemize}[label = $\circ$]
            \item Les étudiants retiennent parfois uniquement la règle
              « diviser par $3{,}6$ » sans comprendre son origine.

              Faire revenir aux conversions fondamentales :

              \[
              1\,\mathrm{km}=1000\,\mathrm{m}
              \qquad\text{et}\qquad
              1\,\mathrm{h}=3600\,\mathrm{s}.
              \]
          \end{itemize}

        \item {\bf Mélange entre notation dimensionnelle et calcul numérique}
          \begin{itemize}[label = $\circ$]
            \item Faire distinguer les deux étapes :
              déterminer d'abord la dimension littéralement, puis effectuer
              éventuellement l'application numérique avec les unités appropriées.
          \end{itemize}

        \item {\bf Erreurs sur les puissances de dix}
          \begin{itemize}[label = $\circ$]
            \item Vérifier systématiquement les signes et les exposants lors
              des conversions, en particulier pour les unités au carré et au cube.
          \end{itemize}
      \end{itemize}


remarques_pedagogiques_conseils_animation: 
  - titre: |
      Conseils pour l'animation

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Partir d'exemples familiers}
          \begin{itemize}[label = $\circ$]
            \item Commencer par la vitesse, le volume ou la masse volumique,
              grandeurs dont les relations de définition sont généralement
              déjà connues.

            \item Les utiliser pour faire émerger progressivement la notion
              de grandeur dérivée.
          \end{itemize}

        \item {\bf Faire verbaliser la méthode}
          \begin{itemize}[label = $\circ$]
            \item Demander aux étudiants d'énoncer chaque étape avant le calcul :
              « Quelle est la relation ? », « Quelles sont les dimensions connues ? »,
              « Que devient la dimension recherchée ? ».
          \end{itemize}

        \item {\bf Faire comparer dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Utiliser volontairement des exemples comme
              $\mathsf{L}\mathsf{T}^{-1}$ et
              $\mathrm{m}\cdot\mathrm{s}^{-1}$ pour faire apparaître
              leur correspondance sans les confondre.
          \end{itemize}

        \item {\bf Utiliser les erreurs de conversion}
          \begin{itemize}[label = $\circ$]
            \item Lors des conversions, proposer une valeur erronée et demander
              aux étudiants d'identifier l'origine de l'erreur.

            \item Faire notamment ressortir les puissances associées aux
              surfaces et aux volumes.
          \end{itemize}

        \item {\bf Faire contrôler les résultats}
          \begin{itemize}[label = $\circ$]
            \item Encourager les étudiants à vérifier systématiquement qu'une
              unité finale est cohérente avec la grandeur recherchée.

            \item Cette habitude prépare directement à l'utilisation de
              l'analyse dimensionnelle.
          \end{itemize}
      \end{itemize}


bilan: 
  - titre: |
      Bilan

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Grandeurs dérivées}
          \begin{itemize}[label = $\circ$]
            \item Une grandeur dérivée est construite à partir des grandeurs
              fondamentales du S.I.

            \item Son équation aux dimensions peut être obtenue à partir
              de sa relation de définition.
          \end{itemize}

        \item {\bf Méthode essentielle}
          \begin{itemize}[label = $\circ$]
            \item Pour déterminer une dimension :
              partir de la relation de définition, remplacer les grandeurs
              par leurs dimensions, effectuer les opérations sur les puissances
              puis simplifier.
          \end{itemize}

        \item {\bf Dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Une même dimension peut être associée à une unité S.I. donnée.

            \item Par exemple, la vitesse possède la dimension
              $\mathsf{L}\mathsf{T}^{-1}$ et s'exprime en
              $\mathrm{m}\cdot\mathrm{s}^{-1}$.
          \end{itemize}

        \item {\bf Conversions}
          \begin{itemize}[label = $\circ$]
            \item Pour les surfaces et les volumes, le facteur de conversion
              doit être élevé respectivement au carré ou au cube.

            \item Pour les vitesses :

              \[
              1\,\mathrm{m/s}=3{,}6\,\mathrm{km/h}.
              \]
          \end{itemize}
      \end{itemize}

