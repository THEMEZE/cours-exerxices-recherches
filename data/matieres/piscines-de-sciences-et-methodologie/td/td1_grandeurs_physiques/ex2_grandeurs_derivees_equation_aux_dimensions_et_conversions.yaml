id: td1_ex2
intitule: "Grandeurs Dérivées : Équation au dimensions , dimension et unités dérivées (composées)"
td: td1
facultatif: false
seance: 1

cours_rattache:
  - chap1.???

metadonnees:
  duree_estimee: "25 min"
  difficulte: 2 # Sur une échelle de 1 à 5
  type_exercice: "Révision"
  indispensable: true

enonce_intro: |


prerequis : 

  - titre: |
      

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Grandeurs fondamentales du S.I.}
          \begin{itemize}[label = $\circ$]
            \item Connaître les principales grandeurs fondamentales du Système international : longueur, masse, temps et quantité de matière, ainsi que leurs unités respectives : mètre (m), kilogramme (kg), seconde (s) et mole (mol).).
          \end{itemize}
        \item {\bf Relations entre grandeurs physiques}
          \begin{itemize}[label = $\circ$]
            \item Savoir utiliser une relation simple entre grandeurs physiques, notamment une relation de définition comme $v=\frac{\mathrm{d}x}{\mathrm{d}t}$,
      $\rho=\frac{m}{V}$ ou $F=ma$.
          \end{itemize}
        \item {\bf Puissances de dix et préfixes}
          \begin{itemize}[label = $\circ$]
            \item Maîtriser les puissances de dix et les principaux préfixes du S.I. (kilo, centi, milli, micro...) afin de pouvoir effectuer des conversions
      d'unités.
          \end{itemize}
        \item {\bf Conversions d'unités}
          \begin{itemize}[label = $\circ$]
            \item Savoir convertir une grandeur d'une unité à une autre et comprendre qu'une conversion de surface ou de volume doit également tenir compte de la puissance associée à l'unité.
          \end{itemize}
      \end{itemize}


