point_cours :
  - titre: |
      

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Grandeurs fondamentales et grandeurs dérivées}
          \begin{itemize}[label = $\circ$]
            \item Les grandeurs fondamentales du S.I. sont indépendantes les unes des autres. Les grandeurs dérivées sont définies à partir de ces grandeurs fondamentales par des relations mathématiques.

            Exemples :
            $[v]=\mathsf{L}\mathsf{T}^{-1}$,
            $[S]=\mathsf{L}^2$,
            $[V]=\mathsf{L}^3$,
            $[\rho]=\mathsf{M}\mathsf{L}^{-3}$.
          \end{itemize}
        \item {\bf Équation aux dimensions}
          \begin{itemize}[label = $\circ$]
            \item Une grandeur physique $X$ peut s'écrire sous la forme

              \[
              [X]=\mathsf{L}^a\mathsf{M}^b\mathsf{T}^c
              \mathsf{I}^d\mathsf{\Theta}^e\mathsf{N}^f\mathsf{J}^g.
              \]

              L'équation aux dimensions permet de caractériser la nature
              dimensionnelle d'une grandeur indépendamment du système d'unités utilisé.
          \end{itemize}
        \item {\bf Retrouver une dimension à partir d'une relation}
          \begin{itemize}[label = $\circ$]
            \item Pour déterminer la dimension d'une grandeur, on part d'une relation
              connue puis on remplace chaque grandeur par sa dimension.

              Par exemple, avec $v=\frac{\mathrm{d}x}{\mathrm{d}t}$ :

              \[
              [v]=\frac{[x]}{[t]}
              =\frac{\mathsf{L}}{\mathsf{T}}
              =\mathsf{L}\mathsf{T}^{-1}.
              \]
          \end{itemize}
        \item {\bf Dimension et unité S.I.}
          \begin{itemize}[label = $\circ$]
            \item  L'unité S.I. permet également de retrouver la dimension correspondante :
              $\mathrm{m}\leftrightarrow\mathsf{L}$,
              $\mathrm{kg}\leftrightarrow\mathsf{M}$,
              $\mathrm{s}\leftrightarrow\mathsf{T}$,
              $\mathrm{mol}\leftrightarrow\mathsf{N}$.

              Ainsi, $\mathrm{kg}\cdot\mathrm{m}^{-3}$ correspond à
              $\mathsf{M}\mathsf{L}^{-3}$.
          \end{itemize}
        \item {\bf Conversions de surfaces et de volumes}
          \begin{itemize}[label = $\circ$]
            \item Lorsqu'une unité est élevée au carré ou au cube, le facteur de conversion
              doit également être élevé au carré ou au cube.

              Par exemple :

              \[
              1\,\mathrm{cm}^2=(10^{-2}\,\mathrm{m})^2
              =10^{-4}\,\mathrm{m}^2
              \]

              et

              \[
              1\,\mathrm{cm}^3=(10^{-2}\,\mathrm{m})^3
              =10^{-6}\,\mathrm{m}^3.
              \]
          \end{itemize}
        \item {\bf Conversion des vitesses}
          \begin{itemize}[label = $\circ$]
            \item Lorsqu'une unité est élevée au carré ou au cube, le facteur de conversion
              doit également être élevé au carré ou au cube.

              Par exemple :

              \[
              1\,\mathrm{cm}^2=(10^{-2}\,\mathrm{m})^2
              =10^{-4}\,\mathrm{m}^2
              \]

              et

              \[
              1\,\mathrm{cm}^3=(10^{-2}\,\mathrm{m})^3
              =10^{-6}\,\mathrm{m}^3.
              \]
          \end{itemize}
      \end{itemize}

