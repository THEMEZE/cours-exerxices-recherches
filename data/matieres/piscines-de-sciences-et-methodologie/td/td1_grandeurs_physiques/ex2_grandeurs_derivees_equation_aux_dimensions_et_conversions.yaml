#       partir de la relation de définition, remplacer les grandeurs par leurs
#       dimensions, effectuer les opérations sur les puissances puis simplifier.

#   - titre: |
#       Dimension et unité

#     texte: |
#       Une même dimension peut être associée à une unité S.I. donnée.
#       Par exemple, la vitesse possède la dimension
#       $\mathsf{L}\mathsf{T}^{-1}$ et s'exprime en
#       $\mathrm{m}\cdot\mathrm{s}^{-1}$.

#   - titre: |
#       Conversions

#     texte: |
#       Pour les surfaces et les volumes, le facteur de conversion doit être
#       élevé respectivement au carré ou au cube. Pour les vitesses,
#       $1\,\mathrm{m/s}=3{,}6\,\mathrm{km/h}$.


aller_plus_loin: 
  - niveau: lycee

    titre: |
      Vérifier la cohérence d'une formule

    texte: |
      Utiliser les dimensions pour vérifier qu'une relation physique est
      homogène. Par exemple, comparer les dimensions des deux membres d'une
      équation avant de rechercher une valeur numérique.

  - niveau: prepa

    titre: |
      Analyse dimensionnelle

    texte: |
      Utiliser l'analyse dimensionnelle pour retrouver la forme possible
      d'une relation physique à partir des grandeurs pertinentes et de leurs
      dimensions.

  - niveau: licence

    titre: |
      Système international et unités dérivées

    texte: |
      Étudier plus systématiquement les sept grandeurs fondamentales du S.I.
      et les unités dérivées associées. Relier les dimensions des grandeurs
      mécaniques aux unités telles que le newton, le joule, le watt et le pascal.

  - niveau: master

    titre: |
      Analyse dimensionnelle et lois d'échelle

    texte: |
      Étendre l'analyse dimensionnelle aux lois d'échelle et à la recherche
      de nombres sans dimension. Cette approche permet notamment de comparer
      différents régimes physiques et de construire des modèles réduits.
      


questions:


  - id: q1_intro

    enonce: |
      {\bf Notions de cours S.I.}\\
      
      \begin{enumerate}[label=\alph*)]
        \item Définir la notion de grandeur dérivée (ou composée) et citer quelques exemples.
        \item Qu’appelle t’on équation aux dimensions d’une grandeur dérivée ?
        \item La vitesse est elle une grandeur dérivée ?
        \item A partir d’une relation définissant la vitesse, établir son équation aux dimensions. Conclure sur la dimension de la vitesse.\\
        \item Connaissant l’unité de la vitesse, peut on retrouver sa dimension ?
      \end{enumerate}

    correction :
      - titre: |

        texte: |

          \begin{enumerate}[label=\alph*)]
            \item Une {\bf grandeur dérivée} s'exprime à partir des grandeurs fondamentales.
                Exemple : le volume $[V] = L^3$ ; la vitesse : $[v] = L * T^{-1}$ 
            \item L'équation aux dimensions s'écrit $[X] ~ = ~ L^a ~ M^b ~ T^c ~ I^d ~ \Theta^e ~ N^f ~ J^g$ 
            \item Oui, la vitesse dépend de la longueur et du temps.
            \item ${\displaystyle v = \frac{dx}{dt}}$ donc $[v] = [x]/[t] = L * T^{-1}$.
            \item Oui, $m/s$ correspond bien à $L * T^{-1}$.
          \end{enumerate}

    solution:
      - titre: |

        texte: |
          

          Une {\bf grandeur dérivée} (ou composée) est une grandeur physique définie à partir des grandeurs de base du Système international (SI) — comme la longueur, la masse ou le temps — en utilisant des relations mathématiques (multiplications ou divisions).
          Par opposition aux sept grandeurs de base qui sont indépendantes, les grandeurs dérivées s'expriment à l'aide d'une équation aux dimensions qui combine ces grandeurs fondamentales.

          $$\begin{array}{l l l l} \textbf{Grandeur} & \textbf{Formule / Définition} & \textbf{Dimension} & \textbf{Unités S.I. et autres} \\ \hline \textbf{Vitesse} & v = \frac{d}{t} & \mathsf{L}\ast\mathsf{T}^{-1} & \text{m}\cdot\text{s}^{-1} \\ \textbf{Surface (Aire)} & S = L \times l & \mathsf{L}^2 & \text{m}^2 \\ \textbf{Volume} & V = L \times l \times h & \mathsf{L}^3 & \text{m}^3 \\ \textbf{Masse volumique} & \rho = \frac{m}{V} & \mathsf{M}\ast\mathsf{L}^{-3} & \text{kg}\cdot\text{m}^{-3} \\ \hline \textbf{Force} & F = m \times a & \mathsf{M}\ast\mathsf{L}\ast\mathsf{T}^{-2} & \text{N} \quad (\text{kg}\cdot\text{m}\cdot\text{s}^{-2}) \\ \textbf{Pression} & P = \frac{F}{S} & \mathsf{M}\ast\mathsf{L}^{-1}\ast\mathsf{T}^{-2} & \text{Pa} \quad (\text{kg}\cdot\text{m}^{-1}\cdot\text{s}^{-2}) \\ \textbf{Énergie / Travail} & E = F \times d & \mathsf{M}\ast\mathsf{L}^2\ast\mathsf{T}^{-2} & \text{J} \quad (\text{kg}\cdot\text{m}^2\cdot\text{s}^{-2}) \\ \textbf{Puissance} & P = \frac{E}{t} & \mathsf{M}\ast\mathsf{L}^2\ast\mathsf{T}^{-3} & \text{W} \quad (\text{kg}\cdot\text{m}^2\cdot\text{s}^{-3}) \end{array}$$


    #is_intro_only: true 

