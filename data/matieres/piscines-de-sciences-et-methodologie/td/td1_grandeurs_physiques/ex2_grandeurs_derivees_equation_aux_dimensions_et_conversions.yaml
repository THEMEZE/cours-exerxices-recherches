objectifs_pedagogiques_etudiants :

  - titre: |

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Identifier une grandeur dérivée}
          \begin{itemize}[label = $\circ$]
            \item Reconnaître qu'une grandeur dérivée est définie à partir d'une ou plusieurs grandeurs fondamentales et identifier quelques exemples usuels : vitesse, accélération, surface, volume, masse volumique, force, énergie et pression.
          \end{itemize}
        \item {\bf Établir une équation aux dimensions}
          \begin{itemize}[label = $\circ$]
            \item Savoir déterminer la dimension d'une grandeur physique à partir de sa relation de définition en utilisant les dimensions des grandeurs fondamentales..
          \end{itemize}
        \item {\bf Retrouver une dimension à partir d'une unité}
          \begin{itemize}[label = $\circ$]
            \item Savoir analyser une unité S.I. composée pour retrouver la grandeur physique correspondante et son équation aux dimensions.
          \end{itemize}
        \item {\bf Relier dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Comprendre la correspondance entre les dimensions fondamentales et les unités S.I. et savoir passer de l'une à l'autre.
          \end{itemize}
        \item {\bf Effectuer des conversions}
          \begin{itemize}[label = $\circ$]
            \item Savoir convertir correctement des unités de longueur, de surface, de volume et de vitesse, notamment entre $\mathrm{km/h}$ et $\mathrm{m/s}$.
          \end{itemize}
      \end{itemize}

