objectifs_pedagogiques_enseignants :

  - titre: |
      

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Consolider les bases du S.I.}
          \begin{itemize}[label = $\circ$]
            \item Vérifier que les étudiants maîtrisent les grandeurs et unités fondamentales nécessaires à la suite du cours de physique.
          \end{itemize}
        \item {\bf Faire distinguer dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Insister sur la différence entre une dimension, par exemple $\mathsf{L}\mathsf{T}^{-1}$, et une unité, par exemple $\mathrm{m}\cdot\mathrm{s}^{-1}$.
          \end{itemize}
        \item {\bf Installer une méthode systématique}
          \begin{itemize}[label = $\circ$]
            \item Faire utiliser une démarche reproductible : partir de la relation de définition, remplacer chaque grandeur par sa dimension, simplifier les puissances et conclure sur la dimension recherchée.
          \end{itemize}
        \item {\bf Vérifier la maîtrise des conversions}
          \begin{itemize}[label = $\circ$]
            \item Repérer les difficultés liées aux conversions de surfaces et de volumes, ainsi qu'aux conversions de vitesses. Faire expliciter les facteurs de conversion plutôt que de privilégier l'apprentissage de règles isolées.
          \end{itemize}
        \item {\bf Préparer l'analyse dimensionnelle}
          \begin{itemize}[label = $\circ$]
            \item Utiliser les exercices comme une première familiarisation avec l'analyse dimensionnelle, qui pourra ensuite être mobilisée pour vérifier la cohérence d'une relation physique.
          \end{itemize}
      \end{itemize}

