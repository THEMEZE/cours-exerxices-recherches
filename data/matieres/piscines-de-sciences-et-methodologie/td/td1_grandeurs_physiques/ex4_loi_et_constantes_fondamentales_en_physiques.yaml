id: td1_ex4
intitule: "Lois et Constantes Fondamentales en physiques"
td: td1
facultatif: false
seance: 1

cours_rattache:
  - chap1.???

metadonnees:
  duree_estimee: "35 min"
  difficulte: 2 # Sur une échelle de 1 à 5
  type_exercice: "Révision"
  indispensable: true

enonce_intro: |
  L’objectif de l’exercice est d’utiliser l’analyse dimensionnelle afin de déterminer la dimension de constante intervenant dans les lois physiques.


prerequis:
  - titre: |
      Grandeurs physiques et unités
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Grandeurs physiques}

        \begin{itemize}[label=$\circ$]

          \item Savoir identifier les grandeurs physiques
            intervenant dans une relation.

          \item Distinguer les grandeurs fondamentales
            des grandeurs dérivées.

          \item Connaître les dimensions de base :
            masse $M$, longueur $L$, temps $T$,
            intensité électrique $I$, température $\Theta$
            et quantité de matière $N$.

        \end{itemize}

        \item {\bf Unités du Système international}

        \begin{itemize}[label=$\circ$]

          \item Connaître les unités SI de la masse,
            de la longueur et du temps.

          \item Savoir exprimer une grandeur physique
            dans les unités du Système international.

          \item Connaître les unités dérivées :
            newton, joule et pascal.

        \end{itemize}

        \item {\bf Analyse dimensionnelle}

        \begin{itemize}[label=$\circ$]

          \item Savoir déterminer la dimension d'une
            grandeur physique à partir de sa définition.

          \item Savoir manipuler les dimensions
            lors d'un produit ou d'un quotient.

          \item Savoir utiliser les puissances
            d'une grandeur dans une expression dimensionnelle.

        \end{itemize}

        \item {\bf Manipulation algébrique}

        \begin{itemize}[label=$\circ$]

          \item Savoir isoler une constante dans
            une équation physique.

          \item Savoir effectuer des transformations
            algébriques sur une relation littérale.

        \end{itemize}

      \end{itemize}


objectifs_pedagogiques_etudiants:
  - titre: |
      Identifier les grandeurs physiques
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Identification des grandeurs}

        \begin{itemize}[label=$\circ$]

          \item Identifier les grandeurs physiques
            présentes dans une loi physique.

          \item Distinguer les variables physiques
            des constantes intervenant dans une relation.

          \item Associer chaque grandeur à sa dimension
            et à son unité SI.

        \end{itemize}

      \end{itemize}

  - titre: |
      Déterminer les dimensions d'une constante
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Mise en équation}

        \begin{itemize}[label=$\circ$]

          \item Écrire l'équation aux dimensions
            d'une loi physique.

          \item Isoler une constante dans une relation
            afin de déterminer sa dimension.

          \item Exprimer la dimension de la constante
            en fonction des dimensions fondamentales.

        \end{itemize}

        \item {\bf Application aux lois physiques}

        \begin{itemize}[label=$\circ$]

          \item Déterminer la dimension de la constante
            de gravitation universelle $\mathcal{G}$.

          \item Déterminer la dimension de la permittivité
            du vide $\varepsilon_0$.

          \item Déterminer la dimension de la constante
            des gaz parfaits $R$.

        \end{itemize}

      \end{itemize}

  - titre: |
      Relier dimensions et unités SI
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Conversion dimensionnelle}

        \begin{itemize}[label=$\circ$]

          \item Passer d'une dimension fondamentale
            à l'unité SI correspondante.

          \item Exprimer une constante en unités SI
            à partir de sa dimension.

          \item Vérifier la cohérence dimensionnelle
            d'un résultat.

        \end{itemize}

      \end{itemize}

  - titre: |
      Comprendre les limites de l'analyse dimensionnelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Interprétation physique}

        \begin{itemize}[label=$\circ$]

          \item Comprendre que l'analyse dimensionnelle
            ne permet pas de déterminer une valeur numérique
            de constante.

          \item Distinguer une détermination dimensionnelle
            d'une détermination expérimentale.

          \item Identifier les informations supplémentaires
            nécessaires pour mesurer une constante physique.

        \end{itemize}

      \end{itemize}


objectifs_pedagogiques_enseignants:
  - titre: |
      Vérifier les prérequis en analyse dimensionnelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Évaluation des connaissances initiales}

        \begin{itemize}[label=$\circ$]

          \item Vérifier la maîtrise des dimensions
            fondamentales du Système international.

          \item Identifier les difficultés liées
            aux produits et quotients de dimensions.

          \item Vérifier la capacité à isoler
            une grandeur dans une relation physique.

        \end{itemize}

      \end{itemize}

  - titre: |
      Faire acquérir une méthode générale
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Méthode de résolution}

        \begin{itemize}[label=$\circ$]

          \item Faire identifier les grandeurs
            présentes dans la loi physique.

          \item Faire déterminer les dimensions
            de chaque grandeur.

          \item Faire isoler la constante recherchée.

          \item Faire effectuer les calculs
            dimensionnels étape par étape.

          \item Faire vérifier la cohérence du résultat
            avec l'unité SI.

        \end{itemize}

      \end{itemize}

  - titre: |
      Développer le raisonnement physique
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Analyse et interprétation}

        \begin{itemize}[label=$\circ$]

          \item Faire distinguer une loi physique
            de la valeur numérique de ses constantes.

          \item Montrer que des lois issues de domaines
            différents peuvent être étudiées
            avec une même méthode dimensionnelle.

          \item Introduire les liens entre les constantes
            physiques et les protocoles expérimentaux.

        \end{itemize}

      \end{itemize}


point_cours:
  - titre: |
      Dimensions fondamentales
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Dimensions de base}

        \begin{itemize}[label=$\circ$]

          \item Masse : $[m] = M$.

          \item Longueur : $[r] = L$.

          \item Temps : $[t] = T$.

          \item Intensité électrique : $[I] = I$.

          \item Température thermodynamique : $[T] = \Theta$.

          \item Quantité de matière : $[n] = N$.

        \end{itemize}

        \item {\bf Grandeurs dérivées}

        \begin{itemize}[label=$\circ$]

          \item Force :
            $[F] = M L T^{-2}$.

          \item Surface :
            $[S] = L^2$.

          \item Volume :
            $[V] = L^3$.

          \item Pression :
            $[P] = M L^{-1} T^{-2}$.

          \item Énergie :
            $[E] = M L^2 T^{-2}$.

        \end{itemize}

      \end{itemize}

  - titre: |
      Règles de calcul dimensionnel
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Produits et quotients}

        \begin{itemize}[label=$\circ$]

          \item Les dimensions se multiplient
            lors d'un produit de grandeurs.

          \item Les dimensions se divisent
            lors d'un quotient de grandeurs.

          \item Une puissance agit sur l'ensemble
            des exposants dimensionnels.

        \end{itemize}

        \item {\bf Addition et soustraction}

        \begin{itemize}[label=$\circ$]

          \item L'addition et la soustraction
            ne sont possibles qu'entre grandeurs
            de même dimension.

          \item Les termes additionnés dans une relation
            physique doivent avoir une dimension identique.

        \end{itemize}

        \item {\bf Constantes numériques}

        \begin{itemize}[label=$\circ$]

          \item Les nombres purs, tels que $4\pi$,
            sont sans dimension.

          \item Une constante numérique sans dimension
            ne modifie pas la dimension globale
            d'une expression.

        \end{itemize}

      \end{itemize}

  - titre: |
      Constante de gravitation universelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Loi de Newton}

        \begin{itemize}[label=$\circ$]

          \item La force gravitationnelle s'écrit :

            \[
              F = \mathcal{G}\frac{m m'}{r^2}.
            \]

          \item Les dimensions des grandeurs sont :

            \[
              [F] = M L T^{-2},
              \qquad [m] = [m'] = M,
              \qquad [r] = L.
            \]

        \end{itemize}

        \item {\bf Dimension de la constante}

        \begin{itemize}[label=$\circ$]

          \item Isoler la constante :

            \[
              \mathcal{G} = \frac{F r^2}{m m'}.
            \]

          \item Déterminer sa dimension :

            \[
              [\mathcal{G}]
              = M^{-1}L^3T^{-2}.
            \]

          \item Son unité SI est :

            \[
              \mathrm{kg}^{-1}\,\mathrm{m}^3\,\mathrm{s}^{-2}.
            \]

        \end{itemize}

      \end{itemize}

  - titre: |
      Permittivité du vide
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Loi de Coulomb}

        \begin{itemize}[label=$\circ$]

          \item La force électrostatique s'écrit :

            \[
              F = \frac{1}{4\pi\varepsilon_0}
              \frac{q q'}{r^2}.
            \]

          \item La charge électrique vérifie :

            \[
              [q] = I T.
            \]

        \end{itemize}

        \item {\bf Dimension de la constante}

        \begin{itemize}[label=$\circ$]

          \item Isoler la permittivité :

            \[
              \varepsilon_0
              = \frac{q q'}{4\pi F r^2}.
            \]

          \item Déterminer sa dimension :

            \[
              [\varepsilon_0]
              = M^{-1}L^{-3}T^4I^2.
            \]

          \item Son unité SI est :

            \[
              \mathrm{kg}^{-1}\,\mathrm{m}^{-3}\,
              \mathrm{s}^4\,\mathrm{A}^2.
            \]

        \end{itemize}

      \end{itemize}

  - titre: |
      Constante des gaz parfaits
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Loi des gaz parfaits}

        \begin{itemize}[label=$\circ$]

          \item La loi des gaz parfaits s'écrit :

            \[
              PV = nRT.
            \]

          \item Les dimensions des grandeurs sont :

            \[
              [P] = M L^{-1}T^{-2},
              \quad [V] = L^3,
              \quad [n] = N,
              \quad [T] = \Theta.
            \]

        \end{itemize}

        \item {\bf Dimension de la constante}

        \begin{itemize}[label=$\circ$]

          \item Isoler la constante :

            \[
              R = \frac{PV}{nT}.
            \]

          \item Déterminer sa dimension :

            \[
              [R] = M L^2 T^{-2}\Theta^{-1}N^{-1}.
            \]

          \item Son unité SI est :

            \[
              \mathrm{J\,K^{-1}\,mol^{-1}}.
            \]

        \end{itemize}

      \end{itemize}

  - titre: |
      Limites de l'analyse dimensionnelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Détermination dimensionnelle}

        \begin{itemize}[label=$\circ$]

          \item L'analyse dimensionnelle permet
            de déterminer la dimension d'une constante.

          \item Elle permet de vérifier la cohérence
            dimensionnelle d'une relation physique.

          \item Elle ne permet pas de déterminer
            la valeur numérique d'une constante.

        \end{itemize}

        \item {\bf Détermination expérimentale}

        \begin{itemize}[label=$\circ$]

          \item La valeur numérique d'une constante
            doit être obtenue par une mesure expérimentale
            ou une relation physique supplémentaire.

          \item La constante gravitationnelle $\mathcal{G}$
            peut être déterminée expérimentalement
            à l'aide d'une balance de torsion.

        \end{itemize}

      \end{itemize}


remarques_pedagogiques_ecueils_classiques:
  - titre: |
      Confusion entre dimension et unité
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Dimension}

        \begin{itemize}[label=$\circ$]

          \item Rappeler que $M$, $L$ et $T$
            représentent des dimensions fondamentales.

          \item Une dimension ne doit pas être confondue
            avec une unité telle que le kilogramme ou le mètre.

        \end{itemize}

        \item {\bf Unité SI}

        \begin{itemize}[label=$\circ$]

          \item Vérifier que l'étudiant sait passer
            de la dimension à l'unité SI.

          \item Insister sur la distinction entre
            une écriture en dimensions fondamentales
            et une écriture en unités dérivées.

        \end{itemize}

      \end{itemize}

  - titre: |
      Erreurs dans les puissances dimensionnelles
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Puissance d'une grandeur}

        \begin{itemize}[label=$\circ$]

          \item Vérifier que la puissance $r^2$
            donne bien $[r^2] = L^2$.

          \item Vérifier que les exposants négatifs
            sont correctement manipulés lors d'un quotient.

          \item Rappeler que :

            \[
              \frac{1}{L^2} = L^{-2}.
            \]

        \end{itemize}

      \end{itemize}

  - titre: |
      Erreurs d'algèbre
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Isolement de la constante}

        \begin{itemize}[label=$\circ$]

          \item Vérifier que l'étudiant isole correctement
            la constante avant de calculer sa dimension.

          \item Identifier les erreurs de positionnement
            des facteurs au numérateur et au dénominateur.

          \item Faire vérifier l'expression finale
            en réinjectant la constante dans la loi initiale.

        \end{itemize}

      \end{itemize}

  - titre: |
      Confusion entre masse et quantité de matière
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Grandeurs distinctes}

        \begin{itemize}[label=$\circ$]

          \item La masse possède la dimension $M$.

          \item La quantité de matière possède la dimension $N$.

          \item Ne pas confondre la masse $m$
            et la quantité de matière $n$.

        \end{itemize}

      \end{itemize}

  - titre: |
      Interprétation excessive de l'analyse dimensionnelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Valeur numérique}

        \begin{itemize}[label=$\circ$]

          \item Rappeler que la dimension d'une constante
            ne détermine pas sa valeur numérique.

          \item Distinguer la détermination d'une unité
            de la mesure expérimentale d'une constante.

        \end{itemize}

      \end{itemize}


remarques_pedagogiques_conseils_animation:
  - titre: |
      Introduction et mobilisation des prérequis
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Questionnement initial}

        \begin{itemize}[label=$\circ$]

          \item Demander aux étudiants quelles sont
            les dimensions de la force, de la masse
            et de la longueur.

          \item Faire rappeler les règles de calcul
            dimensionnel avant de commencer.

          \item Questionner les étudiants sur la différence
            entre une dimension et une unité.

        \end{itemize}

      \end{itemize}

  - titre: |
      Résolution guidée de la première question
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Loi de gravitation}

        \begin{itemize}[label=$\circ$]

          \item Faire identifier les grandeurs physiques
            présentes dans la loi de Newton.

          \item Demander aux étudiants de déterminer
            les dimensions de chaque grandeur.

          \item Faire isoler la constante $\mathcal{G}$
            avant toute opération dimensionnelle.

          \item Comparer les différentes méthodes
            de calcul proposées par les étudiants.

        \end{itemize}

      \end{itemize}

  - titre: |
      Progression vers les autres constantes
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Transfert de méthode}

        \begin{itemize}[label=$\circ$]

          \item Demander aux étudiants de réutiliser
            la méthode pour la permittivité du vide.

          \item Faire expliciter la dimension de la charge
            électrique à partir de $q = It$.

          \item Pour la loi des gaz parfaits,
            rappeler la dimension de l'énergie
            associée au produit $PV$.

        \end{itemize}

      \end{itemize}

  - titre: |
      Vérification collective
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Analyse des résultats}

        \begin{itemize}[label=$\circ$]

          \item Faire comparer les dimensions
            obtenues par les étudiants.

          \item Demander une vérification
            de la cohérence des unités SI.

          \item Faire expliciter les erreurs
            plutôt que de donner immédiatement
            le résultat final.

        \end{itemize}

      \end{itemize}

  - titre: |
      Ouverture expérimentale
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Constantes physiques}

        \begin{itemize}[label=$\circ$]

          \item Questionner les étudiants :
            « Comment déterminer la valeur numérique
            d'une constante ? »

          \item Introduire le principe de la balance
            de torsion de Cavendish.

          \item Distinguer une prédiction dimensionnelle
            d'une détermination expérimentale.

        \end{itemize}

      \end{itemize}


bilan:
  - titre: |
      Méthode générale à retenir
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Étapes de résolution}

        \begin{itemize}[label=$\circ$]

          \item Identifier les grandeurs physiques
            présentes dans la relation.

          \item Déterminer la dimension de chaque grandeur.

          \item Isoler la constante recherchée.

          \item Remplacer les grandeurs par leurs dimensions.

          \item Simplifier les puissances des dimensions
            fondamentales.

          \item Déduire l'unité SI de la constante.

        \end{itemize}

      \end{itemize}

  - titre: |
      Résultats essentiels
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Constante de gravitation}

        \begin{itemize}[label=$\circ$]

          \item Dimension :

            \[
              [\mathcal{G}] = M^{-1}L^3T^{-2}.
            \]

          \item Unité SI :

            \[
              \mathrm{kg}^{-1}\,\mathrm{m}^3\,\mathrm{s}^{-2}.
            \]

        \end{itemize}

        \item {\bf Permittivité du vide}

        \begin{itemize}[label=$\circ$]

          \item Dimension :

            \[
              [\varepsilon_0] = M^{-1}L^{-3}T^4I^2.
            \]

        \end{itemize}

        \item {\bf Constante des gaz parfaits}

        \begin{itemize}[label=$\circ$]

          \item Dimension :

            \[
              [R] = M L^2T^{-2}\Theta^{-1}N^{-1}.
            \]

          \item Unité SI :

            \[
              \mathrm{J\,K^{-1}\,mol^{-1}}.
            \]

        \end{itemize}

      \end{itemize}

  - titre: |
      Limites de la méthode
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Analyse dimensionnelle}

        \begin{itemize}[label=$\circ$]

          \item Permet de vérifier la cohérence
            d'une loi physique.

          \item Permet de déterminer la dimension
            d'une constante.

          \item Ne permet pas de déterminer
            la valeur numérique d'une constante
            sans information supplémentaire.

        \end{itemize}

      \end{itemize}


aller_plus_loin:
  - niveau: lycee
    titre: |
      Vérification dimensionnelle de lois physiques
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Application à la mécanique}

        \begin{itemize}[label=$\circ$]

          \item Vérifier la cohérence dimensionnelle
            de la relation $v = d/t$.

          \item Vérifier la dimension de l'énergie
            cinétique :

            \[
              E_c = \frac{1}{2}mv^2.
            \]

          \item Déterminer la dimension de la constante
            de raideur $k$ dans la loi de Hooke :

            \[
              F = kx.
            \]

        \end{itemize}

        \item {\bf Analyse d'une relation}

        \begin{itemize}[label=$\circ$]

          \item Vérifier qu'une relation est homogène.

          \item Identifier les termes qui ne peuvent
            pas être additionnés en raison de dimensions
            différentes.

        \end{itemize}

      \end{itemize}

  - niveau: prepa
    titre: |
      Analyse dimensionnelle et lois d'échelle
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Détermination d'une loi physique}

        \begin{itemize}[label=$\circ$]

          \item Utiliser l'analyse dimensionnelle
            pour proposer une dépendance fonctionnelle
            entre plusieurs grandeurs physiques.

          \item Étudier la période d'un pendule simple
            à partir de la longueur $l$ et de l'accélération
            de la pesanteur $g$.

          \item Identifier les limites de l'analyse
            dimensionnelle lorsque plusieurs
            grandeurs sans dimension interviennent.

        \end{itemize}

        \item {\bf Théorème de Buckingham}

        \begin{itemize}[label=$\circ$]

          \item Introduire le principe du théorème
            de Buckingham $\Pi$.

          \item Construire des groupes sans dimension
            à partir de grandeurs physiques.

          \item Utiliser les groupes sans dimension
            pour étudier des lois d'échelle.

        \end{itemize}

      \end{itemize}

  - niveau: licence
    titre: |
      Constantes physiques et systèmes d'unités
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Relations entre constantes}

        \begin{itemize}[label=$\circ$]

          \item Étudier la relation entre la constante
            des gaz parfaits et la constante de Boltzmann :

            \[
              R = N_A k_B.
            \]

          \item Vérifier la cohérence dimensionnelle
            de cette relation.

          \item Distinguer les grandeurs molaires
            des grandeurs microscopiques.

        \end{itemize}

        \item {\bf Expérience de Cavendish}

        \begin{itemize}[label=$\circ$]

          \item Étudier le principe de fonctionnement
            d'une balance de torsion.

          \item Déterminer l'expression de la constante
            gravitationnelle à partir de l'équilibre
            des couples.

          \item Identifier les sources d'incertitudes
            expérimentales dans la mesure de $\mathcal{G}$.

        \end{itemize}

        \item {\bf Systèmes d'unités}

        \begin{itemize}[label=$\circ$]

          \item Comparer les unités de la constante
            gravitationnelle dans différents systèmes
            d'unités.

          \item Comprendre le rôle des constantes physiques
            dans la définition des unités SI.

        \end{itemize}

      \end{itemize}

  - niveau: master
    titre: |
      Gravitation, relativité et constantes fondamentales
    texte: |
      \begin{itemize}[label = $\bullet$]

        \item {\bf Gravitation newtonienne}

        \begin{itemize}[label=$\circ$]

          \item Étudier la loi de gravitation universelle
            dans le cadre de la mécanique classique.

          \item Relier la constante gravitationnelle
            aux dimensions des grandeurs de la loi de Newton.

        \end{itemize}

        \item {\bf Relativité générale}

        \begin{itemize}[label=$\circ$]

          \item Introduire le rôle de la constante
            gravitationnelle dans les équations d'Einstein :

            \[
              G_{\mu\nu}
              = \frac{8\pi\mathcal{G}}{c^4}T_{\mu\nu}.
            \]

          \item Vérifier la cohérence dimensionnelle
            des termes de l'équation.

          \item Relier les dimensions de $\mathcal{G}$
            et de $c$ aux grandeurs intervenant
            dans la relativité générale.

        \end{itemize}

        \item {\bf Gravitation quantique}

        \begin{itemize}[label=$\circ$]

          \item Introduire les dimensions de Planck
            à partir de $\hbar$, $\mathcal{G}$ et $c$.

          \item Définir la longueur de Planck :

            \[
              \ell_{\mathrm P}
              = \sqrt{\frac{\hbar\mathcal{G}}{c^3}}.
            \]

          \item Définir le temps de Planck :

            \[
              t_{\mathrm P}
              = \sqrt{\frac{\hbar\mathcal{G}}{c^5}}.
            \]

          \item Comprendre le rôle des constantes fondamentales
            dans la construction d'échelles physiques.

        \end{itemize}

      \end{itemize}
      


questions:

  - id: q1

    enonce: |
      {\bf Constante de la gravitation universelle $\mathcal{G}$.}\\

      La force d’attraction qui s’exerce entre deux points matériels, de masse $m$ et $m'$ , séparés par une distance $r$, est donnée, en module, par la loi d’interaction gravitationnelle de Newton :
      $$
      F = \mathcal{G} \frac{m m'}{r^2}.
      $$

      \begin{enumerate}[label=\alph*)]
        \item Donner les dimensions des différentes grandeurs physiques de la formule.
        \item Écrire l’équation aux dimensions et en déduire la dimension de la constante universelle de la gravitation $\mathcal{G}$. Donner son unité dans le S.I. (Système International).
        \item Peut-on calculer sa valeur numérique ? \\
        {\em Remarque}  : la constante $\mathcal{G}$ a été mesurée directement la première fois par Henry Cavendish en 1798 au moyen de sa balance de torsion et il trouva une valeur de $6,6 10^{-11}$ S.I. (à des erreurs expérimentales près)
      \end{enumerate}

    
    coup_de_pouce: 
      
      - titre: |

        texte: |
          En isolant la constante dans l'équation de la loi physique, on détermine sa dimension globale : $[\mathcal{G}] = [F] * [r]^2 / ([m] * [m'])$.


    solution: 

      - titre: |
          Dimmension de $[\mathcal{G}]$

        texte : |

          \begin{enumerate}[label=\alph*)]
            \item 
              %\vspace{-0.5cm}
              \begin{itemize}[label=$\bullet$]
                \item[\textcolor{\colorOne}{$\bullet$}] {\color{\colorOne} la force : $[F] = M * L * T^{-2}$}
                \item[\textcolor{\colorFour}{$\bullet$}] {\color{\colorFour} les masses : $[m] = [m'] = M$}
                \item[\textcolor{\colorFive}{$\bullet$}] {\color{\colorFive} la distance : $[r] = L$}
                \item[\textcolor{\colorSix}{$\bullet$}] {\color{\colorSix} la constante universelle de la gravitation :
                $[\mathcal{G}] = ??? $}
              \end{itemize}
              \bigskip
              $$
              \ptFleche{Force}{$ \displaystyle \color{\colorOne} F$} = \ptFleche{Gravi}{$ \displaystyle \color{\colorSix} \mathcal{G}$}  \frac{\ptFleche{Massesmm}{$ \displaystyle \color{\colorFour} m m'$}}{\ptFleche{Distance}{$ \displaystyle \color{\colorFive} r^2$} }.
              $$
              \begin{tikzpicture}[overlay,remember picture]
