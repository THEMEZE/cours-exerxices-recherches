    enonce: |
      {\bf (${}^*$) Constante des gaz parfait $\bm{R}$} \\

      La loi des gaz parfait relie le volume $V$, la pression $P$ et la température $T$ de $n$ moles de gaz :
      $$
      PV = n RT.
      $$

      \begin{enumerate}[label=\alph*)]
        \item Donner les dimensions des différentes grandeurs physiques de la formule.
        \item Écrire l’équation aux dimensions et en déduire la dimension de la constante des gaz parfait $R$. Donner son unité dans le S.I.
      \end{enumerate}

    
    coup_de_pouce: 
      
      - titre: |

        texte: |
          Le produit de la pression par le volume $P * V$ représente une dimension d'énergie :$M * L^2 * T^{-2}$.


    solution: 

      - titre: |
          Dimmension de $[\mathcal{G}]$

        texte : |

          \begin{enumerate}[label=\alph*)]
            \item 
              %\vspace{-0.5cm}
              \begin{itemize}[label=$\bullet$]
                \item  la pression : $[P] = [F]/[S] = M * L^{-1} * T^{-2}$ 
                \item  la force : $[F] = M * L * T^{-2}$ 
                \item  le volume : $[V] = L^3$ 
                \item  la quantitée de matière : $[n] = N $ 
                \item  la température: $[T] = K$.
                \item  la constante des gaz parfait : $[R] = ??? $.
              \end{itemize}
            \item En isolant la formule il vien que $R = PV/(nT)$ donc 
              \begin{itemize}[label=$\bullet$]
                \item ${\displaystyle [R] =  \frac{ \overbrace{M * L^{-1} * T^{-2}}^{[P]} * \overbrace{L^3}^{[V]} }{ \underbrace{mol}_{[N]} * \underbrace{\Theta}_{[T]} } = M * L^2 * T^{-2} * \Theta^{-1} * N^{-1} } $ .
                \item son utité est donnée en $J \cdot K^{-1} \cdot mol^{-1}$ (ou $kg \cdot m^2 \cdot s^{-2} \cdot K^{-1} \cdot mol^{-1}$ ).
              \end{itemize}


          \end{enumerate}

          \begin{enumerate}[label=\alph*)]
            \item 
              %\vspace{-0.5cm}
              \begin{itemize}[label=$\bullet$]
                \item[\textcolor{\colorOne}{$\bullet$}] {\color{\colorOne} la pression : $[P] = [F]/[S] = M * L^{-1} * T^{-2}$}
                \item[\textcolor{\colorFour}{$\bullet$}] {\color{\colorFour} le volume : $[V] = L^3$}
                \item[\textcolor{\colorFive}{$\bullet$}] {\color{\colorFive} la quantitée de matière : $[n] = N$}
                \item[\textcolor{\colorThree}{$\bullet$}] {\color{\colorThree} la température : $[T] = K$}
                \item[\textcolor{\colorSix}{$\bullet$}] {\color{\colorSix} la constante des gaz parfait : $[R] = ??? $ }
              \end{itemize}
              \bigskip
              $$
              \ptFleche{Force}{$ \displaystyle \color{\colorOne} P$} \ptFleche{Massesmm}{$ \displaystyle \color{\colorFour} V$}  =  \ptFleche{Distance}{$ \displaystyle \color{\colorFive} n$} \ptFleche{Gravi}{$ \displaystyle \color{\colorSix} R$} \ptFleche{Temp}{$ \displaystyle \color{\colorThree} T$}
              $$
              \begin{tikzpicture}[overlay,remember picture]
                \draw[  opacity = 1 ]
                  (Force) edge[line width=0.2ex ,color = colorOne ,arrows = -{Computer Modern Rightarrow[sharp ,length=0.1cm]},  , out = 110 , in = 0  ]node[pos=1, left]{\color{colorOne} \fontsize{6pt}{10pt}\selectfont \bfseries  $[P] = M * L^{-1} * T^{-2}$  }($(Force) + (-1.05cm,0.45cm)$)
                ;

                \draw[  opacity = 1 ]
                (Gravi) edge[line width=0.2ex ,color = colorSix ,arrows = -{Computer Modern Rightarrow[sharp ,length=0.1cm]},  , out = -70 , in = 180  ]node[pos=1, draw = none , right=0.00cm , rectangle  , shift = {(0.00cm , -0.0cm)} ]{\color{colorSix} \fontsize{6pt}{4}\selectfont \bfseries $\displaystyle [R] = ??? $ }($(Gravi) + (2.0cm,-0.65cm)$)
                ;

                \draw[  opacity = 1 ]
                (Massesmm) edge[line width=0.2ex ,color = colorFour ,arrows = -{Computer Modern Rightarrow[sharp ,length=0.1cm]},  , out = 70 , in = 180  ]node[pos=1, draw = none , right=0.00cm , rectangle  , shift = {(0.00cm , -0.0cm)} ]{\color{colorFour} \fontsize{6pt}{4}\selectfont \bfseries $\displaystyle [V] = L^3 $ }($(Massesmm) + (1.0cm,0.65cm)$)
                ;

                \draw[  opacity = 1 ]
                (Temp) edge[line width=0.2ex ,color = colorThree ,arrows = -{Computer Modern Rightarrow[sharp ,length=0.1cm]},  , out = 10 , in = 180  ]node[pos=1, draw = none , right=0.00cm , rectangle  , shift = {(0.00cm , -0.0cm)} ]{\color{colorThree} \fontsize{6pt}{4}\selectfont \bfseries $\displaystyle [T] = K$ }($(Temp) + (1.0cm,0.05cm)$)
                ;

                \draw[  opacity = 1 ]
                (Distance) edge[line width=0.2ex ,color = colorFive ,arrows = -{Computer Modern Rightarrow[sharp ,length=0.1cm]},  , out = -90 , in = 180  ]node[pos=1, draw = none , right=0.00cm , rectangle  , shift = {(0.00cm , -0.0cm)} ]{\color{colorFive} \fontsize{6pt}{4}\selectfont \bfseries $\displaystyle [n] = N $ }($(Distance) + (1.0cm,-0.95cm)$)
                ;


              \end{tikzpicture}

              
            \item En isolant la formule il vient que $ {\displaystyle {\color{\colorSix} \varepsilon_0} =  \frac{1}{4 \pi} \frac{{ \color{\colorFour} mm'} }{{\color{\colorOne} F} {\color{\colorFive}r^2} } }$ donc 
              \begin{itemize}[label=$\bullet$]
                \item ${\displaystyle {\color{\colorSix}[\varepsilon_0]}  = {\color{\colorOne} \overbrace{M^{-1} * L^{-1} * T^{2}}^{[F^{-1}]}} \frac{ {\color{\colorFour} \overbrace{I^2*T^2}^{[qq']} } }{ {\color{\colorFive} \underbrace{L^2}_{[r^2]} } } = {\color{\colorSix} M^{-1} * L^{-3} * T^4 * I^2}} $ .
                \item son unité est donnée en ${\color{\colorSix} kg^{-1}\cdot m^{-3}\cdot s^4\cdot A^2} $
              \end{itemize}
            \item En isolant la formule il vien que ${\displaystyle {\color{\colorSix} R}  = \frac{{\color{\colorOne} P} {\color{\colorFour} V } }{ {\color{\colorFive} n} {\color{\colorThree} T }}}$ donc 
              \begin{itemize}[label=$\bullet$]
                \item ${\displaystyle {\color{\colorSix} [R]}  =  \frac{ {\color{\colorOne} \overbrace{M * L^{-1} * T^{-2}}^{[P]}}  * {\color{\colorFour} \overbrace{L^3}^{[V]}}  }{ {\color{\colorFive} \underbrace{N}_{[n]} } * {\color{\colorThree} \underbrace{\Theta}_{[T]}} } = {\color{\colorSix} M * L^2 * T^{-2} * \Theta^{-1} * N^{-1} } } $ .
                \item son utité est donnée en ${\color{\colorSix}J \cdot K^{-1} \cdot mol^{-1}} $ (ou ${\color{\colorSix} kg \cdot m^2 \cdot s^{-2} \cdot K^{-1} \cdot mol^{-1}} $ ).
              \end{itemize}

          \end{enumerate}


