          $R = N_A \cdot k_B = 8,314 ~ {\color{colorSix} \text{J} \cdot \text{mol}^{-1} \cdot \text{K}^{-1} }$ avec $N_A = 6,022 \times 10^{23} ~ \text{mol}^{-1}$ (nombre d'Avogadro) et $k_B = 1,380 \times 10^{-23} ~ \text{J} \cdot \text{K}^{-1}$ (constante de Boltzmann)
          
