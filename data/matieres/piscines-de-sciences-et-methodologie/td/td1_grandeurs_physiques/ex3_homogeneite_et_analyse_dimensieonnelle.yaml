  indispensable: true

enonce_intro: |
  L'analyse dimensionnelle est un outil permettant de vérifier rapidement
  la cohérence d'une relation physique. Elle repose notamment sur le principe
  d'homogénéité : deux grandeurs additionnées ou soustraites doivent avoir
  la même dimension, et les deux membres d'une équation physique doivent
  également avoir la même dimension.

  Cet exercice permet de revoir les règles fondamentales de l'analyse
  dimensionnelle et de les appliquer à différentes relations physiques.


prerequis:
  - titre: |
      Grandeurs fondamentales et dérivées du S.I.

    texte: |
      \begin{itemize}[label=$\bullet$]
        \item Connaître les grandeurs fondamentales du S.I. et leurs dimensions :
          longueur $L$, masse $M$, temps $T$.
        \item Savoir exprimer la dimension des grandeurs dérivées à partir
          des dimensions fondamentales.
        \item Connaître notamment :
          \[
            [v]=L*T^{-1},
            \qquad
            [a]=L*T^{-2}.
          \]
      \end{itemize}

  - titre: |
    
      Calcul dimensionnel

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Calcul dimensionnel }
        \begin{itemize}[label=$\circ$]
          \item Savoir calculer la dimension d'un produit ou d'un quotient
            de grandeurs.
          \item Savoir utiliser les puissances d'une grandeur dans une
            expression dimensionnelle.
          \item Savoir reconnaître une grandeur sans dimension.
        \end{itemize}
        \item {\bf Opérations sur les grandeurs physiques }
        \begin{itemize}[label=$\circ$]
          \item Savoir que l'addition et la soustraction ne sont possibles
            qu'entre grandeurs de même dimension.
          \item Savoir que les dimensions se multiplient lors d'un produit
            et se divisent lors d'un quotient.
        \end{itemize}
      \end{itemize}

  # - titre: |
  #     Opérations sur les grandeurs physiques

  #   texte: |
  #     \begin{itemize}[label=$\bullet$]
  #       \item Savoir que l'addition et la soustraction ne sont possibles
  #         qu'entre grandeurs de même dimension.
  #       \item Savoir que les dimensions se multiplient lors d'un produit
  #         et se divisent lors d'un quotient.
  #     \end{itemize}


objectifs_pedagogiques_etudiants:

  - titre: |
    texte :
      \begin{itemize}[label = $\bullet$]
        \item {\bf Vérification de l'homogénéité }
          \begin{itemize}[label=$\circ$]
            \item Savoir déterminer si une équation physique est homogène en
              comparant les dimensions de ses différents termes et de ses deux membres.
            \item Savoir identifier rapidement une relation nécessairement fausse
              lorsqu'elle n'est pas homogène.
          \end{itemize}
        \item {\bf Détermination de la dimension d'une constante }
          \begin{itemize}[label=$\circ$]
            \item Savoir retrouver la dimension d'une constante ou d'un paramètre
              physique à partir d'une relation connue.
            \item Savoir isoler dimensionnellement une grandeur inconnue à partir
              d'une équation physique.
          \end{itemize}
        \item {\bf Fonctions mathématiques }
          \begin{itemize}[label=$\circ$]
            \item Savoir que les arguments des fonctions trigonométriques,
              exponentielles et logarithmiques doivent être sans dimension.
            \item Savoir déterminer les dimensions des grandeurs intervenant
              dans l'argument d'une fonction mathématique.
          \end{itemize}
        \item {\bf Utilisation de l'analyse dimensionnelle }
          \begin{itemize}[label=$\circ$]
            \item Utiliser l'analyse dimensionnelle comme outil de contrôle
              rapide d'une relation physique.
            \item Comprendre qu'une relation homogène n'est pas nécessairement
              vraie, mais qu'une relation non homogène ne peut pas être correcte.
          \end{itemize}
      \end{itemize}

