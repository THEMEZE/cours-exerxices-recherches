bilan: 
  - titre: |
      Bilan

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Homogénéité d'une équation}
          \begin{itemize}[label = $\circ$]
            \item Une équation physique doit être homogène : tous les termes
              qui sont additionnés ou soustraits doivent avoir la même dimension,
              et les deux membres de l'équation doivent avoir la même dimension.
            \item L'analyse dimensionnelle permet donc de détecter rapidement
              une équation impossible ou incohérente.
          \end{itemize}

        \item {\bf Analyse dimensionnelle des grandeurs}
          \begin{itemize}[label = $\circ$]
            \item Pour déterminer la dimension d'une grandeur ou d'une constante,
              partir de la relation qui la définit et remplacer chaque grandeur
              par sa dimension.
            \item Les constantes numériques sans dimension, comme $\frac{1}{2}$
              ou $2$, ne modifient pas la dimension d'une expression.
          \end{itemize}

        \item {\bf Fonctions mathématiques}
          \begin{itemize}[label = $\circ$]
            \item L'argument d'une fonction trigonométrique, exponentielle ou
              logarithmique doit être sans dimension.
            \item Ainsi, dans $\cos(\omega t+\varphi)$, les grandeurs
              $\omega t$ et $\varphi$ sont sans dimension.
          \end{itemize}

        \item {\bf Vérification d'une relation physique}
          \begin{itemize}[label = $\circ$]
            \item Une équation homogène n'est pas nécessairement vraie :
              l'analyse dimensionnelle vérifie la cohérence des dimensions,
              mais ne permet pas de déterminer les coefficients numériques
              ou de valider à elle seule la relation physique.
            \item En revanche, une équation non homogène ne peut pas être
              une relation physique correcte entre les grandeurs considérées.
          \end{itemize}
      \end{itemize}


aller_plus_loin:
  - niveau: lycee
    titre: |
      Vérifier des relations physiques simples

    texte: |
      Utiliser l'analyse dimensionnelle pour vérifier les relations
      classiques de mécanique et d'électricité, par exemple
      $v=d/t$, $E_c=\frac12mv^2$ ou $P=UI$.

  - niveau: prepa
    titre: |
      Retrouver une relation par analyse dimensionnelle

    texte: |
      Utiliser l'analyse dimensionnelle pour déterminer la forme possible
      d'une loi physique à partir des grandeurs dont elle dépend.
      On pourra notamment introduire l'analyse dimensionnelle de lois
      faisant intervenir plusieurs paramètres.

  - niveau: licence
    titre: |
      Théorème de Vaschy-Buckingham

    texte: |
      Introduire le théorème $\Pi$ de Vaschy-Buckingham et la construction
      de grandeurs sans dimension. Montrer comment cette méthode permet
      de réduire le nombre de paramètres indépendants d'un problème physique.

  - niveau: master
    titre: |
      Analyse d'échelles et similitude

    texte: |
      Étendre l'analyse dimensionnelle à l'analyse d'échelles, aux lois
      d'échelle et aux nombres sans dimension utilisés en physique
      et en mécanique des fluides, tels que les nombres de Reynolds,
      de Froude ou de Mach.
      


questions:


  - id: q1_intro

    enonce: |
      {\bf Notions de cours S.I.} 
      %Répondre aux questions de cours relatives à l'homogénéité
      %(a) Définir une équation homogène. (b) Une équation homogène est-elle forcément vraie ? (c) Une équation non homogène peut-elle être vraie ? (d) Quelles sont les règles d'addition/soustraction ? (e) De multiplication/division ? (f) Quelle est la dimension d'une dérivée df/dx ? (g) Quelle est la dimension des fonctions transcendentales (exp, cos, ln) et de leurs arguments ?
      \begin{enumerate}[label=\alph*)]
        \item Définir la notion d’homogénéité.
        \item Une équation homogène est elle nécessairement vraie ?
        \item Une équation non homogène est elle nécessairement fausse ?
        \item Dans quels cas, peut on additionner/soustraire des grandeurs entre elles ?
        \item Dans quels cas, peut on multiplier/diviser des grandeurs entre elles ?
        \item Quelle est la dimension de la dérivée d’une grandeur par rapport à une variable ?
        \item Que peut on dire de la dimension des fonctions mathématiques $\exp(x)$ , $\cos(x)$ , $\ln(x)$ ? Et de leur argument ?
      \end{enumerate}

    solution:
      - titre: |

        texte: |
          \begin{enumerate}[label=\alph*)]
            \item Une équation est homogène si tous ses termes ont la même dimension.
            \item Non, elle peut être physiquement fausse à cause d'un facteur numérique.
            \item Oui, une équation non homogène est toujours fausse.
            \item On ne peut additionner que des grandeurs de même dimension.
            \item On peut multiplier ou diviser des grandeurs de dimensions différentes.
            \item $[df/dx] = [f] / [x]$.
            \item Les fonctions transcendentales et leurs arguments sont adimensionnels $([f] = 1, [x] = 1)$.
          \end{enumerate}
