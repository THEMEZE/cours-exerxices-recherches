point_cours:
  - titre: |
      Principe d'homogénéité

    texte: |
      Une relation physique doit être homogène : tous les termes qui sont
      additionnés ou soustraits doivent avoir la même dimension et les deux
      membres d'une équation doivent avoir la même dimension.

  - titre: |
      Règles de calcul dimensionnel

    texte: |
      \begin{itemize}[label=$\bullet$]
        \item Pour un produit :
          \[
            [AB]=[A][B].
          \]
        \item Pour un quotient :
          \[
            \left[\frac{A}{B}\right]=\frac{[A]}{[B]}.
          \]
        \item Pour une puissance :
          \[
            [A^n]=[A]^n.
          \]
        \item Pour une somme ou une différence, les termes doivent avoir
          la même dimension.
      \end{itemize}

  - titre: |
      Grandeurs sans dimension $\&$ Fonctions mathématiques

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Grandeurs sans dimension }
          \begin{itemize}[label=$\circ$]
            \item Une grandeur sans dimension possède une dimension égale à $1$..
            \item Les constantes numériques pures sont sans dimension et ne modifient pas la dimension d'une expression.
          \end{itemize}
        \item {\bf Fonctions mathématiques}
          \begin{itemize}[label=$\circ$]
            \item Les fonctions $\exp$, $\cos$, $\sin$ et $\ln$ prennent un argument sans dimension. Ainsi, si $f(x)$ désigne l'une de ces fonctions, l'argument $x$ doit vérifier :
            \[
              [x]=1.
            \]
          \end{itemize}
      \end{itemize}

  - titre: |
      Dérivation

    texte: |
      Pour une grandeur $f$ dépendant d'une variable $x$, la dimension
      de la dérivée est donnée par :
      \[
        \left[\frac{df}{dx}\right]=\frac{[f]}{[x]}.
      \]

remarques_pedagogiques_ecueils_classiques:

  - titre: |

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Confondre homogénéité et vérité }
          \begin{itemize}[label=$\circ$]
            \item Comprendre qu'une relation homogène n'est pas nécessairement
              correcte.
            \item Par exemple, $x=at^2$ et $x=2at^2$ sont toutes deux homogènes,
              mais l'analyse dimensionnelle seule ne permet pas de déterminer
              le coefficient numérique correct.
          \end{itemize}
        \item {\bf Additionner des dimensions différentes }
          \begin{itemize}[label=$\circ$]
            \item Éviter d'additionner ou de soustraire directement des grandeurs
              de dimensions différentes.
            \item Rappeler que des expressions comme $x+v$ ou $a+t$ n'ont pas
              de sens physique en général.
          \end{itemize}
        \item {\bf Oublier les puissances }
          \begin{itemize}[label=$\circ$]
            \item Lors du calcul dimensionnel, appliquer les puissances à
              l'ensemble de la dimension de la grandeur.
            \item Par exemple :
              \[
                [v^2]=[v]^2.
              \]
          \end{itemize}
        \item {\bf Oublier que les arguments sont sans dimension }
          \begin{itemize}[label=$\circ$]
            \item Vérifier que l'argument d'une fonction trigonométrique,
              exponentielle ou logarithmique est sans dimension.
            \item Pour $\cos(\omega t+\varphi)$, vérifier notamment :
              \[
                [\omega]=T^{-1}
                \qquad\text{et}\qquad
                [\varphi]=1.
              \]
          \end{itemize}
        \item {\bf Confondre unité et dimension }
          \begin{itemize}[label=$\circ$]
            \item Distinguer la dimension d'une grandeur de son unité.
            \item Par exemple, une longueur a pour dimension $L$, tandis que
              son unité dans le S.I. peut être le mètre.
          \end{itemize}
      \end{itemize}

  # - titre: |
  #     Confondre homogénéité et vérité

  #   texte: |
  #     Une relation homogène n'est pas nécessairement correcte. Par exemple,
  #     $x=at^2$ et $x=2at^2$ sont toutes deux homogènes, mais l'analyse
  #     dimensionnelle seule ne permet pas de déterminer le coefficient
  #     numérique correct.

  # - titre: |
  #     Additionner des dimensions différentes

  #   texte: |
  #     Une erreur fréquente consiste à additionner directement des grandeurs
  #     de dimensions différentes. Rappeler que des termes comme $x+v$ ou
  #     $a+t$ n'ont pas de sens physique en général.

  # - titre: |
  #     Oublier les puissances

  #   texte: |
  #     Lors du calcul de la dimension d'une expression comme $v^2/a$,
  #     les puissances doivent être appliquées à toute la dimension de la
  #     grandeur :
  #     \[
  #       [v^2]=[v]^2.
  #     \]

  # - titre: |
  #     Oublier que les arguments sont sans dimension

  #   texte: |
  #     Pour une expression telle que $\cos(\omega t+\varphi)$, les étudiants
  #     peuvent oublier que l'ensemble $\omega t+\varphi$ doit être sans
  #     dimension. Il faut donc avoir :
  #     \[
  #       [\omega]=T^{-1}
  #       \qquad\text{et}\qquad
  #       [\varphi]=1.
  #     \]

  # - titre: |
  #     Confondre unité et dimension

  #   texte: |
  #     Une dimension et une unité ne sont pas synonymes. Par exemple,
  #     une longueur a pour dimension $L$, tandis que son unité dans le S.I.
  #     peut être le mètre.

remarques_pedagogiques_conseils_animation:

  - titre: |
      

    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf Commencer par le vocabulaire }
          \begin{itemize}[label=$\circ$]
            \item Faire expliciter par les étudiants les notions de dimension,
              d'homogénéité et de grandeur sans dimension.
            \item Vérifier que les étudiants distinguent correctement ces trois
              notions avant de commencer les calculs.
          \end{itemize}
        \item {\bf Faire verbaliser le raisonnement }
          \begin{itemize}[label=$\circ$]
            \item Demander aux étudiants de justifier chaque étape du calcul
              dimensionnel.
            \item Faire expliciter des questions simples comme :
              « quelle est la dimension de cette grandeur ? »,
              « pourquoi peut-on additionner ces deux termes ? »,
              « que doit vérifier l'argument du cosinus ? ».
          \end{itemize}
        \item {\bf Utiliser la première question comme diagnostic }
          \begin{itemize}[label=$\circ$]
            \item Utiliser la question de cours pour identifier rapidement
              les difficultés des étudiants.
            \item Porter une attention particulière à la distinction entre
              condition nécessaire et condition suffisante.
          \end{itemize}
        \item {\bf Insister sur l'ordre des calculs }
          \begin{itemize}[label=$\circ$]
            \item Encourager les étudiants à identifier d'abord la dimension
              du membre de gauche.
            \item Calculer ensuite séparément la dimension de chaque terme
              du membre de droite, puis comparer les résultats.
          \end{itemize}
        \item {\bf Faire remarquer les grandeurs caractéristiques }
          \begin{itemize}[label=$\circ$]
            \item Faire reconnaître les dimensions usuelles des grandeurs
              rencontrées en mécanique.
            \item Identifier notamment :
              \[
                [v]=L*T^{-1},
                \qquad
                [a]=L*T^{-2},
                \qquad
                [\mathcal{E}]=M*L^2*T^{-2}.
              \]
          \end{itemize}
      \end{itemize}


