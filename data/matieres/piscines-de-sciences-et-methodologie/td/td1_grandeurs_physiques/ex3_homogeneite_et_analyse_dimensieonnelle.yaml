objectifs_pedagogiques_enseignants:

  - titre: |
    texte:
      \begin{itemize}[label = $\bullet$]
        \item {\bf Consolider les règles de base }
          \begin{itemize}[label=$\circ$]
            \item Vérifier que les étudiants maîtrisent les règles d'addition
              et de soustraction des grandeurs physiques.
            \item Vérifier que les étudiants maîtrisent les règles de multiplication
              et de division des grandeurs physiques.
          \end{itemize}
        \item {\bf Distinguer homogénéité et validité }
          \begin{itemize}[label=$\circ$]
            \item Insister sur le fait qu'une relation homogène n'est pas
              nécessairement vraie.
            \item Faire comprendre que l'homogénéité est une condition nécessaire
              de cohérence, mais pas une condition suffisante de validité physique.
          \end{itemize}
        \item {\bf Développer un réflexe de vérification }
          \begin{itemize}[label=$\circ$]
            \item Encourager les étudiants à effectuer une analyse dimensionnelle
              avant toute application numérique.
            \item Inciter les étudiants à utiliser l'analyse dimensionnelle avant
              toute manipulation algébrique complexe.
          \end{itemize}
        \item {\bf Introduire les grandeurs sans dimension }
          \begin{itemize}[label=$\circ$]
            \item Faire identifier les grandeurs adimensionnelles dans une
              expression physique.
            \item Faire comprendre le rôle des grandeurs sans dimension dans les
              arguments des fonctions trigonométriques, exponentielles et
              logarithmiques.
          \end{itemize}
      \end{itemize}
