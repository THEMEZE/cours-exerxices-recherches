remarques_pedagogiques_ecueils_classiques: 

  - titre: |
      
    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Confusion entre dimension et unité}
          \begin{itemize}[label = $\circ$]
            \item Les étudiants peuvent confondre la dimension d'une grandeur avec son unité. Par exemple, la longueur a pour dimension L et pour unité de base le mètre (m).
          \end{itemize}
        \item {\bf Erreur sur l'unité de masse}
          \begin{itemize}[label = $\circ$]
            \item Vérifier que les étudiants utilisent le kilogramme (kg), et non le gramme (g), comme unité de base du S.I.
          \end{itemize}
        \item {\bf Erreurs de puissances de dix}
          \begin{itemize}[label = $\circ$]
            \item Les conversions impliquant plusieurs préfixes peuvent entraîner des erreurs de signe ou d'exposant. Faire vérifier systématiquement le facteur de conversion.
          \end{itemize}
        \item {\bf Confusion entre symbole et nom}
          \begin{itemize}[label = $\circ$]
            \item Être attentif à l'utilisation correcte des symboles des unités : m, kg, s, A, K, mol et cd
          \end{itemize}
      \end{itemize}


