remarques_pedagogiques_conseils_animation: 

  - titre: |
      
    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Faire émerger les connaissances}
          \begin{itemize}[label = $\circ$]
            \item Commencer par demander aux étudiants de citer spontanément les grandeurs fondamentales et leurs unités avant de compléter ou corriger collectivement.
          \end{itemize}
        \item {\bf Justifier les conversions}
          \begin{itemize}[label = $\circ$]
            \item Lors des conversions, demander aux étudiants d'expliciter le préfixe utilisé et la puissance de dix correspondante plutôt que de se limiter au résultat numérique.
          \end{itemize}
        \item {\bf Insister sur les ordres de grandeur}
          \begin{itemize}[label = $\circ$]
            \item Faire vérifier la cohérence du résultat obtenu en comparant les unités de départ et d'arrivée et l'ordre de grandeur attendu.
          \end{itemize}
      \end{itemize}


