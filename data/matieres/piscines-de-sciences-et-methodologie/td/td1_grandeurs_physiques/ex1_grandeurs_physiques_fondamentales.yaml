  #     Savoir qu'une unité peut être exprimée à l'aide de multiples et sous-multiples décimaux.


objectifs_pedagogiques_etudiants :
  - titre: |
      Identifier les grandeurs fondamentales
    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Identifier les grandeurs fondamentales}
          \begin{itemize}[label = $\circ$]
            \item Identifier les sept grandeurs physiques fondamentales du Système international et associer à chacune sa dimension, son unité de base et son symbole.
          \end{itemize}
        \item {\bf Maîtriser les unités du S.I.}
          \begin{itemize}[label = $\circ$]
            \item  Connaître les sept unités de base du Système international : mètre, kilogramme, seconde, ampère, kelvin, mole et candela.
          \end{itemize}
        \item {\bf Effectuer des conversions}
          \begin{itemize}[label = $\circ$]
            \item  Utiliser les préfixes du Système international pour convertir une grandeur d'une unité à une autre et exprimer le résultat en notation scientifique.
          \end{itemize}
        \item {\bf Manipuler les puissances de dix}
          \begin{itemize}[label = $\circ$]
            \item  Utiliser correctement les puissances de dix associées aux multiples et sous-multiples des unités.
          \end{itemize}
      \end{itemize}


