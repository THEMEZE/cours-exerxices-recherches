objectifs_pedagogiques_enseignants :

  - titre: |
      Vérifier les connaissances fondamentales
    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Vérifier les connaissances fondamentales}
          \begin{itemize}[label = $\circ$]
            \item Vérifier que les étudiants connaissent les sept grandeurs fondamentales du S.I., leurs dimensions et leurs unités de base.
          \end{itemize}
        \item {\bf Repérer les difficultés de conversion}
          \begin{itemize}[label = $\circ$]
            \item  Identifier les erreurs liées aux préfixes, aux puissances de dix et aux changements d'unités.
          \end{itemize}
        \item {\bf Installer les conventions du S.I.}
          \begin{itemize}[label = $\circ$]
            \item  S'assurer que les étudiants utilisent correctement les symboles et les unités du Système international, notamment le kilogramme comme unité de base de la masse.
          \end{itemize}
      \end{itemize}

