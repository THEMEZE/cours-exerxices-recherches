point_cours :

  - titre: |
      
    texte: |
      \begin{itemize}[label = $\bullet$]
        \item {\bf  Les sept grandeurs fondamentales du S.I.}
          \begin{itemize}[label = $\circ$]
            \item Le Système international repose sur sept grandeurs fondamentales : longueur, masse, temps, intensité électrique, température thermodynamique, quantité de matière et intensité lumineuse.
          \end{itemize}
        \item {\bf Les unités de base}
          \begin{itemize}[label = $\circ$]
            \item  Les unités de base correspondantes sont respectivement le mètre (m), le kilogramme (kg), la seconde (s), l'ampère (A), le kelvin (K), la mole (mol) et la candela (cd).
          \end{itemize}
        \item {\bf Préfixes et puissances de dix}
          \begin{itemize}[label = $\circ$]
            \item  Les multiples et sous-multiples des unités sont exprimés à l'aide de préfixes associés à des puissances de dix : kilo = $10^3$, milli = $10^{-3}$, micro = $10^{-6}$, nano = $10^{-9}$, etc.
          \end{itemize}
      \end{itemize}

