aller_plus_loin: 
  - niveau: lycee

    titre: |
      Analyse dimensionnelle et vérification d'homogénéité

    texte: |
      Au lycée, la distinction essentielle réside dans l'utilisation de l'analyse dimensionnelle pour vérifier la cohérence d'une formule physique. Une équation doit obligatoirement être {\bf homogène}  : les termes de chaque côté de l'égalité doivent posséder la même dimension.\\

      En associant à chaque grandeur fondamentale son symbole dimensionnel ($\mathsf{L}$ pour la longueur, $\mathsf{M}$ pour la masse, $\mathsf{T}$ pour le temps, $\mathsf{I}$ pour l'intensité), on détermine la dimension d'une grandeur dérivée. Par exemple, la force étant définie par $F = m \cdot a$, sa dimension s'écrit $[F] = \mathsf{M} \cdot \mathsf{L} \cdot \mathsf{T}^{-2}$. L'unité dérivée correspondante (le newton) équivaut donc à des $\text{kg}\cdot\text{m}\cdot\text{s}^{-2}$.


  - niveau: prepa
    titre: |
      Le théorème de Vaschy-Buckingham ($\bm{\pi}$) et la réduction adimensionnelle

    texte: |
      En classe préparatoire, l'analyse dimensionnelle devient un outil prédictif puissant grâce au {\bf théorème de Vaschy-Buckingham}  (ou théorème $\bm{\pi}$). Il stipule que tout problème physique reliant $n$ variables physiques exprimées à partir de $k$ dimensions fondamentales indépendantes peut être réécrit sous la forme d'une relation entre $n - k$ variables adimensionnelles (notées $\pi_1, \pi_2, \dots$).

      Cette méthode permet de déterminer la forme d'une loi physique à une constante multiplicative près, sans résoudre d'équation différentielle. Elle jette également les bases de la {\bf similitude mécanique}  : pour fabriquer une maquette à échelle réduite (aéronautique, hydrodynamique) qui se comporte exactement comme le modèle réel, il suffit de conserver les mêmes nombres adimensionnels (comme le nombre de Reynolds $\mathcal{R}e$ ou de Froude $\mathcal{F}r$).


  - niveau: licence
    titre: |
      La refonte du Système International (2019) : la fixation des constantes fondamentales

    texte: |
      En licence, on étudie la métrologie moderne et la révision majeure du SI entrée en vigueur le 20 mai 2019. Historiquement, les unités fondamentales étaient définies par des étalons matériels (comme le prototype international du kilogramme) ou des expériences spécifiques.

      Désormais, {\bf le SI est entièrement construit en fixant la valeur numérique exacte de 7 constantes fondamentales} de la nature :
      
      \begin{itemize}[label = $\bullet$]
        \item La fréquence de transition hyperfine du césium 133 ($\Delta \nu_{\text{Cs}}$)
        \item La vitesse de la lumière dans le vide ($c$)
        \item La constante de Planck ($h$)
        \item La charge élémentaire ($e$)
        \item La constante de Boltzmann ($k$)
        \item Le nombre d'Avogadro ($N_A$)
        \item L'efficacité lumineuse d'une radiation monochromatique ($K_{\text{cd}}$)
      \end{itemize}

      Les 7 unités fondamentales (m, kg, s, A, K, mol, cd) — et par extension toutes les unités dérivées — sont maintenant déduites directement de ces constantes universelles.


  - niveau: master
    titre: |
      Systèmes d'unités naturels et adimensionnement en théorie quantique des champs

    texte: |
      Au niveau master, la distinction rigide entre grandeurs fondamentales et dérivées s'estompe au profit des {\bf systèmes d'unités naturels} (unités de Planck, unités atomiques, ou unités relativistes $c = \hbar = k_B = 1$).

      En physique des hautes énergies et en théorie quantique des champs, fixer $c = 1$ et $\hbar = 1$ revient à rendre la vitesse et l'action adimensionnelles. Par conséquent, toutes les grandeurs physiques (masse, temps, longueur, énergie) s'expriment en fonction d'une seule dimension fondamentale : {\bf l'énergie } (généralement mesurée en $\text{eV}$).

      \begin{itemize}[label = $\bullet$]
        \item Une longueur $[L]$ devient homogène à une énergie inverse $[E]^{-1}$ (longueur de de Broglie).
        \item Un temps $[T]$ devient également homogène à $[E]^{-1}$.
        \item Une masse $[M]$ devient directement homogène à une énergie $[E]$.
      \end{itemize}

      Cette approche simplifie drastiquement les équations covariantes (comme les équations de Dirac ou de Klein-Gordon) et met en évidence la géométrie fondamentale de l'espace-temps et du vide quantique.

  - niveau: master

    titre: |
      Complétude du SI, grandeurs adimensionnelles et frontières métrologiques

    texte: |
      En physique, {\bf toutes les unités mesurables peuvent être dérivées des 7 unités fondamentales} du Système international ($\mathsf{M}, \mathsf{L}, \mathsf{T}, \mathsf{I}, \Theta, \mathsf{N}, \mathsf{J}$). Le SI forme un système théoriquement complet et cohérent, capable de couvrir l'intégralité des phénomènes physiques connus (mécanique, thermodynamique, électromagnétisme, chimie et photométrie).\\

      Cependant, l'analyse métrologique impose de nuancer ce principe selon trois axes fondamentaux :\\

      \begin{enumerate}[label=\arabic*.]

      \item {\bf Les grandeurs adimensionnelles (de dimension $\mathsf{1}$)}
      Certaines grandeurs physiques ne possèdent aucune dimension fondamentale. Elles résultent systématiquement du rapport de deux grandeurs de même nature, ce qui annule leurs unités dimensionnelles :

      \begin{itemize}[label = $\bullet$]
        \item {\bf L'angle plan (Radian — $\text{rad}$) :} défini comme le rapport de la longueur d'un arc de cercle par son rayon ($\text{m}\cdot\text{m}^{-1} = 1$).
        \item {\bf L'angle solide (Stéradian — $\text{sr}$) :} défini par le rapport d'une surface projetée sur le carré du rayon ($\text{m}^2\cdot\text{m}^{-2} = 1$).
        \item {\bf Les ratios et grandeurs de comptage :} l'indice de réfraction $n = \frac{c}{v}$ (rapport de deux vitesses), le nombre de tours, ou encore les fractions massiques et molaires.
      \end{itemize}

      \item {\bf Les unités hors SI usuel (historiques, impériales et spécialisées)}
      Une multitude d'unités n'appartiennent pas au SI strict de façon décimale ou directe. Elles mesurent pourtant les mêmes dimensions fondamentales et s'y ramènent par conversion exacte ou expérimentale :

      \begin{itemize}[label = $\bullet$]
        \item {\bf Unités de temps usuelles :} la minute ($60\text{ s}$) et l'heure ($3\ 600\text{ s}$), basées sur les découpages historiques du cycle terrestre.
        \item {\bf Système impérial / anglo-saxon :} le pouce ($0{,}0254\text{ m}$), le mile ($1\ 609{,}34\text{ m}$), le gallon ou la livre.
        \item {\bf Unités spécialisées par domaine :} l'électronvolt ($\text{eV}$, énergie à l'échelle atomique), l'unité astronomique ($\text{ua}$, distance dans le système solaire) ou le bar ($\text{bar} = 10^5\text{ Pa}$, pression).
      \end{itemize}

      \item {\bf Les grandeurs hors de la physique pure (Information et Économie)} 
      Dès qu'on sort de la physique classique, certaines unités reposent sur des axiomes totalement indépendants des dimensions $\mathsf{M, L, T}$ :

      \begin{itemize}[label = $\bullet$]
        \item {\bf L'information (Bit, Octet) :} le bit mesure l'alternance d'un état logique ($0$ ou $1$) ou une quantité d'entropie d'information selon Shannon. Bien qu'il se matérialise sur des supports physiques, le bit en tant que concept mathématique ne dérive d'aucune unité du SI.
        \item {\bf La monnaie (Euro, Dollar) :} unité de valeur économique et d'échange purement conventionnelle, sans aucun lien dimensionnel avec le monde physique. 
      \end{itemize}
      \end{enumerate}    


