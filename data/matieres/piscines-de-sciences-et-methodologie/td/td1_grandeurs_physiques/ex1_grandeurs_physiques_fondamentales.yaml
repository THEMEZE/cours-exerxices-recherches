enonce_intro: |


prerequis : 
  - titre: |
      Grandeurs physiques et unités
    texte: |
      \begin{itemize}[label = $\bullet$]
      \item {\bf  Grandeurs physiques et unités}
        \begin{itemize}[label = $\circ$]
          \item Savoir qu'une grandeur physique est exprimée à l'aide d'une valeur numérique et d'une unité. 
          \item Connaître les unités usuelles de longueur, masse et temps (m, kg, s) et savoir les utiliser dans un calcul.
        \end{itemize}
      \item {\bf Système international d'unités}
        \begin{itemize}[label = $\circ$]
          \item  Avoir été familiarisé avec le Système international d'unités (S.I.) et avec la notion d'unité de mesure.
          \item  Savoir qu'une unité peut être exprimée à l'aide de multiples et sous-multiples décimaux.
        \end{itemize}
      \end{itemize}

