enonce_intro: |
  Dans ce chapitre intitulé Grandeurs physiques, nous allons aborder des notions qui s’avèrent utiles
  dans tous les domaines des sciences notamment les sciences physiques et les sciences de l’ingénieur.
  En eﬀet, toute science utilise des grandeurs dont il faut connaitre la nature qu’on appelle la dimension
  insi qu’une valeur qui dépend de l’unité du système utilisé.


