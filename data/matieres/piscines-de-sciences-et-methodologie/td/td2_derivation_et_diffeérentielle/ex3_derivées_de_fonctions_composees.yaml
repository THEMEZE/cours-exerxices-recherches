id: td2_ex3
intitule: |
  Dérivées de fonctions composées
td: td2
facultatif: false
seance: 1

cours_rattache:
  - chap2.derivation_et_differentielle

metadonnees:
  duree_estimee: "40 min"
  difficulte: 2
  type_exercice: "Méthode"
  indispensable: true

enonce_intro: |
  Objectif : savoir utiliser la règle de la chaîne pour décomposer puis calculer la dérivée de fonctions composées par rapport au temps $t$.
  Rappel : dériver une fonction composée $f(u(x))$ par rapport à $x$ se fait simplement en décomposant la dérivée grâce à la règle de la chaîne : $\frac{\mathrm{d}f}{\mathrm{d}x} = \frac{\mathrm{d}f}{\mathrm{d}u} \cdot \frac{\mathrm{d}u}{\mathrm{d}x}$.

prerequis:
  - titre: "Règle de la chaîne"
    texte: |
      Comprendre la décomposition d'une dérivée composée : $\frac{\mathrm{d}f}{\mathrm{d}t} = \frac{\mathrm{d}f}{\mathrm{d}u} \cdot \frac{\mathrm{d}u}{\mathrm{d}t}$.

objectifs_pedagogiques_etudiants:
  - titre: "Appliquer la règle de la chaîne en physique"
    texte: |
      Savoir dériver des fonctions dont l'argument dépend implicitement ou explicitement du temps.

objectifs_pedagogiques_enseignants:
  - titre: "Lien géométrique et temporel"
    texte: |
      Illustrer la dérivation composée à l'aide d'un problème concret de variation de surface (cercle dont le rayon augmente).

coup_de_pouce:
  - titre: "Méthode étape par étape"
    texte: |
      Calcule d'abord la dérivée de la fonction externe par rapport à sa variable intermédiaire, puis multiplie par la dérivée temporelle de cette variable.

point_cours:
  - titre: "Théorème de dérivation des fonctions composées"
    texte: |
      Si $f$ dépend de $u$, et $u$ dépend de $t$, alors :
      $$\frac{\mathrm{d}f}{\mathrm{d}t} = \frac{\mathrm{d}f}{\mathrm{d}u} \cdot \frac{\mathrm{d}u}{\mathrm{d}t} = \frac{\mathrm{d}f}{\mathrm{d}u} \cdot \dot{u}$$

remarques_pedagogiques_ecueils_classiques:
  - titre: |
      Oubli du facteur $\dot{u}$
    texte: |
      Écrire $\frac{\mathrm{d}}{\mathrm{d}t}(\cos(\theta(t))) = -\sin(\theta(t))$ au lieu de $-\dot{\theta}(t)\sin(\theta(t))$.

remarques_pedagogiques_conseils_animation:
  - titre: "Sens physique du taux de variation de l'aire"
    texte: |
      Pour le cercle, insister sur le fait que l'aire grandit d'autant plus vite à $\dot{r}$ constant que le cercle est déjà grand ($r$ élevé).

bilan:
  - titre: "Synthèse"
    texte: |
      La règle de la chaîne est omniprésente en mécanique et thermodynamique lors du passage entre coordonnées spatiales et temporelles.

aller_plus_loin:
  - niveau: licence
    titre: "Changement de variables"
    texte: |
      Généralisation aux fonctions de plusieurs variables avec la règle de la chaîne partielle.

questions:
  - id: q1_a
    parent: "1"
    enonce: |
      Soit $f(z) = -a z^3 + b z^2 - c z + 1$ avec $z = z(t)$ et les paramètres $a,b,c$ constants.
      Calculer $\frac{\mathrm{d}f}{\mathrm{d}z}$ puis exprimer la dérivée $\frac{\mathrm{d}f}{\mathrm{d}t}$ en fonction de $z$, $\dot{z}$ et des paramètres constants.
    solution:
      - titre: "Résolution"
        texte: |
          $$\frac{\mathrm{d}f}{\mathrm{d}z} = -3a z^2 + 2b z - c$$
          $$\frac{\mathrm{d}f}{\mathrm{d}t} = \frac{\mathrm{d}f}{\mathrm{d}z} \cdot \frac{\mathrm{d}z}{\mathrm{d}t} = (-3a z^2 + 2b z - c) \cdot \dot{z}$$

  - id: q1_b
    parent: "1"
    enonce: |
      Étant donné l'expression de $z$ en fonction de $t$ : $z(t) = k t^2$ avec $k$ constant, en déduire l'expression de la dérivée $\frac{\mathrm{d}f}{\mathrm{d}t}$ en fonction de $t$.
    solution:
      - titre: "Résolution"
        texte: |
          Comme $z(t) = k t^2$, on a $\dot{z}(t) = 2kt$.
          $$\frac{\mathrm{d}f}{\mathrm{d}t} = \left(-3a (kt^2)^2 + 2b (kt^2) - c\right) \cdot (2kt) = -6a k^3 t^5 + 4b k^2 t^3 - 2ck t$$

  - id: q2_a
    parent: "2"
    enonce: |
      Soit $x(\theta) = R \cos(\theta)$ avec $\theta = \theta(t)$ et le paramètre $R$ constant.
      Calculer $\frac{\mathrm{d}x}{\mathrm{d}\theta}$ puis $\frac{\mathrm{d}x}{\mathrm{d}t}$ en fonction de $\theta$, $\dot{\theta}$ et des paramètres constants.
    solution:
      - titre: "Résolution"
        texte: |
          $$\frac{\mathrm{d}x}{\mathrm{d}\theta} = -R \sin(\theta)$$
          $$\frac{\mathrm{d}x}{\mathrm{d}t} = \frac{\mathrm{d}x}{\mathrm{d}\theta} \cdot \frac{\mathrm{d}\theta}{\mathrm{d}t} = -R \dot{\theta} \sin(\theta)$$

  - id: q2_b
    parent: "2"
    enonce: |
      Étant donné l'expression de $\theta$ en fonction de $t$ : $\theta(t) = \omega t^2 + 1$ avec $\omega$ constant, en déduire l'expression de $\frac{\mathrm{d}x}{\mathrm{d}t}$ en fonction de $t$.
    solution:
      - titre: "Résolution"
        texte: |
          On a $\dot{\theta}(t) = 2\omega t$.
          $$\frac{\mathrm{d}x}{\mathrm{d}t} = -R (2\omega t) \sin(\omega t^2 + 1) = -2 R \omega t \sin(\omega t^2 + 1)$$

  - id: q3_a
    parent: "3"
    enonce: |
      (*) On considère un cercle dont le rayon $r$ varie dans le temps : $r = r(t)$. L'aire du cercle est $A(r) = \pi r^2$.
      Déterminer la dérivée de $A$ par rapport à $r$, notée $\frac{\mathrm{d}A}{\mathrm{d}r}$.
    solution:
      - titre: "Résolution"
        texte: |
          $$\frac{\mathrm{d}A}{\mathrm{d}r} = 2\pi r$$

  - id: q3_b
    parent: "3"
    enonce: |
      En déduire une relation entre $\mathrm{d}A$ et $\mathrm{d}r$.
    solution:
      - titre: "Résolution"
        texte: |
          $$\mathrm{d}A = 2\pi r \mathrm{d}r$$

  - id: q3_c
    parent: "3"
    enonce: |
      Représenter la quantité $\mathrm{d}A$ sur un schéma.
    solution:
      - titre: "Résolution"
        texte: |
          On définie $$\Delta A(r) = A(r + \mathrm{d}r) - A(r) = \pi (r + \mathrm{d}r)^2 - \pi r^2 = \overbrace{2\pi r \mathrm{d}r}^{\mathrm{d}A(r)} + \pi (\mathrm{d}r)^2$$ (cf fig \ref{figDisque}). On supose que $\mathrm{d}r \ll r$ de tel sorte que $(\mathrm{d}r)^2 \ll r \mathrm{d}r , r^2$. Soit  $$\Delta A(r) \underset{\mathrm{d}r \ll r}{=} \mathrm{d}A(r) + o((\mathrm{d}r)^2).$$ Donc si $\mathrm{d}r \ll r$ alors $$\Delta A(r) \approx \mathrm{d}A(r)$$ et  la quantité $\mathrm{d}A$ est la surface de la couronne circulaire d'épaisseur infinitésimale $\mathrm{d}r$ entourant le cercle de rayon $r$.
        figure:

          - ref: td2_PhV110_Disque
            legende: |
              
            scale: 0.7
            label: figDisque
  - id: q3_d
    parent: "3"
    enonce: |
      En utilisant la règle de la chaîne, décomposer la dérivée $\frac{\mathrm{d}A}{\mathrm{d}t}$ correspondant au taux de variation de $A$ par rapport au temps $t$.
    solution:
      - titre: "Résolution"
        texte: |
          $$\frac{\mathrm{d}A}{\mathrm{d}t} = \frac{\mathrm{d}A}{\mathrm{d}r} \cdot \frac{\mathrm{d}r}{\mathrm{d}t}$$

  - id: q3_e
    parent: "3"
    enonce: |
      Montrer que le taux de variation de l'aire par rapport au temps dépend du rayon $r$ du cercle et du taux $\frac{\mathrm{d}r}{\mathrm{d}t}$.
    solution:
      - titre: "Résolution"
        texte: |
          $$\frac{\mathrm{d}A}{\mathrm{d}t} = 2\pi r \frac{\mathrm{d}r}{\mathrm{d}t}$$
          L'expression dépend explicitement du rayon $r$ et de la vitesse d'expansion du rayon $\frac{\mathrm{d}r}{\mathrm{d}t}$.

  - id: q3_f
    parent: "3"
    enonce: |
      On donne la valeur du taux de variation du rayon $\frac{\mathrm{d}r}{\mathrm{d}t} = 0,1\text{ cm}\cdot\text{s}^{-1}$.
      Calculer (en précisant l'unité) le taux $\frac{\mathrm{d}A}{\mathrm{d}t}$ pour $r = 2\text{ cm}$ puis pour $r = 12\text{ cm}$.
    solution:
      - titre: "Résolution"
        texte: |
          * Pour $r = 2\text{ cm}$ :
            $$\frac{\mathrm{d}A}{\mathrm{d}t} = 2\pi \times 2 \times 0,1 = 0,4\pi \approx 1,26\text{ cm}^2\cdot\text{s}^{-1}$$
          * Pour $r = 12\text{ cm}$ :
            $$\frac{\mathrm{d}A}{\mathrm{d}t} = 2\pi \times 12 \times 0,1 = 2,4\pi \approx 7,54\text{ cm}^2\cdot\text{s}^{-1}$$