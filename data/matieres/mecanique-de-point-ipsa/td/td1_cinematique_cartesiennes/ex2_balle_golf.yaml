id: td1_ex2
intitule: "Balle de golf (mouvement de projectile)"
td: td1
facultatif: false
seance: 1

cours_rattache:
  - cinematique.vecteur_position
  - cinematique.vecteur_vitesse
  - cinematique.vecteur_acceleration
  - cinematique.mouvement_projectile

metadonnees:
  duree_estimee: "35 min"
  difficulte: 3
  priorite: 2
  type_exercice: "Application"
  indispensable: true

enonce_intro: |
  On se place dans le référentiel terrestre, supposé galiléen, d'intensité de pesanteur $g=9{,}81$ S.I.,
  muni d'un repère cartésien $Oxz$ (le mouvement se faisant dans le plan vertical, $y(t)=0$ à tout instant).
  Les équations horaires d'une balle de golf lancée à $t=0$ avec la vitesse initiale $\vec v_0$ faisant un
  angle $\alpha$ avec l'horizontale sont :
  $$x(t) = v_0\cos(\alpha)\,t, \qquad y(t)=0, \qquad z(t) = -\frac{1}{2}g\,t^2 + v_0\sin(\alpha)\,t.$$

prerequis:
  - titre: "Mouvement de chute libre avec vitesse initiale"
    texte: |
      Un projectile soumis uniquement à la pesanteur (on néglige les frottements de l'air) subit une accélération constante $\vec a = -g\,\vec u_z$. Ses équations horaires s'obtiennent par double intégration de $\vec a$, en tenant compte des conditions initiales de position et de vitesse. C'est l'exercice précédent (TD1, ex.1), avec ici une vitesse initiale non nulle et inclinée.

objectifs_pedagogiques_etudiants:
  - titre: "Étudier complètement un mouvement de projectile"
    texte: |
      Savoir déterminer l'équation de trajectoire, la portée et la flèche d'un tir, discuter l'angle optimal, et transposer un résultat d'un champ de pesanteur à un autre (application lunaire).

objectifs_pedagogiques_enseignants:
  - titre: "Exercice de synthèse sur le tir parabolique"
    texte: |
      Cet exercice classique permet de mobiliser simultanément le calcul vectoriel (vitesse, accélération), l'algèbre (résolution de $z(t)=0$), et un raisonnement physique de mise à l'échelle (question (g), transposition Terre/Lune) sans necessiter de refaire tout le calcul depuis le début — il s'agit de repérer que $d$ est proportionnel à $1/g$ à $v_0,\alpha$ fixés.

point_cours:
  - titre: "Portée et flèche d'un tir parabolique"
    texte: |
      Pour un tir sans frottement lancé depuis le sol ($z(0)=0$) avec une vitesse $v_0$ à l'angle $\alpha$ dans un champ de pesanteur uniforme $g$, on retiendra les résultats génériques :
      $$h_{max} = \frac{v_0^2\sin^2\alpha}{2g} \quad(\text{flèche}), \qquad d = \frac{v_0^2\sin(2\alpha)}{g} \quad(\text{portée}).$$
      Ces deux grandeurs sont proportionnelles à $1/g$ à $v_0$ et $\alpha$ fixés : un même tir va environ 6 fois plus loin sur la Lune que sur Terre.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Oublier que $y(t)=0$"
    texte: |
      Certains étudiants cherchent à tort une trajectoire en 3D alors que l'énoncé précise $y(t)=0$ : le mouvement est plan, contenu dans le plan vertical $Oxz$ défini par $\vec v_0$.
  - titre: "Chercher $\\alpha$ optimal en dérivant $h$ au lieu de $d$"
    texte: |
      Bien relire la question : c'est la portée $d(\alpha)$ qu'il faut maximiser en question (e), pas la flèche $h(\alpha)$ (qui, elle, est maximale pour $\alpha=90°$, tir vertical, portée nulle).

remarques_pedagogiques_conseils_animation:
  - titre: "Lien avec le sport"
    texte: |
      On peut demander aux étudiants d'estimer l'angle de frappe réel d'un practice de golf (typiquement 10-15° pour un driver, car il y a portance et rotation du fluide non modélisées ici) et de discuter pourquoi le modèle simple du tir parabolique ne prédit pas exactement les performances réelles (effet Magnus, résistance de l'air).

bilan:
  - titre: "Le tir parabolique, un mouvement à accélération constante"
    texte: |
      Ce mouvement illustre le cas générique d'une accélération constante non colinéaire à la vitesse initiale : la trajectoire est une parabole, la composante de vitesse parallèle à $\vec a$ varie linéairement (ici $v_z$), tandis que la composante perpendiculaire à $\vec a$ reste constante (ici $v_x$). La portée dépend de $v_0^2$, de $\sin(2\alpha)$ et de $1/g$ : ce dernier point explique directement la question de la transposition sur la Lune.

aller_plus_loin:
  - niveau: licence
    titre: "Tir avec frottement quadratique"
    texte: |
      En présence d'une résistance de l'air en $-k v^2\vec u_v$ (régime turbulent, plus réaliste pour une balle de golf), les équations du mouvement se couplent et n'ont plus de solution analytique simple ; on peut alors discuter qualitativement (ou numériquement) l'asymétrie de la trajectoire réelle par rapport à la parabole symétrique du modèle sans frottement, la balle réelle retombant plus abruptement qu'elle n'est montée.

accroche_point_cours_essentiel:
  - titre: "Pourquoi frappe-t-on une balle de golf à 45° (ou pas) ?"
    duree_introduction: "5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Sur la Lune, en 1971, un astronaute a frappé une balle de golf. Sans refaire aucun calcul de trajectoire, saurez-vous dire {\bf combien de fois plus loin} elle ira que sur Terre ? Et pourquoi existe-t-il {\bf deux angles} de tir pour atteindre le même trou ?
    texte: |
      {\bf Idée clé : accélération constante non colinéaire à la vitesse initiale.} Avec $\vec a=-g\,\vec u_z$ constante, on intègre deux fois en tenant compte des {\bf conditions initiales} :
      $$\vec v(t)=\int_0^t \vec a\,\mathrm dt'+\vec v_0,\qquad \overrightarrow{OM}(t)=\int_0^t \vec v\,\mathrm dt'+\overrightarrow{OM}_0 .$$
      Conséquences : la composante {\bf perpendiculaire} à $\vec a$ ($v_x$) est constante ; la composante {\bf parallèle} à $\vec a$ ($v_z$) varie linéairement ; la trajectoire est une parabole. Les deux grandeurs utiles du tir (flèche et portée) sont {\bf proportionnelles à $1/g$} : c'est ce qui permet de répondre à la question lunaire sans calcul.

outils_mathematiques:
  - titre: "Formule de duplication : $\\sin(2x)=2\\sin x\\cos x$"
    texte: |
      Elle transforme le produit $v_0^2\sin\alpha\cos\alpha/g$ en $\dfrac{v_0^2\sin(2\alpha)}{g}$ et rend la portée maximale visible d'un coup d'œil : $\sin(2\alpha)\le1$, avec égalité pour $2\alpha=\pi/2$, soit $\alpha=45^\circ$.
  - titre: "Symétries du sinus : $\\sin(\\pi-x)=\\sin x$ et $\\sin(\\pi/2-x)=\\cos x$"
    texte: |
      Pour $\alpha'=\pi/2-\alpha$ : $\sin(2\alpha')=\sin(\pi-2\alpha)=\sin(2\alpha)$. {\bf Deux angles complémentaires donnent la même portée} : tir tendu et tir en cloche. Sur le cercle trigonométrique, $x$ et $\pi-x$ ont le même sinus (symétrie par rapport à l'axe vertical).
  - titre: "Relations entre $\\sin$, $\\cos$, $\\tan$"
    texte: |
      $\tan\alpha=\dfrac{\sin\alpha}{\cos\alpha}$ et $\dfrac1{\cos^2\alpha}=1+\tan^2\alpha$. On peut donc écrire la trajectoire sous la forme $z=x\tan\alpha-\dfrac{g\,(1+\tan^2\alpha)}{2v_0^2}\,x^2$, pratique pour chercher les angles qui atteignent un point donné (équation du second degré en $\tan\alpha$).
  - titre: "L'intégrale comme opération inverse de la dérivation"
    texte: |
      Définition : $\displaystyle\int_0^t f(t')\,\mathrm dt'=F(t)-F(0)$ où $F'=f$ ; géométriquement, c'est l'{\bf aire algébrique sous la courbe} de $f$. Ici : l'aire sous la courbe $a(t)=-g$ donne $v_z(t)-v_z(0)=-gt$, puis l'aire sous $v_z(t)$ donne $z(t)$. La {\bf constante d'intégration} est fixée par la condition initiale.
  - titre: "Factorisation et racines d'un polynôme"
    texte: |
      $z(t)=t\left(v_0\sin\alpha-\tfrac12 gt\right)=0$ : un produit est nul si un de ses facteurs l'est, d'où les deux instants $t=0$ (lancer) et $t_d=2v_0\sin\alpha/g$ (retombée).

liens_autres_disciplines:
  - discipline: "Mathématiques"
    texte: |
      Trigonométrie (symétries du cercle), primitives et conditions initiales, optimisation d'une fonction ($d(\alpha)$ maximale).
  - discipline: "Astronomie / planétologie"
    texte: |
      Changer de planète revient à changer $g$ : $g_{\rm Lune}\approx g_{\rm Terre}/6$, d'où un tir environ 6 fois plus long à conditions de lancement identiques.
  - discipline: "Électricité"
    texte: |
      Un ion ou un électron dans un champ électrique uniforme suit la même parabole, avec $g$ remplacé par $qE/m$.
  - discipline: "Sport et ingénierie"
    texte: |
      Lancer du poids, jet d'eau d'une fontaine, tir au basket : on retrouve les deux angles complémentaires. Pour un lancer réel, la résistance de l'air déforme la parabole (voir « aller plus loin »).

questions:
  - id: q1
    enonce: |
      \begin{itemize}
        \item[(a)] Déterminer l'équation de la trajectoire de la balle et la représenter sur un graphique.
        \item[(b)] Déterminer l'expression du vecteur vitesse $\vec v$ de la balle. Représenter $\vec v_0$ et l'angle $\alpha$ sur le graphique.
        \item[(c)] Comment évolue la vitesse suivant $Ox$ ? suivant $Oz$ ?
      \end{itemize}
    coup_de_pouce: |
      Isolez $t$ dans $x(t)$ et reportez dans $z(t)$, comme dans l'exercice précédent.
    correction: "$z(x) = x\\tan\\alpha - \\dfrac{g}{2v_0^2\\cos^2\\alpha}x^2$ : parabole. $v_x$ constant, $v_z$ affine décroissante (change de signe au sommet)."
    solution:
      - titre: "(a) Équation de la trajectoire"
        texte: |
          De $x(t) = v_0\cos\alpha\, t$, on tire $t = x/(v_0\cos\alpha)$. En reportant dans $z(t)$ :
          $$z(x) = -\frac{1}{2}g\left(\frac{x}{v_0\cos\alpha}\right)^2 + v_0\sin\alpha \cdot \frac{x}{v_0\cos\alpha} = \boxed{x\tan\alpha - \frac{g}{2v_0^2\cos^2\alpha}\,x^2}.$$
          C'est une {\bf parabole}, passant par l'origine, tournée vers le bas (coefficient de $x^2$ négatif), de tangente à l'origine de pente $\tan\alpha$ (conforme au fait que la balle part avec un angle $\alpha$).
      - titre: "(b) Vecteur vitesse"
        texte: |
          En dérivant chaque coordonnée :
          $$\boxed{\vec v(t) = v_0\cos\alpha\,\vec u_x + (v_0\sin\alpha - g\,t)\,\vec u_z}.$$
          À $t=0$ : $\vec v(0) = v_0\cos\alpha\,\vec u_x + v_0\sin\alpha\,\vec u_z = v_0(\cos\alpha\,\vec u_x + \sin\alpha\,\vec u_z)$, vecteur de norme $v_0$ faisant l'angle $\alpha$ avec $Ox$ — on le représente tangent à la trajectoire à l'origine.
      - titre: "(c) Évolution des composantes de la vitesse"
        texte: |
          $v_x(t) = v_0\cos\alpha$ est {\bf constante} : le mouvement est uniforme suivant $Ox$ (aucune force horizontale).

          $v_z(t) = v_0\sin\alpha - gt$ est {\bf affine décroissante} : le mouvement est uniformément décéléré tant que $v_z>0$ (montée), s'annule au sommet de la trajectoire (flèche), puis devient négatif (la balle redescend, accélérée vers le bas).

  - id: q2
    enonce: |
      \begin{itemize}
        \item[(d)] Donner l'expression de l'altitude maximale $h$ atteinte par la balle (la flèche) et de la portée horizontale $d$ du tir.
        \item[(e)] Pour quelle valeur de $\alpha$ la portée est-elle maximale ?
        \item[(f)] Montrer qu'une même portée peut être atteinte pour deux valeurs différentes de $\alpha$.
      \end{itemize}
    coup_de_pouce: |
      La flèche est atteinte quand $v_z=0$ ; la portée correspond au second instant où $z=0$ (l'autre que $t=0$).
    correction: "$h=\\dfrac{v_0^2\\sin^2\\alpha}{2g}$, $d=\\dfrac{v_0^2\\sin(2\\alpha)}{g}$ ; portée max pour $\\alpha=45°$ ; $d(\\alpha)=d(90°-\\alpha)$."
    solution:
      - titre: "(d) Flèche"
        texte: |
          La flèche est atteinte à l'instant $t^\star$ tel que $v_z(t^\star)=0$, soit $t^\star = v_0\sin\alpha/g$. En reportant dans $z(t)$ :
          $$h = z(t^\star) = -\frac{1}{2}g\left(\frac{v_0\sin\alpha}{g}\right)^2 + v_0\sin\alpha\cdot\frac{v_0\sin\alpha}{g} = \boxed{\frac{v_0^2\sin^2\alpha}{2g}}.$$
      - titre: "(d) Portée"
        texte: |
          La portée correspond à l'instant $t_d\neq 0$ tel que $z(t_d)=0$ :
          $$z(t)=t\left(v_0\sin\alpha - \frac{1}{2}gt\right)=0 \quad\Longrightarrow\quad t_d = \frac{2v_0\sin\alpha}{g}.$$
          D'où :
          $$d = x(t_d) = v_0\cos\alpha \cdot \frac{2v_0\sin\alpha}{g} = \boxed{\frac{v_0^2\sin(2\alpha)}{g}} \qquad (\text{en utilisant } 2\sin\alpha\cos\alpha=\sin(2\alpha)).$$
      - titre: "(e) Angle de portée maximale"
        texte: |
          À $v_0$ fixé, $d(\alpha)$ est maximale quand $\sin(2\alpha)=1$, c'est-à-dire $2\alpha = 90°$, soit :
          $$\boxed{\alpha = 45°}.$$
      - titre: "(f) Deux angles pour une même portée"
        texte: |
          On utilise l'identité $\sin(180°-2\alpha) = \sin(2\alpha)$. Ainsi, pour un angle $\alpha' = 90°-\alpha$, on a $\sin(2\alpha') = \sin(180°-2\alpha)=\sin(2\alpha)$, donc :
          $$d(\alpha') = \frac{v_0^2\sin(2\alpha')}{g} = \frac{v_0^2\sin(2\alpha)}{g} = d(\alpha).$$
          Les angles $\alpha$ et $90°-\alpha$ (complémentaires) donnent donc la même portée — l'un correspondant à un tir tendu (angle faible), l'autre à un tir plus haut (angle proche de la verticale), à la même vitesse initiale $v_0$.

  - id: q3
    enonce: |
      \begin{itemize}
        \item[(g)] Une balle de golf tapée avec une vitesse oblique retombe à une distance $d_T=340$ m du joueur, sur Terre. À quelle distance $d_L$ du joueur retomberait une balle tapée dans les mêmes conditions de lancement, mais sur la Lune, où $g_L=1{,}6$ m/s² ?
      \end{itemize}
    coup_de_pouce: |
      "Mêmes conditions de lancement" signifie même $v_0$ et même $\alpha$. Utilisez l'expression de la portée $d=v_0^2\sin(2\alpha)/g$ pour comparer directement les deux situations sans recalculer $v_0$ ni $\alpha$.
    correction: "$d_L = d_T\\,g_T/g_L \\approx 2{,}08$ km."
    solution:
      - titre: "Mise à l'échelle par le rapport des $g$"
        texte: |
          D'après la formule générale établie en (d), $d = v_0^2\sin(2\alpha)/g$. Comme $v_0$ et $\alpha$ sont {\bf identiques} dans les deux situations (mêmes conditions de lancement), le produit $v_0^2\sin(2\alpha)$ est le même sur Terre et sur la Lune. On peut donc écrire, sans connaître ni $v_0$ ni $\alpha$ individuellement :
          $$d_T\,g_T = v_0^2\sin(2\alpha) = d_L\,g_L \quad\Longrightarrow\quad d_L = d_T\,\frac{g_T}{g_L}.$$
      - titre: "Application numérique"
        texte: |
          $$d_L = 340 \times \frac{9{,}81}{1{,}6} \approx 340 \times 6{,}13 \approx \boxed{2085~\text{m} \approx 2{,}08~\text{km}}.$$
          La balle irait donc presque 6,1 fois plus loin sur la Lune que sur Terre — un ordre de grandeur cohérent avec les images des astronautes d'Apollo 14 frappant des balles de golf sur la Lune. (En pratique, l'absence d'atmosphère lunaire supprime aussi les frottements de l'air, ce qui augmenterait encore un peu plus la portée réelle par rapport à ce facteur purement gravitationnel.)