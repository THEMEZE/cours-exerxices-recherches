id: td1_ex7
intitule: "Parabole de sûreté et tir sur une pente"
td: td1
facultatif: true
seance: 1

cours_rattache:
  - cinematique.mouvement_projectile
  - cinematique.equation_de_trajectoire
  - cinematique.coordonnees_cartesiennes

metadonnees:
  duree_estimee: "50 min"
  difficulte: 4
  priorite: 2
  type_exercice: "Approfondissement / Exercice non guidé"
  indispensable: false

enonce_intro: |
  Un pompier dispose d'une lance dont le jet sort, au niveau du sol, avec une vitesse de norme fixée $v_0=20~\mathrm{m\,s^{-1}}$ ; il peut
  seulement choisir l'angle de tir $\alpha$ du jet avec l'horizontale. On néglige les frottements de l'air et on assimile une particule d'eau à un point matériel en chute libre dans le champ de pesanteur $g=9{,}81~\mathrm{m\,s^{-2}}$.
  On choisit un repère $Oxz$ (le mouvement est plan), l'origine $O$ à la sortie de la lance, $Oz$ vertical ascendant. Les équations horaires sont celles de l'exercice « balle de golf » :
  $$x(t)=v_0\cos\alpha\;t,\qquad z(t)=-\tfrac12\,g\,t^2+v_0\sin\alpha\;t,$$
  d'où l'équation de la trajectoire
  $$z(x)=x\tan\alpha-\frac{g\,x^2}{2v_0^2}\,\big(1+\tan^2\alpha\big).$$
  Dans tout l'exercice, $v_0$ est fixé et {\bf c'est $\alpha$ qui est l'inconnue}.

prerequis:
  - titre: "Équation de trajectoire d'un projectile"
    texte: |
      En éliminant le temps entre $x(t)$ et $z(t)$ et en utilisant $\dfrac1{\cos^2\alpha}=1+\tan^2\alpha$, on obtient
      $$z(x)=x\tan\alpha-\frac{g\,x^2}{2v_0^2}\,(1+\tan^2\alpha).$$
      Pour un point $(x,z)$ fixé, cette relation est une équation {\bf d'inconnue $\tan\alpha$}.
  - titre: "Équation du second degré et signe du discriminant"
    texte: |
      $A u^2+B u+C=0$ avec $A\ne0$ a deux solutions réelles si $\Delta=B^2-4AC>0$, une solution double si $\Delta=0$, aucune si $\Delta<0$.

objectifs_pedagogiques_etudiants:
  - titre: "Changer de point de vue : de la trajectoire à l'ensemble des points atteignables"
    texte: |
      Savoir retourner l'équation de trajectoire pour en faire une équation en $\tan\alpha$, interpréter son discriminant comme une {\bf condition d'atteignabilité}, identifier la {\bf parabole de sûreté} comme frontière de la zone accessible, et transposer la méthode au tir sur une pente.

objectifs_pedagogiques_enseignants:
  - titre: "Un exercice de modélisation inversée"
    texte: |
      Dans la plupart des exercices de projectile on fixe $\alpha$ et on cherche la trajectoire. Ici on {\bf fixe le point d'arrivée} et on cherche les angles : le changement d'inconnue ($\tan\alpha$) transforme le problème en équation du second degré, dont le discriminant porte l'information physique (« peut-on atteindre ce point ? »). Le passage à la frontière $\Delta=0$ donne la parabole de sûreté, concept classique (Torricelli, XVII\textsuperscript{e} siècle). Le tir sur une pente (question g) montre que les formules du cours ne se « recollent » pas par cœur mais se redémontrent avec la même méthode. L'exercice est long : prévoir de scinder en deux séances, ou de réserver la partie pente aux plus avancés.

point_cours:
  - titre: "Résultats génériques à connaître"
    texte: |
      Pour une vitesse initiale $v_0$ fixée depuis le sol : portée maximale $\dfrac{v_0^2}{g}$ (pour $\alpha=45^\circ$), hauteur maximale $\dfrac{v_0^2}{2g}$ (pour $\alpha=90^\circ$). L'ensemble des points atteignables est la région du plan délimitée par la {\bf parabole de sûreté}
      $$z_s(x)=\frac{v_0^2}{2g}-\frac{g\,x^2}{2v_0^2}.$$
      À l'extérieur de cette parabole, aucun tir (quel que soit $\alpha$) n'atteint le point ; à l'intérieur, il existe deux angles ; sur la parabole, un seul.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Chercher $\\alpha$ au lieu de $\\tan\\alpha$"
    texte: |
      Écrire l'équation en $\alpha$ conduit à un mélange de $\sin$ et de $\cos$ non soluble simplement. Le bon réflexe est de poser $u=\tan\alpha$ pour obtenir un polynôme. Il faut ensuite penser à repasser aux angles par $\alpha=\arctan u$ (en radians ou degrés, selon la calculatrice).
  - titre: "Ne garder qu'une solution"
    texte: |
      Les deux racines sont {\bf physiques} (tir tendu et tir en cloche). Il ne faut pas rejeter l'une des deux sans raison : on discute ensuite laquelle choisir (durée de vol, angle d'arrivée).
  - titre: "Confondre trajectoire et parabole de sûreté"
    texte: |
      La parabole de sûreté n'est {\bf pas} une trajectoire (elle est $\alpha$-indépendante). Ce n'est pas une courbe parcourue par une particule, mais une frontière sur laquelle chaque trajectoire pour un angle donné est tangente en un point.
  - titre: "Sur la pente : confondre $x$ et la distance $d$ le long de la pente"
    texte: |
      Le point d'arrivée est à la distance $d$ le long de la pente : ses coordonnées sont $(d\cos\beta,\;d\sin\beta)$, pas $(d,0)$. Beaucoup d'erreurs viennent d'un oubli de projection.

remarques_pedagogiques_conseils_animation:
  - titre: "Visualiser avec Python"
    texte: |
      Faire tracer, pour $\alpha$ de $10^\circ$ à $80^\circ$ par pas de $10^\circ$, les trajectoires, puis superposer la parabole $z_s(x)$. L'enveloppe apparaît visuellement. Demander de repérer les deux trajectoires qui passent par la fenêtre.
  - titre: "Défi : le point le plus lointain sur la pente"
    texte: |
      Avant le calcul, demander aux étudiants d'estimer l'angle de tir optimal sur une montée de $30^\circ$. Une majorité répond $45^\circ$ ; le calcul donne $60^\circ$ (bissectrice de la pente et de la verticale), ce qui crée un déclic.

bilan:
  - titre: "Deux angles, une frontière, une bissectrice"
    texte: |
      Pour atteindre un point $(x,z)$ avec $v_0$ fixé, $\tan\alpha$ vérifie $\dfrac{g x^2}{2v_0^2}u^2-x\,u+z+\dfrac{g x^2}{2v_0^2}=0$. Le point est atteignable si et seulement si $z\le z_s(x)=\dfrac{v_0^2}{2g}-\dfrac{g x^2}{2v_0^2}$, avec deux angles si l'inégalité est stricte. Sur une pente d'angle $\beta$, la portée est maximale pour $\alpha^\star=\dfrac\pi4+\dfrac\beta2$ (bissectrice entre la pente et la verticale) et vaut $d_{\max}=\dfrac{v_0^2}{g\,(1+\sin\beta)}$ (montée), $\dfrac{v_0^2}{g\,(1-\sin\beta)}$ (descente).

aller_plus_loin:
  - niveau: cpge
    titre: "Le singe et le chasseur"
    texte: |
      Un chasseur vise directement un singe pendu à une branche, à la hauteur $H$ et à la distance horizontale $L$. Au moment précis où le coup part, le singe se lâche. Montrer que la balle (vitesse initiale $v_0$ dirigée vers la position initiale du singe) l'atteint toujours, à condition que le temps de vol soit suffisamment court pour qu'il n'ait pas touché le sol. Indication : écrire $\overrightarrow{OM_{\rm balle}}-\overrightarrow{OM_{\rm singe}}$ ; la gravité s'annule dans la différence (principe d'équivalence en miniature).
  - niveau: licence
    titre: "Enveloppe d'une famille de courbes"
    texte: |
      La famille de trajectoires $F(x,z,u)=z-xu+\dfrac{gx^2}{2v_0^2}(1+u^2)=0$ dépend du paramètre $u=\tan\alpha$. Son enveloppe est obtenue en éliminant $u$ entre $F=0$ et $\partial F/\partial u=0$. Retrouver ainsi $z_s(x)$ et vérifier que l'on obtient bien la condition $\Delta=0$ de la question (d). Même méthode pour l'enveloppe d'une famille de droites (caustique de la lumière).
  - niveau: master
    titre: "Frottement quadratique : l'angle optimal diminue"
    texte: |
      Avec une résistance de l'air en $-kv\,\vec v$, l'angle de portée maximale devient strictement inférieur à $45^\circ$ et la trajectoire est asymétrique. Étudier numériquement (Runge--Kutta) $\alpha^\star(k)$ et tracer la nouvelle enveloppe : elle n'est plus une parabole. Comparer à un tir de balle de golf réel (angle de $10$--$15^\circ$ pour un driver, avec effet Magnus).
  - niveau: doctorat
    titre: "Ellipse de sûreté en gravitation de Kepler"
    texte: |
      Pour un lancement depuis un point $P$ d'un champ central (missile balistique), l'enveloppe des trajectoires képlériennes de {\bf même énergie} est une ellipse dont les foyers sont le centre attracteur et le point $P$. Retrouver la parabole de sûreté comme limite $r\to\infty$ de cette ellipse (champ uniforme).

accroche_point_cours_essentiel:
  - titre: "Peut-on atteindre cette fenêtre ? Avec quel angle ? Et où est la limite ?"
    duree_introduction: "5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Un pompier tient une lance dont le jet sort toujours à 20 m/s. Une fenêtre est à 25 m de distance horizontale et à 10 m de hauteur. {\bf Combien d'angles de tir} permettent de l'atteindre ? Et si la fenêtre était à 14 m de hauteur ? Existe-t-il une courbe au-delà de laquelle {\bf aucun} angle ne convient ?
    texte: |
      {\bf Idée clé : retourner le problème.} On connaît le point cible et on cherche l'angle. L'équation de trajectoire est un polynôme du second degré en $u=\tan\alpha$ :
      $$\frac{g x^2}{2v_0^2}\,u^2-x\,u+\Big(z+\frac{g x^2}{2v_0^2}\Big)=0 .$$
      Le {\bf signe du discriminant} dit combien d'angles conviennent (0, 1 ou 2) ; la {\bf frontière} $\Delta=0$ est la parabole de sûreté.

outils_mathematiques:
  - titre: "Changement d'inconnue $u=\\tan\\alpha$"
    texte: |
      Identité $\dfrac1{\cos^2\alpha}=1+\tan^2\alpha$ : elle élimine $\cos\alpha$ au profit de $\tan\alpha$, seule inconnue. On revient à l'angle par $\alpha=\arctan(u)$ (valable pour $\alpha\in]-\pi/2,\pi/2[$, ce qui couvre tous les tirs vers l'avant).
  - titre: "Discriminant d'un trinôme"
    texte: |
      $Au^2+Bu+C$ avec $A>0$ : $\Delta=B^2-4AC$. Ici $\Delta=x^2-4\dfrac{gx^2}{2v_0^2}\Big(z+\dfrac{gx^2}{2v_0^2}\Big)$. Le signe de $\Delta$ se lit directement sur $z$ : $\Delta\ge0\iff z\le z_s(x)$.
  - titre: "Sinus d'une différence et linéarisation"
    texte: |
      $\sin(a-b)=\sin a\cos b-\cos a\sin b$ et $2\cos a\sin b=\sin(a+b)-\sin(a-b)$. Pour la pente : $2\cos\alpha\sin(\alpha-\beta)=\sin(2\alpha-\beta)-\sin\beta$, dont le maximum est atteint quand $2\alpha-\beta=\pi/2$.
  - titre: "Pente d'une courbe et tangence"
    texte: |
      Deux courbes sont tangentes en un point si elles se coupent et ont la même dérivée $\mathrm dz/\mathrm dx$ en ce point. Pour la trajectoire : $\dfrac{\mathrm dz}{\mathrm dx}=\tan\alpha-\dfrac{g x}{v_0^2}(1+\tan^2\alpha)$.
  - titre: "Bissectrice de deux directions"
    texte: |
      La bissectrice de deux directions faisant les angles $\theta_1$ et $\theta_2$ avec l'horizontale a pour angle $\dfrac{\theta_1+\theta_2}2$. Pour la pente et la verticale : $\dfrac{\beta+\pi/2}2=\dfrac\pi4+\dfrac\beta2$.

liens_autres_disciplines:
  - discipline: "Mathématiques"
    texte: |
      Enveloppe d'une famille de courbes, tangence, discriminant, optimisation par factorisation trigonométrique.
  - discipline: "Sécurité incendie et génie civil"
    texte: |
      Portée d'une lance à incendie, positionnement du camion par rapport à un bâtiment, tirs « tendu » et « en cloche » selon que l'on veut passer sous un obstacle ou atteindre un étage élevé.
  - discipline: "Sport"
    texte: |
      Golf en montée ou en descente : le joueur ajuste la loft (angle) pour compenser la pente. Lancer de javelot et de poids : angle optimal $<45^\circ$ car le point de lâcher est en hauteur.
  - discipline: "Histoire des sciences"
    texte: |
      La parabole de sûreté a été décrite par Torricelli au XVII\textsuperscript{e} siècle pour l'artillerie : elle délimite la zone qu'un canon de vitesse donnée peut atteindre.
  - discipline: "Astronomie"
    texte: |
      En gravitation képlérienne, la zone atteignable d'un missile ou d'une sonde est délimitée par une ellipse de sûreté.

questions:
  - id: q1
    enonce: |
      \begin{itemize}
        \item[(a)] Montrer que, pour atteindre le point $(x,z)$, l'angle de tir doit vérifier une équation du second degré dont l'inconnue est $u=\tan\alpha$.
        \item[(b)] À quelle condition sur $z$ (à $x$ fixé) cette équation a-t-elle des solutions réelles ? En déduire l'expression de la parabole de sûreté $z_s(x)$.
        \item[(c)] Une fenêtre est située à $x=25$ m et $z=10$ m. Peut-on l'atteindre ? Calculer les angles de tir possibles et les durées de vol correspondantes. Comparer les vitesses d'arrivée.
      \end{itemize}
    coup_de_pouce: |
      Pour (a), partez de $z=x\tan\alpha-\dfrac{g x^2}{2v_0^2}(1+\tan^2\alpha)$ et regroupez les termes en puissances de $u$. Pour (b), calculez $\Delta=B^2-4AC$ et résolvez $\Delta\ge0$ en $z$. Pour la vitesse d'arrivée, pensez à la conservation de l'énergie mécanique.
    correction: |
      $\dfrac{gx^2}{2v_0^2}u^2-xu+z+\dfrac{gx^2}{2v_0^2}=0$ ; atteignable ssi $z\le z_s(x)=\dfrac{v_0^2}{2g}-\dfrac{g x^2}{2v_0^2}$. Fenêtre : $z_s(25)\approx12{,}7$ m $>10$ m donc atteignable ; $\alpha_1\approx46{,}0^\circ$ ($t\approx1{,}80$ s) et $\alpha_2\approx65{,}8^\circ$ ($t\approx3{,}05$ s) ; même norme de vitesse d'arrivée $\approx14{,}3~\mathrm{m/s}$.
    solution:
      - titre: "(a) Équation du second degré en $\\tan\\alpha$"
        texte: |
          On pose $k=\dfrac{g x^2}{2v_0^2}$ et $u=\tan\alpha$. Le point $(x,z)$ est atteint si
          $$z=x\,u-k\,(1+u^2)\iff\boxed{k\,u^2-x\,u+(z+k)=0}.$$
          C'est un trinôme en $u$ de coefficients $A=k$, $B=-x$, $C=z+k$.
      - titre: "(b) Condition d'existence et parabole de sûreté"
        texte: |
          Le discriminant vaut $\Delta=x^2-4k\,(z+k)$. Il est positif ou nul si
          $$z\le\frac{x^2}{4k}-k=\frac{v_0^2}{2g}-\frac{g\,x^2}{2v_0^2}.$$
          (On a utilisé $\dfrac{x^2}{4k}=\dfrac{x^2\cdot2v_0^2}{4g\,x^2}=\dfrac{v_0^2}{2g}$.) La frontière est donc
          $$\boxed{z_s(x)=\frac{v_0^2}{2g}-\frac{g\,x^2}{2v_0^2}}$$
          C'est la {\bf parabole de sûreté} : un point est atteignable si et seulement s'il est sur ou sous cette courbe. À l'intérieur, $\Delta>0$ et il y a deux angles ; sur la parabole, $\Delta=0$ et il y en a un seul.
      - titre: "(c) Application à la fenêtre"
        texte: |
          Avec $v_0=20~\mathrm{m/s}$ : $\dfrac{v_0^2}{2g}\approx20{,}39$ m et $k=\dfrac{9{,}81\times625}{2\times400}\approx7{,}664$ m. D'où $z_s(25)\approx20{,}39-7{,}66\approx12{,}7$ m. Comme $z=10$ m $<12{,}7$ m, la fenêtre est atteignable.

          L'équation est $7{,}664\,u^2-25\,u+17{,}664=0$, avec $\Delta\approx83{,}5$ :
          $$u=\frac{25\pm9{,}14}{15{,}33}\Rightarrow u_1\approx1{,}035,\;u_2\approx2{,}227,$$
          soit $\boxed{\alpha_1\approx46{,}0^\circ\ \text{(tir tendu)},\quad\alpha_2\approx65{,}8^\circ\ \text{(tir en cloche)}}$.

          Durées de vol : $t=\dfrac{x}{v_0\cos\alpha}$, d'où $t_1\approx1{,}80$ s et $t_2\approx3{,}05$ s : le tir tendu est plus rapide.

          Vitesses d'arrivée : l'énergie mécanique étant conservée et les deux tirs partant de la même altitude à la même vitesse, la norme de la vitesse à l'altitude $z$ vérifie $v^2=v_0^2-2gz$ pour les deux angles, soit $v\approx\sqrt{400-196{,}2}\approx14{,}3~\mathrm{m/s}$. Seule la {\bf direction} d'arrivée diffère (jet plus plongeant pour le tir en cloche).

  - id: q2
    enonce: |
      \begin{itemize}
        \item[(d)] Déterminer les points d'intersection de la parabole de sûreté avec le sol et avec l'axe $Oz$, et leur signification physique.
        \item[(e)] Pour un point $P(x,z_s(x))$ de la parabole de sûreté, déterminer l'unique angle de tir. Vérifier que la trajectoire correspondante est {\bf tangente} à la parabole de sûreté en $P$.
      \end{itemize}
    coup_de_pouce: |
      Pour (e), à $\Delta=0$ la racine double est $u=-B/(2A)$. Pour la tangence, comparez la pente $\mathrm dz/\mathrm dx$ de la trajectoire en $P$ avec celle de $z_s$.
    correction: |
      $z_s(0)=\dfrac{v_0^2}{2g}$ (hauteur maximale, tir vertical) ; $z_s(x)=0$ en $x=\dfrac{v_0^2}{g}$ (portée maximale, $\alpha=45^\circ$). Sur la parabole : $\tan\alpha=\dfrac{v_0^2}{g\,x}$. Les deux courbes ont la même pente $-\dfrac{g x}{v_0^2}$ en $P$.
    solution:
      - titre: "(d) Intersections avec les axes"
        texte: |
          En $x=0$ : $z_s(0)=\dfrac{v_0^2}{2g}\approx20{,}4$ m : c'est la hauteur maximale atteignable, par un tir vertical.

          En $z_s(x)=0$ : $x^2=\dfrac{v_0^4}{g^2}$, soit $x=\dfrac{v_0^2}{g}\approx40{,}8$ m : c'est la portée maximale, obtenue pour $\alpha=45^\circ$ (cohérent avec l'exercice « balle de golf »).
      - titre: "(e) Angle sur la frontière et tangence"
        texte: |
          Sur la parabole, $\Delta=0$ et la racine double vaut
          $$u=-\frac{B}{2A}=\frac{x}{2k}=\frac{x\cdot2v_0^2}{2g\,x^2}=\boxed{\frac{v_0^2}{g\,x}}.$$
          Pente de la trajectoire en $x$ : $\dfrac{\mathrm dz}{\mathrm dx}=u-\dfrac{g x}{v_0^2}(1+u^2)$. Avec $u=\dfrac{v_0^2}{g x}$ :
          $$\frac{g x}{v_0^2}\,u^2=\frac{v_0^2}{g x},\qquad\text{donc}\qquad\frac{\mathrm dz}{\mathrm dx}=\frac{v_0^2}{g x}-\frac{g x}{v_0^2}-\frac{v_0^2}{g x}=-\frac{g x}{v_0^2}.$$
          Pente de la parabole de sûreté : $z_s'(x)=-\dfrac{g x}{v_0^2}$. Les pentes sont égales et les courbes ont le point $P$ en commun : elles sont {\bf tangentes}. Chaque trajectoire touche la parabole en un point, qui est son point le plus « avancé » dans la zone atteignable.

  - id: q3
    enonce: |
      Le jet est maintenant dirigé vers un talus plan, montant, faisant l'angle $\beta=30^\circ$ avec l'horizontale (le plan du talus contient l'axe $Ox$ et la direction de plus grande pente). On note $d$ la distance, mesurée le long du talus, entre $O$ et le point d'impact.
      \begin{itemize}
        \item[(f)] Exprimer $d$ en fonction de $v_0$, $g$, $\alpha$ et $\beta$.
        \item[(g)] Déterminer l'angle $\alpha^\star$ qui maximise $d$ et la portée maximale $d_{\max}$ ; application numérique. Que devient le résultat sur un talus {\bf descendant} de même angle ?
        \item[(h)] Retrouver $d_{\max}$ en utilisant la parabole de sûreté, et interpréter géométriquement $\alpha^\star$.
      \end{itemize}
    coup_de_pouce: |
      Le point d'impact est sur le talus : $(x,z)=(d\cos\beta,\,d\sin\beta)$. Reportez dans l'équation de trajectoire et simplifiez par $d\ne0$. Utilisez ensuite $2\cos\alpha\sin(\alpha-\beta)=\sin(2\alpha-\beta)-\sin\beta$. Pour (h), cherchez l'intersection de la droite $z=x\tan\beta$ avec $z_s(x)$.
    correction: |
      $d(\alpha)=\dfrac{2v_0^2\cos\alpha\sin(\alpha-\beta)}{g\cos^2\beta}$ ; $\alpha^\star=\dfrac\pi4+\dfrac\beta2=60^\circ$, $d_{\max}=\dfrac{v_0^2}{g(1+\sin\beta)}\approx27{,}2$ m ; en descente : $\alpha^\star=30^\circ$ et $d_{\max}=\dfrac{v_0^2}{g(1-\sin\beta)}\approx81{,}5$ m.
    solution:
      - titre: "(f) Portée sur la pente"
        texte: |
          En reportant $x=d\cos\beta$, $z=d\sin\beta$ dans $z=x\tan\alpha-\dfrac{g x^2}{2v_0^2\cos^2\alpha}$ et en divisant par $d\ne0$ :
          $$\sin\beta=\cos\beta\tan\alpha-\frac{g\,d\cos^2\beta}{2v_0^2\cos^2\alpha}.$$
          D'où
          $$d=\frac{2v_0^2\cos^2\alpha\,(\cos\beta\tan\alpha-\sin\beta)}{g\cos^2\beta}=\boxed{\frac{2v_0^2\cos\alpha\,\sin(\alpha-\beta)}{g\cos^2\beta}}.$$
          Pour $\beta=0$, on retrouve $d=\dfrac{v_0^2\sin2\alpha}{g}$.
      - titre: "(g) Angle optimal et portée maximale"
        texte: |
          On linéarise : $2\cos\alpha\sin(\alpha-\beta)=\sin(2\alpha-\beta)-\sin\beta$. Ce terme est maximal quand $\sin(2\alpha-\beta)=1$, soit $2\alpha-\beta=\dfrac\pi2$ :
          $$\boxed{\alpha^\star=\frac\pi4+\frac\beta2},\qquad d_{\max}=\frac{v_0^2\,(1-\sin\beta)}{g\cos^2\beta}=\boxed{\frac{v_0^2}{g\,(1+\sin\beta)}},$$
          en utilisant $\cos^2\beta=(1-\sin\beta)(1+\sin\beta)$.

          Application : $\beta=30^\circ$, $\alpha^\star=45^\circ+15^\circ=\mathbf{60^\circ}$ et $d_{\max}=\dfrac{40{,}77}{1{,}5}\approx\boxed{27{,}2~\text{m}}$ (contre $40{,}8$ m sur sol plat).

          {\bf Talus descendant} : on remplace $\beta$ par $-\beta$. Alors $\alpha^\star=\dfrac\pi4-\dfrac\beta2=30^\circ$ et $d_{\max}=\dfrac{v_0^2}{g(1-\sin\beta)}\approx\boxed{81{,}5~\text{m}}$, soit exactement $3$ fois la portée en montée : le rapport vaut $\dfrac{1+\sin\beta}{1-\sin\beta}=3$ pour $\beta=30^\circ$.
      - titre: "(h) Méthode par la parabole de sûreté ; interprétation"
        texte: |
          Le point d'impact le plus lointain sur le talus est le point où la droite $z=x\tan\beta$ sort de la zone atteignable, c'est-à-dire où elle coupe la parabole de sûreté. Avec $X=\dfrac{g x}{v_0^2}$, l'équation $x\tan\beta=z_s(x)$ s'écrit
          $$X^2+2X\tan\beta-1=0\Longrightarrow X=\frac{1-\sin\beta}{\cos\beta},$$
          d'où $d_{\max}=\dfrac{x}{\cos\beta}=\dfrac{v_0^2}{g}\,\dfrac{1-\sin\beta}{\cos^2\beta}=\dfrac{v_0^2}{g\,(1+\sin\beta)}$ : même résultat, sans maximiser aucune fonction de $\alpha$.

          Interprétation : $\alpha^\star=\dfrac\pi4+\dfrac\beta2=\dfrac12\Big(\beta+\dfrac\pi2\Big)$ est l'angle de la {\bf bissectrice} entre la direction de la pente (angle $\beta$) et la verticale (angle $\pi/2$) : pour tirer le plus loin sur une pente, on vise à mi-chemin entre la pente et le zénith.
