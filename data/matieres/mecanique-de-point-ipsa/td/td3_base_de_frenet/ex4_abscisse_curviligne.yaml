id: td3_ex4
intitule: "Abscisse curviligne et rayon de courbure d'une trajectoire parabolique"
td: td3
facultatif: false
seance: 3

cours_rattache:
  - cinematique.abscisse_curviligne
  - cinematique.base_frenet
  - cinematique.rayon_courbure
  - cinematique.acceleration_tangentielle_normale

metadonnees:
  duree_estimee: "35 min"
  difficulte: 3
  priorite: 5
  type_exercice: "Entraînement / Application complète"
  indispensable: true

enonce_intro: |
  Dans le plan $Oxy$, les coordonnées d'une particule sont données en fonction du temps par
  $$\begin{cases}x(t)=b\,t\\ y(t)=c\,t\,(t-1)\end{cases}$$
  avec $b=2$ (S.I.) et $c=4$ (S.I.).

prerequis:
  - titre: "Cinématique cartésienne"
    texte: |
      $\vec v=(\dot x,\dot y)$, $\vec a=(\ddot x,\ddot y)$, élimination du temps pour trouver la trajectoire.
  - titre: "Composantes tangentielle et normale"
    texte: |
      $a_T=\dfrac{\vec a\cdot\vec v}v$, $a_N=\dfrac{|a_xv_y-a_yv_x|}v=\sqrt{a^2-a_T^2}$, $R=\dfrac{v^2}{a_N}$.
  - titre: "Abscisse curviligne"
    texte: |
      $s(t)=\displaystyle\int_0^t\|\vec v\|\,\mathrm dt'$, avec $\displaystyle\int\sqrt{1+u^2}\,\mathrm du=\tfrac12\left(u\sqrt{1+u^2}+\operatorname{arsinh}u\right)$.

objectifs_pedagogiques_etudiants:
  - titre: "Mener un calcul complet de $a_T$, $a_N$, $R$ et $s$ à partir d'une loi horaire"
    texte: |
      Éliminer le temps, calculer $\vec v$, $\vec a$, leurs composantes tangentielle et normale, le rayon de courbure en un instant donné, vérifier avec la formule en $y(x)$ et calculer la longueur parcourue.

objectifs_pedagogiques_enseignants:
  - titre: "Un exercice « de tout » sur un mouvement à accélération constante"
    texte: |
      Les étudiants voient que $\vec a$ est {\bf constant} mais que ses composantes $a_T$ et $a_N$ varient au cours du temps (car la base de Frenet tourne). C'est une preuve concrète que $a_T$ et $a_N$ ne sont pas des « composantes cartésiennes ». Le cas $t=0{,}5$ s (sommet de la parabole) est particulièrement simple : $a_T=0$, $a_N=a$. La question (e) (abscisse curviligne) est un ajout qui donne un usage concret de $s$ et de la primitive de $\sqrt{1+u^2}$.

point_cours:
  - titre: "Mouvement à accélération constante"
    texte: |
      Si $\vec a$ est un vecteur constant, la trajectoire est une parabole (ou une droite si $\vec v(0)\parallel\vec a$). $\vec a$ est constant, mais $a_T=\vec a\cdot\vec\tau$ et $a_N=\vec a\cdot\vec n$ varient avec la direction de $\vec\tau$.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Croire que $a_T$ et $a_N$ sont constantes parce que $\\vec a$ l'est"
    texte: |
      $\vec a=(0;8)$ est constant mais $\vec\tau$ tourne : $a_T=8\sin(\text{angle})$ varie de $-7{,}2$ à $+7{,}2\ \mathrm{m\,s^{-2}}$ entre $t=0$ et $t=1$ s Il faut les recalculer à chaque instant.
  - titre: "Calculer $R$ avec la norme totale $a$"
    texte: |
      $R=\dfrac{v^2}{a_N}$ (et non $\dfrac{v^2}a$). Avec $a=8$ à $t=0$ on trouverait $R=\dfrac{20}8=2{,}5$ m alors que le bon rayon est $\dfrac{20}{3{,}58}=5{,}6$ m.
  - titre: "Oublier de comparer à la formule $R=\\dfrac{(1+y'^2)^{3/2}}{|y''|}$"
    texte: |
      C'est un contrôle simple : à $t=0{,}5$, $x=1$, $y'=0$, $y''=2$ donc $R=0{,}5$ m. Il doit coïncider avec le résultat par $v^2/a_N$.

remarques_pedagogiques_conseils_animation:
  - titre: "Tracer le tableau $t\\mapsto(v,a_T,a_N,R)$"
    texte: |
      Demander un tableau pour $t=0$, $0{,}25$, $0{,}5$, $0{,}75$, $1$ s : on voit $a_T$ passer de négatif à positif en s'annulant au sommet, $a_N$ maximal au sommet, $R$ minimal au sommet.
  - titre: "Python"
    texte: |
      Tracer la parabole, $\vec v$, $\vec a$, $\vec\tau$, $\vec n$ à plusieurs instants avec \texttt{quiver}, et le cercle osculateur en $t=0{,}5$ s.

bilan:
  - titre: "Résultats"
    texte: |
      $y=x^2-2x$ (parabole de sommet $(1;-1)$) ; $\vec v=(2;\ 8t-4)$ ; $\vec a=(0;8)$ ; $a_T=\dfrac{8u}{\sqrt{1+u^2}}$, $a_N=\dfrac8{\sqrt{1+u^2}}$ avec $u=4t-2$ ; $t=0{,}5$ s : $v=2\ \mathrm{m/s}$, $a_T=0$, $a_N=8\ \mathrm{m\,s^{-2}}$, $R=0{,}5\ \mathrm m$ ; $s(0{,}5)\approx1{,}48\ \mathrm m$.

aller_plus_loin:
  - niveau: cpge
    titre: "Centre de courbure et vérification numérique"
    texte: |
      Calculer le centre de courbure à $t=0{,}5$ s : $C=(1;-1)+0{,}5\,\vec u_y=(1;-0{,}5)$. Vérifier avec Python (\texttt{np.gradient}) que $R(t)$ calculé numériquement coïncide avec $R=\dfrac{(4+(8t-4)^2)^{3/2}}{16}$.
  - niveau: licence
    titre: "Mouvement uniforme sur la même parabole"
    texte: |
      Comparer ce mouvement (accélération constante, vitesse variable) à un mouvement sur la même parabole à vitesse constante $v_0=2\ \mathrm{m/s}$ (exercice 2) : l'accélération au sommet est la même ($8\ \mathrm{m\,s^{-2}}$) ; l'accélération en $x=0$ est différente. Écrire la loi horaire $s(t)=v_0t$ puis $x(t)$.

accroche_point_cours_essentiel:
  - titre: "Une accélération constante, des composantes variables"
    duree_introduction: "3 à 5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Un projectile lancé dans le vide subit une accélération constante $\vec g$. Pourtant, au sommet de sa trajectoire, on dit qu'il n'a « plus d'accélération tangentielle ». Comment l'accélération peut-elle être constante en vecteur et pourtant « changer » ?
    texte: |
      {\bf Idée clé : $\vec a$ est un vecteur fixe, mais $(\vec\tau,\vec n)$ tourne.} Les composantes $a_T=\vec a\cdot\vec\tau$ et $a_N=\vec a\cdot\vec n$ dépendent de l'angle entre $\vec a$ et la tangente. Au sommet, $\vec a\perp\vec v$ : $a_T=0$ et $a_N=a$.

outils_mathematiques:
  - titre: "Élimination du temps"
    texte: |
      $t=x/b$ puis $y=c\,\dfrac xb\left(\dfrac xb-1\right)=\dfrac c{b^2}x^2-\dfrac cbx$.
  - titre: "Produits scalaire et vectoriel plans"
    texte: |
      $\vec a\cdot\vec v=a_xv_x+a_yv_y$, $|\vec a\wedge\vec v|=|a_xv_y-a_yv_x|$.
  - titre: "Primitive de $\\sqrt{1+u^2}$"
    texte: |
      $F(u)=\tfrac12\left(u\sqrt{1+u^2}+\ln(u+\sqrt{1+u^2})\right)$, impaire : $\int_{-2}^0\sqrt{1+u^2}\,\mathrm du=F(2)\approx2{,}958$.

liens_autres_disciplines:
  - discipline: "Mécanique du vol et balistique"
    texte: |
      Le mouvement d'un projectile dans le vide est à accélération constante $\vec g$ ; $a_T$ et $a_N$ y sont les composantes de $\vec g$ sur la trajectoire (exercice 8).
  - discipline: "Mathématiques"
    texte: |
      Longueur d'un arc de parabole : intégrale de $\sqrt{1+u^2}$, qui fait apparaître l'argument sinus hyperbolique.

schemas_proposes:
  - titre: "Trajectoire, vitesse et accélération à $t=0$ et $t=0{,}5$ s"
    description: |
      Parabole $y=x^2-2x$ pour $0\le x\le2$ avec les points $O$ ($t=0$), $S(1;-1)$ ($t=0{,}5$ s) et $P(2;0)$ ($t=1$ s). À $t=0$ : $\vec v=(2;-4)$ (échelle $1\ \mathrm{cm}=1\ \mathrm{m/s}$), $\vec a=(0;8)$ ; faire apparaître $\vec\tau$, $\vec n$, et la décomposition de $\vec a$ en $a_T$ (négatif) et $a_N$. À $t=0{,}5$ s : $\vec v=(2;0)$ horizontal, $\vec a$ vertical, $\vec\tau=\vec u_x$, $\vec n=\vec u_y$, cercle osculateur de centre $(1;-0{,}5)$ et de rayon $0{,}5$.
    tikz: |
      \begin{tikzpicture}[>=stealth,scale=1.6]
        \draw[->] (-0.3,0)--(2.5,0) node[right]{$x$};
        \draw[->] (0,-1.3)--(0,0.8) node[above]{$y$};
        \draw[thick,domain=0:2,samples=60] plot (\x,{\x*\x-2*\x});
        \fill (0,0) circle (1.5pt) node[above left]{$O$};
        \fill (1,-1) circle (1.5pt) node[below]{$S$};
        \draw[->,thick,red] (0,0)--(0.5,-1) node[right]{$\vec v(0)$};
        \draw[->,thick,blue] (0,0)--(0,0.6) node[left]{$\vec a$};
        \draw[->,thick,red] (1,-1)--(1.5,-1) node[right]{$\vec v$};
        \draw[->,thick,blue] (1,-1)--(1,-0.4) node[left]{$\vec a$};
        \draw[dashed] (1,-0.5) circle (0.5);
      \end{tikzpicture}

questions:
  - id: q1
    enonce: |
      \begin{enumerate}[label=(\alph*)]
          \item Déterminer l'équation de la trajectoire et la représenter sur un graphique.
          \item Calculer la vitesse $\vec v$ à l'instant $t$. Tracer $\vec v$ à $t=0$ et $t=0{,}5\ \mathrm s$ sur le graphique.
      \end{enumerate}
    coup_de_pouce: |
      Éliminez $t$ entre $x(t)$ et $y(t)$ : $t=x/b$. Pour la vitesse, dérivez chaque composante. Pour le graphique : zéros de $y$, sommet.
    correction: |
      (a) $y=x^2-2x$ : parabole de sommet $(1;-1)$, passant par $(0;0)$ et $(2;0)$. (b) $\vec v=(2;\ 8t-4)$ ; $\vec v(0)=(2;-4)$, $\vec v(0{,}5)=(2;0)$.
    solution:
      - titre: "(a) Trajectoire"
        texte: |
          $t=\dfrac xb=\dfrac x2$, d'où $y=4\cdot\dfrac x2\left(\dfrac x2-1\right)=x^2-2x$ :
          $$\boxed{y=x^2-2x=(x-1)^2-1}.$$
          Parabole ouverte vers le haut, de sommet $S(1;-1)$, coupant $Ox$ en $x=0$ ($t=0$) et $x=2$ ($t=1$ s). Le point $S$ est atteint à $t=0{,}5$ s. La particule part de $O$, descend jusqu'à $S$ puis remonte vers $(2;0)$.
      - titre: "(b) Vitesse"
        texte: |
          $\dot x=b=2$ et $\dot y=c\,(2t-1)=4(2t-1)=8t-4$ :
          $$\boxed{\vec v=(2\ ;\ 8t-4)\ \mathrm{m/s}},\qquad v=\sqrt{4+(8t-4)^2}.$$
          $t=0$ : $\vec v=(2;-4)$, $v=\sqrt{20}\approx4{,}47\ \mathrm{m/s}$, dirigée vers le bas à droite. $t=0{,}5$ s : $\vec v=(2;0)$, $v=2\ \mathrm{m/s}$, horizontale, vers la droite (sommet de la parabole). Sur le graphique, $\vec v$ est tangent à la trajectoire en chaque point.

  - id: q2
    enonce: |
      \begin{enumerate}[label=(\alph*),start=3]
          \item Montrer que le mouvement a une accélération constante, dont on calculera les composantes tangentielle et normale.
          \item En déduire le rayon de courbure à $t=0{,}5\ \mathrm s$.
      \end{enumerate}
    coup_de_pouce: |
      $a_T=\vec a\cdot\vec v/v$ et $a_N=\sqrt{a^2-a_T^2}$ (ou $|\vec a\wedge\vec v|/v$). Pour (d), $R=v^2/a_N$ ; comparez avec $\dfrac{(1+y'^2)^{3/2}}{|y''|}$.
    correction: |
      $\vec a=(0;8)$ constant ; $a_T=\dfrac{8(8t-4)}{v}$, $a_N=\dfrac{16}v$ avec $v=\sqrt{4+(8t-4)^2}$. En $t=0{,}5$ : $a_T=0$, $a_N=8$ ; $R=\dfrac{v^2}{a_N}=\dfrac4{8}=0{,}5\ \mathrm m$.
    solution:
      - titre: "(c) Accélération"
        texte: |
          $\ddot x=0$ et $\ddot y=2c=8$ :
          $$\boxed{\vec a=(0\ ;\ 8)\ \mathrm{m\,s^{-2}}}$$
          constante et verticale (dirigée selon $+Oy$). 
      - titre: "(c) Composantes tangentielle et normale"
        texte: |
          $\vec a\cdot\vec v=8(8t-4)$ donc $a_T=\dfrac{8(8t-4)}{\sqrt{4+(8t-4)^2}}$. Avec $u=4t-2$, $8t-4=2u$ et $v=2\sqrt{1+u^2}$ :
          $$\boxed{a_T=\frac{8u}{\sqrt{1+u^2}}},\qquad\boxed{a_N=\frac{|a_xv_y-a_yv_x|}v=\frac{16}{2\sqrt{1+u^2}}=\frac8{\sqrt{1+u^2}}}.$$
          Vérification : $a_T^2+a_N^2=\dfrac{64u^2+64}{1+u^2}=64=a^2$ $\surd$. Valeurs : $t=0$ ($u=-2$) : $a_T=-\dfrac{16}{\sqrt5}\approx-7{,}16$ et $a_N=\dfrac8{\sqrt5}\approx3{,}58\ \mathrm{m\,s^{-2}}$ (la particule {\bf ralentit} en descendant vers le sommet) ; $t=0{,}5$ s ($u=0$) : $a_T=0$, $a_N=8\ \mathrm{m\,s^{-2}}$ ; $t=1$ s ($u=2$) : $a_T\approx+7{,}16$ (elle accélère en remontant). Comportement : $a_T$ passe de négatif à positif en s'annulant au sommet, $a_N$ est maximal au sommet.
      - titre: "(d) Rayon de courbure à $t=0{,}5$ s"
        texte: |
          $R=\dfrac{v^2}{a_N}=\dfrac{2^2}8=\boxed{0{,}5\ \mathrm m}$. Contrôle avec la formule des courbes $y(x)$ : au sommet $x=1$, $y'=2x-2=0$ et $y''=2$ donc $R=\dfrac{(1+0)^{3/2}}2=0{,}5\ \mathrm m$ $\surd$. Le centre de courbure est $C=S+R\,\vec n=(1;-1)+0{,}5\,\vec u_y=(1;-0{,}5)$. Au contraire, en $t=0$ : $R=\dfrac{v^2}{a_N}=\dfrac{20}{3{,}58}\approx5{,}59\ \mathrm m$ (confirmé par $\dfrac{(1+y'^2)^{3/2}}{|y''|}$ avec $y'(0)=-2$ : $\dfrac{5^{3/2}}2=5{,}59$ $\surd$).

  - id: q3
    enonce: |
      \begin{enumerate}[label=(\alph*),start=5]
          \item Calculer l'abscisse curviligne $s(t)$ parcourue depuis $t=0$, puis la longueur de l'arc $OP$ de $t=0$ à $t=1\ \mathrm s$. La comparer à la distance en ligne droite $OP$.
          \item Vérifier que, de $t=0$ à $t=0{,}5\ \mathrm s$, $s$ est bien l'aire sous la courbe $v(t)$ (intégrale).
      \end{enumerate}
    coup_de_pouce: |
      $s(t)=\int_0^tv\,\mathrm dt'$ avec $v=2\sqrt{1+u^2}$, $u=4t'-2$, $\mathrm dt'=\mathrm du/4$ : primitive de $\sqrt{1+u^2}$.
    correction: |
      $s(0{,}5)\approx1{,}48\ \mathrm m$ ; arc $OP$ : $\approx2{,}96\ \mathrm m$, à comparer à $OP=2\ \mathrm m$ ; l'arc est $48\ \%$ plus long que la corde.
    solution:
      - titre: "(e) Abscisse curviligne"
        texte: |
          $s(t)=\displaystyle\int_0^t2\sqrt{1+(4t'-2)^2}\,\mathrm dt'=\dfrac12\int_{-2}^{4t-2}\sqrt{1+u^2}\,\mathrm du=\dfrac12\left[F(u)\right]_{-2}^{4t-2}$ avec $F(u)=\dfrac12\left(u\sqrt{1+u^2}+\operatorname{arsinh}u\right)$ impaire. $F(2)=\dfrac12\left(2\sqrt5+\operatorname{arsinh}2\right)\approx\dfrac12(4{,}472+1{,}444)=2{,}958$.

          De $t=0$ à $0{,}5$ s : $s=\dfrac12\left(F(0)-F(-2)\right)=\dfrac12F(2)\approx\boxed{1{,}48\ \mathrm m}$. De $0$ à $1$ s : $s=\dfrac12\left(F(2)-F(-2)\right)=F(2)\approx\boxed{2{,}96\ \mathrm m}$. La distance en ligne droite $OP=2\ \mathrm m$ : la trajectoire est $48\ \%$ plus longue que la corde, car la particule descend de $1\ \mathrm m$ puis remonte de $1\ \mathrm m$ pour avancer de $2\ \mathrm m$ ; borne basse : $s\ge OP$ $\surd$ ; borne haute : $s\le2+2=4\ \mathrm m$ $\surd$.
      - titre: "(f) Lecture graphique"
        texte: |
          $s(t)$ est l'aire sous la courbe $v(t)$ : $v(0)=4{,}47$, $v(0{,}5)=2$, $v(1)=4{,}47\ \mathrm{m/s}$ ; la formule des trapèzes sur $[0;0{,}5]$ donne $\dfrac{4{,}47+2}2\times0{,}5\approx1{,}62$, proche de $1{,}48$ ; la courbe $v(t)$ est convexe, la formule des trapèzes surestime légèrement l'aire $\surd$.
