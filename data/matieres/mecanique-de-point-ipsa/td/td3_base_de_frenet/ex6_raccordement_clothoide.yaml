id: td3_ex6
intitule: "Raccordement routier en clothoïde (courbure variable et « jerk »)"
td: td3
facultatif: true
seance: 3

cours_rattache:
  - cinematique.base_frenet
  - cinematique.rayon_courbure
  - cinematique.acceleration_tangentielle_normale
  - cinematique.abscisse_curviligne

metadonnees:
  duree_estimee: "50 min"
  difficulte: 5
  priorite: 3
  type_exercice: "Approfondissement / Problème technique"
  indispensable: false

enonce_intro: |
  Sur une route (ou une voie ferrée), le passage d'un alignement droit à un virage circulaire de rayon $R_f$ ne se
  fait jamais brutalement : si le rayon passait instantanément de $\infty$ à $R_f$, l'accélération normale
  $a_N=v^2/R$ ferait un {\bf saut} (le conducteur serait « jeté » de côté) et le volant devrait être tourné
  instantanément. On intercale donc un {\bf raccordement progressif} dont la courbure croît {\bf linéairement avec
  l'abscisse curviligne} :
  $$\frac1{R(s)}=\frac s{A^2},\qquad A>0\ \text{constante (en mètres)},$$
  courbe appelée {\bf clothoïde} (ou spirale d'Euler, spirale de Cornu). L'abscisse curviligne $s$ est comptée depuis
  le début du raccordement, où la route est rectiligne et tangente à $Ox$. Un véhicule la parcourt à vitesse de norme
  $v$ constante.

prerequis:
  - titre: "Base de Frenet"
    texte: |
      $\vec a=\dot v\,\vec\tau+\dfrac{v^2}R\,\vec n$ ; $\dfrac1R=\left|\dfrac{\mathrm d\alpha}{\mathrm ds}\right|$ où $\alpha$ est l'angle de la tangente avec $Ox$ ; $\mathrm d\overrightarrow{OM}=\mathrm ds\,\vec\tau=\mathrm ds\,(\cos\alpha,\sin\alpha)$.
  - titre: "Développements limités"
    texte: |
      $\cos u=1-\dfrac{u^2}2+\cdots$ et $\sin u=u-\dfrac{u^3}6+\cdots$ pour $u\to0$.
  - titre: "Dérivée de l'accélération (jerk)"
    texte: |
      Le {\bf jerk} (à-coup) est $\vec j=\dfrac{\mathrm d\vec a}{\mathrm dt}$ ; en mouvement rectiligne, $j=\ddot v$. Un jerk élevé est ressenti comme un choc ; les normes de confort sont de l'ordre de $0{,}3$ à $0{,}6\ \mathrm{m\,s^{-3}}$ (route, rail).

objectifs_pedagogiques_etudiants:
  - titre: "Reconstruire une trajectoire à partir de sa courbure"
    texte: |
      Savoir qu'une courbe plane est déterminée par sa courbure $\kappa(s)=1/R(s)$ : $\alpha(s)=\int\kappa\,\mathrm ds$, puis $x=\int\cos\alpha\,\mathrm ds$, $y=\int\sin\alpha\,\mathrm ds$. Relier la courbure au confort via $a_N=v^2\kappa$ et au jerk, et dimensionner un raccordement avec des données réalistes.

objectifs_pedagogiques_enseignants:
  - titre: "Un exercice « ingénieur » qui montre l'intérêt de la courbure variable"
    texte: |
      Il fait le lien avec les infrastructures réelles et utilise le DL pour obtenir la parabole cubique (approximation utilisée par les géomètres) ; il se prête bien à une simulation Python (\texttt{scipy.special.fresnel}). Les étudiants doivent comprendre que, pour une route, la {\bf loi de courbure} est la donnée de conception, pas la trajectoire. À traiter en dernier, après l'exercice 1. La partie 3 est un bonus numérique, la partie 4 est une ouverture.

point_cours:
  - titre: "Courbure et construction d'une courbe plane"
    texte: |
      Pour une courbe paramétrée par l'abscisse curviligne : $\dfrac{\mathrm d\alpha}{\mathrm ds}=\kappa(s)$ (courbure algébrique), $\dfrac{\mathrm dx}{\mathrm ds}=\cos\alpha$, $\dfrac{\mathrm dy}{\mathrm ds}=\sin\alpha$. À vitesse constante : $a_N=v^2\kappa(s)$ et le « jerk latéral » est $j_N=\dfrac{\mathrm da_N}{\mathrm dt}=v^3\dfrac{\mathrm d\kappa}{\mathrm ds}$.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Confondre le rayon $R(s)=A^2/s$ et la constante $A$"
    texte: |
      $A$ est un paramètre de forme (en mètres) : $A^2=R\,s$ est constant le long de la courbe. $R$ varie de $\infty$ (en $s=0$) à $R_f$ (en $s=L$).
  - titre: "Croire que la clothoïde est un arc de cercle ou de parabole"
    texte: |
      Elle ressemble à une parabole cubique près du début (DL) et à un cercle serré vers la fin, mais n'est ni l'un ni l'autre. Ses équations contiennent des intégrales de Fresnel, non exprimables avec des fonctions usuelles.
  - titre: "Oublier de convertir les unités"
    texte: |
      $90\ \mathrm{km/h}=25\ \mathrm{m/s}$. Avec $v^3$ dans $A^2=v^3/j$, une erreur sur la conversion est amplifiée d'un facteur 3 en exposant.
  - titre: "Penser que la clothoïde n'a pas de point final"
    texte: |
      La courbure croît indéfiniment avec $s$ : la courbe s'enroule autour d'un point limite (spirale de Cornu) mais la longueur est infinie. On l'utilise sur une longueur finie $L$, puis on raccorde au cercle $R_f$.

remarques_pedagogiques_conseils_animation:
  - titre: "Faire estimer le saut d'accélération"
    texte: |
      Avant tout calcul, demander : « quelle est l'accélération latérale ressentie à $90\ \mathrm{km/h}$ dans un virage de rayon $300\ \mathrm m$ ? » ($2{,}1\ \mathrm{m\,s^{-2}}$, $0{,}21\,g$) puis « et si elle apparaît en $0{,}1$ seconde ? » ($\approx21\ \mathrm{m\,s^{-3}}$, trente fois la norme de confort).
  - titre: "Tracer la clothoïde avec Python"
    texte: |
      \texttt{from scipy.special import fresnel ; S,C=fresnel(s/(A*np.sqrt(np.pi))) ; x=A*np.sqrt(np.pi)*C ; y=A*np.sqrt(np.pi)*S}. Superposer le cercle osculateur de rayon $A^2/s$ et centre $M+R\,\vec n$ en plusieurs points : on voit les cercles s'emboîter.

bilan:
  - titre: "Clothoïde"
    texte: |
      $\kappa=\dfrac s{A^2}$ ; $\alpha(s)=\dfrac{s^2}{2A^2}$ ; $x\simeq s-\dfrac{s^5}{40A^4}$, $y\simeq\dfrac{s^3}{6A^2}$ ; à $v=$ cte : $a_N=\dfrac{v^2s}{A^2}=\dfrac{v^3t}{A^2}$ et $j=\dfrac{v^3}{A^2}$ constant. Dimensionnement : $A^2=\dfrac{v^3}{j}$, $L=\dfrac{A^2}{R_f}$, $\alpha_f=\dfrac L{2R_f}$, durée $\dfrac Lv$. À $90\ \mathrm{km/h}$, $R_f=300\ \mathrm m$, $j=0{,}6\ \mathrm{m\,s^{-3}}$ : $A\approx161\ \mathrm m$, $L\approx87\ \mathrm m$ ($3{,}5\ \mathrm s$), déviation $8{,}3^\circ$.

aller_plus_loin:
  - niveau: cpge
    titre: "Simulation et comparaison avec un raccordement brutal"
    texte: |
      Simuler $a_N(t)$ pour un virage brutal (créneau) et un raccordement progressif (rampe), et en déduire le jerk. Tracer la trajectoire du véhicule et le cercle osculateur au début, au milieu et à la fin du raccordement.
  - niveau: licence
    titre: "Intégrales de Fresnel et spirale de Cornu"
    texte: |
      Avec $s=A\sqrt\pi\,\tau$ : $x=A\sqrt\pi\,C(\tau)$ et $y=A\sqrt\pi\,S(\tau)$ où $C(\tau)=\int_0^\tau\cos\frac{\pi u^2}2\mathrm du$ et $S(\tau)=\int_0^\tau\sin\frac{\pi u^2}2\mathrm du$. Montrer que la courbe converge vers le point $\left(\frac{A\sqrt\pi}2,\frac{A\sqrt\pi}2\right)$ quand $s\to\infty$ ; la longueur de la courbe est cependant {\bf infinie}. Interpréter en optique (diffraction de Fresnel par un bord).
  - niveau: master
    titre: "Courbes de courbure imposée et optimisation"
    texte: |
      La clothoïde minimise le jerk latéral maximal pour une variation de courbure imposée sur une longueur donnée. Généraliser : trouver la loi $\kappa(s)$ qui minimise $\int\left(\frac{\mathrm d\kappa}{\mathrm ds}\right)^2\mathrm ds$ à longueur et angle imposés (courbe d'énergie minimale) et comparer à la clothoïde. Application aux trajectoires de véhicules autonomes.

accroche_point_cours_essentiel:
  - titre: "Pourquoi une route droite ne se raccorde jamais directement à un cercle ?"
    duree_introduction: "3 à 5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Imaginez rouler à $90$ km/h sur une ligne droite qui se raccorde brusquement à un virage circulaire. Que ressentez-vous au point de raccord ? Et que doit faire le conducteur de ses mains ? Comment une route peut-elle « préparer » le conducteur à un virage ?
    texte: |
      {\bf Idée clé : la courbure est la donnée, la trajectoire en est la conséquence.} À vitesse constante, l'accélération latérale ressentie est $a_N=v^2\kappa(s)$. Pour qu'elle croisse {\bf progressivement}, la courbure doit croître progressivement. Le choix le plus simple est $\kappa$ linéaire en $s$ : c'est la clothoïde.

outils_mathematiques:
  - titre: "Reconstruction d'une courbe plane à partir de sa courbure"
    texte: |
      $\alpha(s)=\alpha_0+\int_0^s\kappa(\sigma)\,\mathrm d\sigma$ ; $x(s)=x_0+\int_0^s\cos\alpha\,\mathrm d\sigma$ ; $y(s)=y_0+\int_0^s\sin\alpha\,\mathrm d\sigma$.
  - titre: "Développements limités sous l'intégrale"
    texte: |
      Pour $\alpha=\dfrac{s^2}{2A^2}\ll1$ : $\cos\alpha\simeq1-\dfrac{s^4}{8A^4}$ et $\sin\alpha\simeq\dfrac{s^2}{2A^2}-\dfrac{s^6}{48A^6}$ ; en intégrant : $x\simeq s-\dfrac{s^5}{40A^4}$, $y\simeq\dfrac{s^3}{6A^2}-\dfrac{s^7}{336A^6}$.
  - titre: "Fonctions de Fresnel"
    texte: |
      $C(z)=\displaystyle\int_0^z\cos\left(\tfrac{\pi t^2}2\right)\mathrm dt$ et $S(z)=\int_0^z\sin\left(\tfrac{\pi t^2}2\right)\mathrm dt$ ; $C(\infty)=S(\infty)=\tfrac12$. Disponibles dans \texttt{scipy.special.fresnel} (qui renvoie $(S,C)$).
  - titre: "Conversion $v^3$"
    texte: |
      $v^3=(25)^3=15\,625\ \mathrm{m^3\,s^{-3}}$ pour $90\ \mathrm{km/h}$ ; à $130\ \mathrm{km/h}$ ($36{,}1\ \mathrm{m/s}$) : $47\,000$. Le cube explique pourquoi la longueur de raccordement augmente très vite avec la vitesse.

liens_autres_disciplines:
  - discipline: "Génie civil et ferroviaire"
    texte: |
      Les raccordements en clothoïde sont la norme pour les routes et les voies ferrées ; les montagnes russes utilisent le même principe pour les boucles (les boucles verticales sont des clothoïdes plutôt que des cercles, pour limiter le jerk et l'accélération maximale).
  - discipline: "Optique"
    texte: |
      La spirale de Cornu donne l'amplitude de l'onde diffractée par un bord ou une fente (diffraction de Fresnel) : les intégrales $C$ et $S$ sont les parties réelle et imaginaire de $\int\mathrm e^{i\pi t^2/2}\mathrm dt$.
  - discipline: "Robotique et véhicules autonomes"
    texte: |
      Planification de trajectoire à courbure continue : les robots et les voitures autonomes utilisent des clothoïdes (ou des splines) pour des trajectoires lisses où le volant tourne à vitesse constante.

schemas_proposes:
  - titre: "Raccordement droite - clothoïde - cercle"
    description: |
      Une droite horizontale jusqu'à $O$, puis la clothoïde sur la longueur $L$ avec les points $s=0$, $L/2$, $L$ ; puis le cercle de rayon $R_f$. En chaque point repère : $\vec\tau$, $\vec n$ et le cercle osculateur (de centres de plus en plus proches). Montrer le {\bf décalage} (ripage) de la trajectoire par rapport à la tangente prolongée : $y(L)\simeq L^2/(6R_f)$.
  - titre: "Courbes $\\kappa(s)$ et $a_N(t)$"
    description: |
      Deux graphiques : $\kappa(s)$ pour le raccordement brutal (marche) et progressif (rampe linéaire) ; $a_N(t)$ pour les deux cas. Faire apparaître le saut dans le cas brutal et la pente $j=v^3/A^2$ dans le cas progressif.

questions:
  - id: q1
    enonce: |
      {\bf 1/ La courbe.}
      \begin{enumerate}[label=(\alph*)]
          \item Montrer que l'angle de la tangente avec $Ox$ est $\alpha(s)=\dfrac{s^2}{2A^2}$ et que $R(s)=\dfrac{A^2}s$. Que valent $\alpha$ et $R$ en $s=0$ et en $s=L$ ?
          \item Écrire $x(s)$ et $y(s)$ sous forme intégrale. Pour $\alpha\ll1$, montrer que $x\simeq s$ et $y\simeq\dfrac{s^3}{6A^2}$ : la clothoïde se confond avec une {\bf parabole cubique}.
      \end{enumerate}
    coup_de_pouce: |
      $\dfrac1R=\left|\dfrac{\mathrm d\alpha}{\mathrm ds}\right|$ avec $\alpha(0)=0$ (la route est d'abord tangente à $Ox$). Pour (b), $\dfrac{\mathrm dx}{\mathrm ds}=\cos\alpha$ et $\dfrac{\mathrm dy}{\mathrm ds}=\sin\alpha$.
    correction: |
      (a) $\dfrac{\mathrm d\alpha}{\mathrm ds}=\dfrac s{A^2}$ donc $\alpha=\dfrac{s^2}{2A^2}$ ; $R=\dfrac{A^2}s$ ; $R(0)=\infty$, $R(L)=R_f$ si $L=\dfrac{A^2}{R_f}$ ; $\alpha(L)=\dfrac L{2R_f}$. (b) $x=\displaystyle\int_0^s\cos\frac{\sigma^2}{2A^2}\mathrm d\sigma$, $y=\int_0^s\sin\frac{\sigma^2}{2A^2}\mathrm d\sigma$ ; DL : $y\simeq\dfrac{s^3}{6A^2}$.
    solution:
      - titre: "(a) Angle et rayon"
        texte: |
          La courbure vaut $\kappa=\dfrac1R=\dfrac s{A^2}=\dfrac{\mathrm d\alpha}{\mathrm ds}$ (virage dans le sens trigonométrique). Intégrer avec $\alpha(0)=0$ :
          $$\boxed{\alpha(s)=\frac{s^2}{2A^2}},\qquad\boxed{R(s)=\frac{A^2}s}.$$
          En $s=0$ : $\alpha=0$, $R=\infty$ (droite). En $s=L$ (fin du raccordement, raccord au cercle de rayon $R_f$) : $R(L)=R_f$ donne $\boxed{L=\dfrac{A^2}{R_f}}$ et $\alpha_f=\dfrac{L^2}{2A^2}=\dfrac L{2R_f}$ : l'angle de déviation est la moitié de celui d'un arc de cercle de même longueur et de rayon $R_f$.
      - titre: "(b) Équations paramétriques"
        texte: |
          $$x(s)=\int_0^s\cos\frac{\sigma^2}{2A^2}\,\mathrm d\sigma,\qquad y(s)=\int_0^s\sin\frac{\sigma^2}{2A^2}\,\mathrm d\sigma.$$
          Ces intégrales ne s'expriment pas avec des fonctions usuelles : on les relie aux intégrales de Fresnel. Pour $\alpha\ll1$, $\cos\alpha\simeq1-\dfrac{\alpha^2}2$ et $\sin\alpha\simeq\alpha$ :
          $$\boxed{x\simeq s-\frac{s^5}{40A^4}\simeq s},\qquad\boxed{y\simeq\frac{s^3}{6A^2}}.$$
          Donc $y\simeq\dfrac{x^3}{6A^2}$ : une {\bf parabole cubique}, expression utilisée en topographie pour le tracé. À $s=L$ : $y(L)\simeq\dfrac{L^3}{6A^2}=\dfrac{L^2}{6R_f}$.

  - id: q2
    enonce: |
      {\bf 2/ Cinématique et confort.} Le véhicule parcourt la clothoïde à vitesse $v$ constante, avec $s=vt$.
      \begin{enumerate}[label=(\alph*),start=3]
          \item Calculer $a_T$, $a_N$ en fonction de $t$ et le vecteur accélération dans la base de Frenet. Montrer que le jerk latéral $j=\dfrac{\mathrm da_N}{\mathrm dt}$ est constant et vaut $\dfrac{v^3}{A^2}$.
          \item Comparer à un raccordement brutal droite $\to$ cercle de rayon $R_f$ : quelle est la valeur de $a_N$ juste après le raccord ? Quel est le jerk ?
      \end{enumerate}
    coup_de_pouce: |
      $v=$ cte donc $a_T=0$ et $a_N=v^2/R=v^2s/A^2$ avec $s=vt$.
    correction: |
      (c) $a_T=0$, $a_N=\dfrac{v^3t}{A^2}$, $j=\dfrac{v^3}{A^2}$ constant. (d) Brutal : $a_N$ passe de $0$ à $\dfrac{v^2}{R_f}$ en $\Delta t\to0$ : jerk infini (en pratique très élevé).
    solution:
      - titre: "(c) Accélération et jerk"
        texte: |
          $v$ constante donc $a_T=\dot v=0$ et
          $$\boxed{\vec a=\frac{v^2}{R}\,\vec n=\frac{v^2s}{A^2}\,\vec n=\frac{v^3t}{A^2}\,\vec n}.$$
          L'accélération normale croît {\bf linéairement avec le temps} ; son taux de variation est le jerk latéral :
          $$\boxed{j=\frac{\mathrm da_N}{\mathrm dt}=\frac{v^3}{A^2}}=\text{cte}.$$
          Dimension : $[v^3/A^2]=\mathrm{L^3T^{-3}/L^2}=\mathrm{LT^{-3}}$ $\surd$.
      - titre: "(d) Comparaison avec un raccordement brutal"
        texte: |
          Sans raccordement : $a_N=0$ sur la droite, puis $a_N=\dfrac{v^2}{R_f}$ dès l'entrée sur le cercle. Le saut est instantané : $j\to\infty$ (en pratique, l'effet est limité par la souplesse de la direction et de la suspension, mais l'à-coup est brutal : la voiture « se jette » de côté). Avec la clothoïde, $a_N$ monte de $0$ à $v^2/R_f$ en la durée $\dfrac Lv$ avec une pente constante $j$ : le conducteur tourne son volant à vitesse {\bf constante}, ce qui est naturel.

  - id: q3
    enonce: |
      {\bf 3/ Dimensionnement.} Une route est conçue pour $v=90\ \mathrm{km/h}$, avec un virage de rayon $R_f=300\ \mathrm m$ et un jerk latéral maximal admissible $j_{\max}=0{,}6\ \mathrm{m\,s^{-3}}$.
      \begin{enumerate}[label=(\alph*),start=5]
          \item Calculer le paramètre $A$ de la clothoïde, la longueur $L$ de raccordement, sa durée de parcours, l'accélération normale finale et l'angle total dont la route a tourné à la fin du raccordement.
          \item Calculer le décalage latéral $y(L)$ de la route par rapport à la tangente initiale.
          \item Mêmes questions pour $130\ \mathrm{km/h}$ avec le même $j_{\max}$ et le même $R_f$ (autoroute). Commenter.
      \end{enumerate}
    coup_de_pouce: |
      $j=v^3/A^2$ donc $A^2=v^3/j$ ; $L=A^2/R_f$ ; $a_{N,f}=v^2/R_f$ ; $\alpha_f=\dfrac L{2R_f}$ ; $y(L)\simeq\dfrac{L^2}{6R_f}$.
    correction: |
      $v=25\ \mathrm{m/s}$ : $A^2=26\,042\ \mathrm{m^2}$, $A\approx161\ \mathrm m$, $L\approx86{,}8\ \mathrm m$, $\Delta t=3{,}47\ \mathrm s$, $a_{N,f}=2{,}08\ \mathrm{m\,s^{-2}}$, $\alpha_f\approx0{,}145\ \mathrm{rad}=8{,}3^\circ$, $y(L)\approx4{,}2\ \mathrm m$. À $130\ \mathrm{km/h}$ : $L\approx262\ \mathrm m$ ($\times3$).
    solution:
      - titre: "(e) Paramètres de la clothoïde"
        texte: |
          $v=\dfrac{90}{3{,}6}=25\ \mathrm{m/s}$. $A^2=\dfrac{v^3}{j_{\max}}=\dfrac{15\,625}{0{,}6}\approx2{,}60\times10^4\ \mathrm{m^2}$, soit $\boxed{A\approx161\ \mathrm m}$. Longueur : $\boxed{L=\dfrac{A^2}{R_f}=\dfrac{26\,042}{300}\approx87\ \mathrm m}$ ; durée $\Delta t=\dfrac Lv\approx3{,}5\ \mathrm s$. Accélération normale finale : $\dfrac{v^2}{R_f}=\dfrac{625}{300}\approx2{,}08\ \mathrm{m\,s^{-2}}$ (cohérent : $j\,\Delta t=0{,}6\times3{,}47=2{,}08$ $\surd$). Angle de déviation : $\alpha_f=\dfrac L{2R_f}\approx0{,}145\ \mathrm{rad}\approx8{,}3^\circ$.
      - titre: "(f) Décalage latéral"
        texte: |
          $y(L)\simeq\dfrac{L^3}{6A^2}=\dfrac{L^2}{6R_f}=\dfrac{(86{,}8)^2}{1\,800}\approx\boxed{4{,}2\ \mathrm m}$ (valeur exacte par intégration numérique : $4{,}18\ \mathrm m$, écart $<0{,}2\ \%$). Le décalage latéral de $4{,}2\ \mathrm m$ correspond à la largeur d'une voie : c'est l'ordre de grandeur du {\bf ripage} (décalage latéral) que le tracé doit prévoir dans l'emprise de la route.
      - titre: "(g) Autoroute"
        texte: |
          $v=\dfrac{130}{3{,}6}\approx36{,}1\ \mathrm{m/s}$ ; $A^2=\dfrac{v^3}j\approx7{,}8\times10^4\ \mathrm{m^2}$ ; $L=\dfrac{A^2}{R_f}\approx261\ \mathrm m$, soit $(36{,}1/25)^3\approx3{,}0$ fois plus long : la longueur de raccordement croît comme $v^3$ (à $j$ et $R_f$ fixés) ; la durée de parcours $L/v\approx7{,}2\ \mathrm s$ croît comme $v^2$. Mais ici $a_{N,f}=v^2/R_f\approx4{,}3\ \mathrm m/s^2$ (soit $0{,}44\,g$) est déjà proche de la limite d'adhérence en conditions humides : on voit pourquoi les rayons minimaux augmentent avec la vitesse de conception ($R_f\gtrsim v^2/a_{\max}$).

  - id: q4
    enonce: |
      {\bf 4/ (*) Python.} Tracer la clothoïde avec \texttt{scipy.special.fresnel} pour $A=161\ \mathrm m$ et $s\in[0,L]$. Superposer, aux points $s=L/4,\ L/2,\ L$ : $\vec\tau$, $\vec n$ et le cercle osculateur. Vérifier numériquement $y(L)$ et le comparer à $L^2/(6R_f)$.
    coup_de_pouce: |
      Avec $u=\dfrac s{A\sqrt\pi}$ : $x=A\sqrt\pi\,C(u)$, $y=A\sqrt\pi\,S(u)$ ; \texttt{S,C=fresnel(u)}. Centre du cercle : $M+R\,\vec n$ avec $\vec n=(-\sin\alpha,\cos\alpha)$.
    correction: |
      Résultat attendu : $x(L)\approx86{,}6\ \mathrm m$, $y(L)\approx4{,}18\ \mathrm m$ ; $L^2/6R_f=4{,}19\ \mathrm m$.
    solution:
      - titre: "Script"
        texte: |
          \begin{verbatim}
          import numpy as np, matplotlib.pyplot as plt
          from scipy.special import fresnel
          A = 161.4; Rf = 300; L = A**2/Rf
          s = np.linspace(0, L, 400)
          S, C = fresnel(s/(A*np.sqrt(np.pi)))
          x, y = A*np.sqrt(np.pi)*C, A*np.sqrt(np.pi)*S
          alpha = s**2/(2*A**2); R = A**2/np.maximum(s, 1e-9)
          for sk in (L/4, L/2, L):
              i = np.argmin(abs(s-sk))
              n = np.array([-np.sin(alpha[i]), np.cos(alpha[i])])
              c = np.array([x[i], y[i]]) + R[i]*n
              plt.gca().add_patch(plt.Circle(c, R[i], fill=False, ls='--'))
          plt.plot(x, y); plt.axis('equal'); plt.show()
          print(x[-1], y[-1], L**2/(6*Rf))
          \end{verbatim}
