id: td3_ex8
intitule: "Tir parabolique vu dans la base de Frenet"
td: td3
facultatif: false
seance: 3

cours_rattache:
  - cinematique.base_frenet
  - cinematique.acceleration_tangentielle_normale
  - cinematique.rayon_courbure

metadonnees:
  duree_estimee: "35 min"
  difficulte: 3
  priorite: 4
  type_exercice: "Entraînement / Application"
  indispensable: false

enonce_intro: |
  Un projectile est lancé du sol, à l'instant $t=0$, depuis l'origine $O$, avec une vitesse de norme $v_0$ faisant l'angle
  $\alpha_0$ avec l'horizontale $Ox$ (l'axe $Oy$ est vertical vers le haut). Il n'est soumis qu'à la pesanteur : son
  accélération est le vecteur constant $\vec a=-g\,\vec u_y$ (résistance de l'air négligée). On étudie ce mouvement
  dans la base de Frenet.

prerequis:
  - titre: "Mouvement dans un champ de pesanteur uniforme"
    texte: |
      $x=v_0\cos\alpha_0\,t$, $y=v_0\sin\alpha_0\,t-\tfrac12gt^2$ ; $\vec v=(v_0\cos\alpha_0\ ;\ v_0\sin\alpha_0-gt)$.
  - titre: "Composantes tangentielle et normale"
    texte: |
      $a_T=\dfrac{\vec a\cdot\vec v}v$, $a_N=\dfrac{|a_xv_y-a_yv_x|}v$, $R=\dfrac{v^2}{a_N}$.
  - titre: "Angle de la vitesse avec l'horizontale"
    texte: |
      On note $\varphi(t)$ l'angle (signé) de $\vec v$ avec $Ox$ : $\tan\varphi=\dfrac{v_y}{v_x}$. Au départ $\varphi=\alpha_0$, au sommet $\varphi=0$, à l'arrivée $\varphi=-\alpha_0$.

objectifs_pedagogiques_etudiants:
  - titre: "Lire la décomposition $a_T$, $a_N$ sur un mouvement connu"
    texte: |
      Projeter l'accélération constante $\vec g$ sur $\vec\tau$ et $\vec n$, comprendre pourquoi $a_T$ et $a_N$ varient alors que $\vec a$ est constant, calculer le rayon de courbure en tout point et identifier où il est minimal.

objectifs_pedagogiques_enseignants:
  - titre: "Réconcilier Frenet et le cas le plus connu"
    texte: |
      Les étudiants connaissent le tir parabolique mais pas l'interprétation de $a_T$ (vitesse qui diminue en montée, augmente en descente) et de $a_N$ (courbure de la trajectoire). C'est un exercice court, utilisable comme application directe du cours dès le début du TD. La formule $R=\dfrac{v_x^2}{g\cos^3\varphi}$ est la plus élégante : elle montre que la courbure est maximale au sommet.

point_cours:
  - titre: "Projection de $\\vec g$ sur la base de Frenet"
    texte: |
      Si $\varphi$ est l'angle de $\vec v$ avec l'horizontale, $\vec\tau=(\cos\varphi,\sin\varphi)$ et $\vec n=(-\sin\varphi,\cos\varphi)$. En prenant $\vec n=(\sin\varphi,-\cos\varphi)$ vers le bas (côté concave, perpendiculaire à $\vec\tau$), $\vec g=-g\,\vec u_y$ donne $a_T=\vec g\cdot\vec\tau=-g\sin\varphi$ et $a_N=\vec g\cdot\vec n=+g\cos\varphi\ge0$.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Penser que $a_N=g$ car $\\vec g$ est vertical"
    texte: |
      Seule la composante de $\vec g$ perpendiculaire à $\vec v$ est $a_N$ : $a_N=g\cos\varphi\le g$, égale à $g$ seulement au sommet où $\vec v$ est horizontal.
  - titre: "Penser que $a_T=0$ au sommet entraîne $\\vec a=\\vec0$"
    texte: |
      Au sommet, $a_T=0$ mais $a_N=g$ : l'accélération est entièrement normale (vers le bas). La vitesse ne change pas de norme mais change de direction.
  - titre: "Oublier que $v_x$ est constant"
    texte: |
      $v_x=v_0\cos\alpha_0$ ne change pas. Cela donne $v=\dfrac{v_x}{\cos\varphi}$ : plus l'angle est grand en valeur absolue, plus la vitesse est grande.
  - titre: "Confondre $\\alpha_0$ et $\\varphi$"
    texte: |
      $\alpha_0$ est l'angle de lancement ; $\varphi(t)$ est l'angle instantané de la vitesse avec l'horizontale, qui varie de $+\alpha_0$ à $-\alpha_0$.

remarques_pedagogiques_conseils_animation:
  - titre: "Faire placer $a_T$ et $a_N$ au tableau"
    texte: |
      Sur une parabole, dessiner $\vec g$ (vertical vers le bas) à trois points (montée, sommet, descente) et le décomposer sur $\vec\tau$ et $\vec n$ : en montée $a_T<0$ (ralentit), au sommet $a_T=0$, en descente $a_T>0$ (accélère). $a_N$ est maximal ($=g$) au sommet.
  - titre: "Jet d'eau"
    texte: |
      Observer un jet d'eau (fontaine, tuyau) : le « rayon de courbure » au sommet est $v_x^2/g$ ; en augmentant l'inclinaison du jet pour une même vitesse, le jet « s'affine ».

bilan:
  - titre: "Tir parabolique et Frenet"
    texte: |
      $a_T=-g\sin\varphi=-g\dfrac{v_y}v$, $a_N=g\cos\varphi=g\dfrac{v_x}v$, $R=\dfrac{v^2}{a_N}=\dfrac{v^3}{g\,v_x}=\dfrac{v_x^2}{g\cos^3\varphi}$. Sommet : $a_T=0$, $a_N=g$, $R_{\min}=\dfrac{v_x^2}g=\dfrac{v_0^2\cos^2\alpha_0}g$. Départ : $R=\dfrac{v_0^2}{g\cos\alpha_0}$. Pour $v_0=20\ \mathrm{m/s}$, $\alpha_0=60^\circ$ : $R_{\min}=10{,}2\ \mathrm m$, $R(0)=81{,}5\ \mathrm m$.

aller_plus_loin:
  - niveau: cpge
    titre: "Courbe de sûreté et portée"
    texte: |
      Montrer que, à $v_0$ fixée, le rayon de courbure initial $R(0)=\dfrac{v_0^2}{g\cos\alpha_0}$ est minimal pour $\alpha_0=0$ (tir horizontal) et tend vers l'infini pour $\alpha_0\to90^\circ$ (tir vertical : la trajectoire est une droite). Interpréter.
  - niveau: licence
    titre: "Énergie et vitesse"
    texte: |
      Avec $v^2=v_0^2-2gy$, montrer que $R(y)=\dfrac{(v_0^2-2gy)^{3/2}}{g\,v_0\cos\alpha_0}$ : le rayon de courbure ne dépend que de l'altitude. Retrouver le sommet ($y_s=\dfrac{v_0^2\sin^2\alpha_0}{2g}$) et vérifier $R_{\min}=\dfrac{v_x^2}{g}$.
  - niveau: master
    titre: "Trajectoire avec frottement"
    texte: |
      Avec un frottement visqueux $-\lambda\vec v$, l'accélération n'est plus constante et la trajectoire n'est plus parabolique (elle devient asymétrique avec un sommet plus proche de la fin). Écrire $a_T$ et $a_N$ avec $\vec a=\vec g-\lambda\vec v/m$ et montrer que le rayon de courbure au sommet est $R=v_{\rm somm}^2/g$ (avec la vitesse au sommet, plus petite que $v_0\cos\alpha_0$).

accroche_point_cours_essentiel:
  - titre: "Au sommet d'un lancer, que vaut l'accélération ?"
    duree_introduction: "3 à 5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Une balle monte puis redescend : à son sommet, sa vitesse verticale est nulle. A-t-elle une accélération nulle ? Est-elle plus ou moins courbée en haut qu'au départ ? À quel moment la balle va-t-elle le plus lentement ?
    texte: |
      {\bf Idée clé : l'accélération $\vec g$ est constante mais se projette différemment sur la tangente et la normale à chaque instant.} Au sommet, $\vec v\perp\vec g$ : toute l'accélération est normale, la trajectoire est la plus courbée. En montée, $\vec g$ a une composante opposée à $\vec v$ ($a_T<0$) ; en descente, de même sens ($a_T>0$).

outils_mathematiques:
  - titre: "Projection d'un vecteur constant sur une base tournante"
    texte: |
      $\vec g=-g\,\vec u_y$ ; avec $\vec\tau=(\cos\varphi,\sin\varphi)$ et $\vec n=(\sin\varphi,-\cos\varphi)$ (vers le bas, côté concave) : $\vec g\cdot\vec\tau=-g\sin\varphi$ et $\vec g\cdot\vec n=g\cos\varphi$.
  - titre: "Relation $v\\cos\\varphi=v_x$"
    texte: |
      $v_x=v\cos\varphi$ est conservé donc $v=\dfrac{v_x}{\cos\varphi}$ et $\cos\varphi=\dfrac{v_x}v$, $\sin\varphi=\dfrac{v_y}v$.
  - titre: "Instants remarquables"
    texte: |
      Sommet : $t_s=\dfrac{v_0\sin\alpha_0}g$ ; durée totale : $2t_s$ ; portée : $\dfrac{v_0^2\sin2\alpha_0}g$.

liens_autres_disciplines:
  - discipline: "Sport"
    texte: |
      Lancer de poids, de javelot, de ballon (football, basket) : la balle est la plus courbée au sommet, elle ralentit en montée et accélère en descente.
  - discipline: "Balistique et ingénierie"
    texte: |
      Jets d'eau (pompiers, fontaines), canons à eau, arrosage : forme de la nappe et portée ; ordres de grandeur du rayon de courbure du jet.
  - discipline: "Astronomie"
    texte: |
      Un projectile lancé avec une vitesse horizontale $v_x=\sqrt{gR_T}\approx7{,}9\ \mathrm{km/s}$ à haute altitude suit une trajectoire dont le rayon de courbure au sommet vaut $R_T$ : c'est la vitesse orbitale circulaire (Newton).

schemas_proposes:
  - titre: "Trajectoire parabolique avec $a_T$ et $a_N$ en trois points"
    description: |
      Parabole du tir ($v_0=20\ \mathrm{m/s}$, $\alpha_0=60^\circ$), trois points : $t=0{,}75\ \mathrm s$ (montée à $45^\circ$), sommet ($t=1{,}77\ \mathrm s$), $t=2{,}78\ \mathrm s$ (descente à $-45^\circ$). En chaque point : $\vec v$ (tangent), $\vec g$ (vertical vers le bas), $\vec\tau$, $\vec n$ (vers le bas du côté concave) et la décomposition de $\vec g$ en $a_T\,\vec\tau$ et $a_N\,\vec n$. Au sommet, tracer le cercle osculateur de rayon $R_{\min}=10{,}2\ \mathrm m$ (centre sous le sommet).
    tikz: |
      \begin{tikzpicture}[>=stealth,scale=0.5]
        \draw[->] (-0.5,0)--(14,0) node[right]{$x$};
        \draw[->] (0,-0.5)--(0,6) node[above]{$y$};
        % trajectoire y = x tan(60) - g x^2 /(2 v0^2 cos^2 60), v0=20, g=9.81 (unités m)
        \draw[thick,domain=0:35.3,samples=100] plot ({\x/3},{(\x*1.732-0.04905*\x*\x)/3});
        % sommet vers x = 17.7 m -> 5.9 (échelle 1/3)
        \fill (5.9,5.1) circle (2pt) node[above]{sommet};
        \draw[->,thick,red] (5.9,5.1)--++(1.5,0) node[right]{$\vec v$};
        \draw[->,thick,blue] (5.9,5.1)--++(0,-1.5) node[below]{$\vec g=a_N\vec n$};
        \draw[dashed] (5.9,1.7) circle (3.4);
      \end{tikzpicture}

questions:
  - id: q1
    enonce: |
      {\bf 1/ Composantes de l'accélération.}
      \begin{enumerate}[label=(\alph*)]
          \item Écrire $\vec v(t)$ et $v(t)$. Exprimer l'angle $\varphi(t)$ de $\vec v$ avec l'horizontale.
          \item Calculer $a_T(t)$ et $a_N(t)$. En quels instants $a_T=0$ ? Comment varie $a_T$ ? Que vaut $a_N$ au sommet ? Vérifier $a_T^2+a_N^2=g^2$.
          \item Interpréter physiquement le signe de $a_T$ en montée et en descente.
      \end{enumerate}
    coup_de_pouce: |
      $\vec a=(0;-g)$, $\vec v=(v_x;v_y)$ avec $v_x=v_0\cos\alpha_0$, $v_y=v_0\sin\alpha_0-gt$. Utilisez $a_T=\vec a\cdot\vec v/v$ et $a_N=|a_xv_y-a_yv_x|/v$.
    correction: |
      $a_T=-\dfrac{g\,v_y}v=-g\sin\varphi$, $a_N=\dfrac{g\,v_x}v=g\cos\varphi$ ; $a_T=0$ au sommet ($v_y=0$) où $a_N=g$.
    solution:
      - titre: "(a) Vitesse et angle"
        texte: |
          $\vec v=(v_x\ ;\ v_y)$, $v_x=v_0\cos\alpha_0$ constant, $v_y=v_0\sin\alpha_0-gt$ :
          $$v=\sqrt{v_0^2\cos^2\alpha_0+(v_0\sin\alpha_0-gt)^2},\qquad\tan\varphi=\frac{v_0\sin\alpha_0-gt}{v_0\cos\alpha_0}.$$
          L'angle $\varphi$ décroît de $\alpha_0$ (départ) à $0$ (sommet, $t_s=\dfrac{v_0\sin\alpha_0}g$) puis à $-\alpha_0$ (arrivée au sol).
      - titre: "(b) $a_T$ et $a_N$"
        texte: |
          $\vec a\cdot\vec v=-g\,v_y$ donc
          $$\boxed{a_T=-\frac{g\,v_y}v=-g\sin\varphi},\qquad\boxed{a_N=\frac{|a_xv_y-a_yv_x|}v=\frac{g\,v_x}v=g\cos\varphi}.$$
          Vérification : $a_T^2+a_N^2=g^2(\sin^2\varphi+\cos^2\varphi)=g^2$ $\surd$. $a_T=0$ lorsque $v_y=0$, c'est-à-dire au sommet ($t=t_s$), où $\varphi=0$ et $a_N=g$ : toute l'accélération est normale, dirigée vers le bas, centre de courbure sous le sommet. Au départ ($\varphi=\alpha_0$) : $a_T=-g\sin\alpha_0$, $a_N=g\cos\alpha_0$.
      - titre: "(c) Interprétation"
        texte: |
          En {\bf montée} ($v_y>0$, $\varphi>0$) : $a_T<0$, la norme de la vitesse {\bf diminue} (la pesanteur « freine » la montée). Au {\bf sommet} : $a_T=0$, la norme de la vitesse est {\bf minimale} ($v=v_x$). En {\bf descente} ($\varphi<0$) : $a_T>0$, la norme {\bf augmente}. À l'arrivée à la même hauteur qu'au départ, $v=v_0$ (symétrie). $a_N=g\cos\varphi$ est maximal ($=g$) au sommet : la trajectoire y est la plus courbée.

  - id: q2
    enonce: |
      {\bf 2/ Rayon de courbure.}
      \begin{enumerate}[label=(\alph*),start=4]
          \item Établir $R(t)=\dfrac{v^3}{g\,v_x}$ puis $R=\dfrac{v_x^2}{g\cos^3\varphi}$. En déduire le rayon de courbure minimal $R_{\min}$ et son lieu.
          \item Application. $v_0=20\ \mathrm{m/s}$, $\alpha_0=60^\circ$, $g=9{,}81\ \mathrm{m\,s^{-2}}$ : calculer $t_s$, $R_{\min}$, $R(0)$, les instants où $a_T=-a_N$ (angle de $45^\circ$) et la durée totale du vol.
          \item Représenter la trajectoire, $\vec v$, $\vec\tau$, $\vec n$, $a_T\vec\tau$ et $a_N\vec n$ à $t=0{,}75\ \mathrm s$, $t_s$ et $2{,}78\ \mathrm s$, ainsi que le cercle osculateur au sommet.
      \end{enumerate}
    coup_de_pouce: |
      $R=\dfrac{v^2}{a_N}$ avec $a_N=\dfrac{g\,v_x}v$. Puis $v=\dfrac{v_x}{\cos\varphi}$. Pour (e), $a_T=-a_N\iff\tan\varphi=\pm1$ (en valeur absolue $|a_T|=a_N$).
    correction: |
      $R=\dfrac{v^3}{gv_x}=\dfrac{v_x^2}{g\cos^3\varphi}$ ; $R_{\min}=\dfrac{v_x^2}g$ au sommet. AN : $t_s=1{,}77$ s, $R_{\min}=10{,}2$ m, $R(0)=81{,}5$ m, $|a_T|=a_N$ à $t=0{,}75$ s et $2{,}78$ s ; durée totale $3{,}53$ s.
    solution:
      - titre: "(d) Rayon de courbure"
        texte: |
          $$R=\frac{v^2}{a_N}=\frac{v^2}{g\,v_x/v}=\boxed{\frac{v^3}{g\,v_x}}.$$
          Avec $v=v_x/\cos\varphi$ : $\boxed{R=\dfrac{v_x^2}{g\cos^3\varphi}}$. Comme $\cos\varphi\le1$, $R$ est {\bf minimal} quand $\cos\varphi=1$, c'est-à-dire au {\bf sommet} :
          $$\boxed{R_{\min}=\frac{v_x^2}g=\frac{v_0^2\cos^2\alpha_0}g}.$$
          Au départ : $R(0)=\dfrac{R_{\min}}{\cos^3\alpha_0}=\dfrac{v_0^2}{g\cos\alpha_0}$. Limite $\varphi\to\pm90^\circ$ : $R\to\infty$ (trajectoire quasi rectiligne).
      - titre: "(e) Application numérique"
        texte: |
          $v_x=20\cos60^\circ=10\ \mathrm{m/s}$ ; $v_{y0}=20\sin60^\circ=17{,}3\ \mathrm{m/s}$. $t_s=\dfrac{17{,}3}{9{,}81}\approx\boxed{1{,}77\ \mathrm s}$ ; durée totale $2t_s\approx3{,}53\ \mathrm s$. $R_{\min}=\dfrac{100}{9{,}81}\approx\boxed{10{,}2\ \mathrm m}$ ; $R(0)=\dfrac{R_{\min}}{\cos^3(60^\circ)}=\dfrac{10{,}2}{0{,}125}\approx81{,}5\ \mathrm m$. $|a_T|=a_N\iff|v_y|=v_x=10\ \mathrm{m/s}$ : $17{,}3-9{,}81\,t=\pm10$ donne $t=0{,}746\ \mathrm s$ et $t=2{,}785\ \mathrm s$ (angle $\pm45^\circ$, symétriques par rapport au sommet $\surd$). À ces instants $a_T=\mp6{,}94$ et $a_N=6{,}94\ \mathrm{m\,s^{-2}}$ (soit $g/\sqrt2$).
      - titre: "(f) Représentation"
        texte: |
          Parabole d'axe vertical, de sommet à la hauteur $y_s=\dfrac{v_{y0}^2}{2g}\approx15{,}3\ \mathrm m$ et d'abscisse $x_s=v_xt_s\approx17{,}7\ \mathrm m$, de portée $35{,}3\ \mathrm m$. Au sommet : $\vec v$ horizontal, $\vec g$ vertical vers le bas, $\vec n=-\vec u_y$ ; cercle osculateur de centre $(17{,}7;\ 15{,}3-10{,}2)=(17{,}7;\ 5{,}1)$ et de rayon $10{,}2\ \mathrm m$. Aux deux autres points, $\vec g$ se décompose en $a_T\,\vec\tau$ (le long de la trajectoire : vers l'arrière en montée, vers l'avant en descente) et $a_N\,\vec n$ (vers le bas, côté concave) de même norme $6{,}94\ \mathrm{m\,s^{-2}}$.
