id: td2_ex4
intitule: "Mouvement hélicoïdal (extension en 3D)"
td: td2
facultatif: true
seance: 2

cours_rattache:
  - cinematique.coordonnees_cylindriques
  - cinematique.base_cylindrique
  - cinematique.vecteur_vitesse
  - cinematique.vecteur_acceleration

metadonnees:
  duree_estimee: "30 min"
  difficulte: 3
  type_exercice: "Entraînement / Extension 3D"
  indispensable: false

enonce_intro: |
  Dans l'espace muni d'un repère cartésien $Oxyz$, un point $M$ décrit une {\bf hélice circulaire} d'axe $Oz$,
  d'équations horaires (en coordonnées cylindriques)
  $$\begin{cases}r(t)=a\\\theta(t)\\z(t)=h\,\theta(t)\end{cases}$$
  où $a$ et $h$ sont des paramètres constants et $\theta(t)$ est l'angle entre $Ox$ et $\overrightarrow{Om}$,
  $m$ étant la projection du point $M$ sur le plan $Oxy$. On note $\dot\theta$ la vitesse angulaire.

prerequis:
  - titre: "Base cylindrique"
    texte: |
      La base cylindrique $(\vec u_r,\vec u_\theta,\vec k)$ est la base polaire du plan $Oxy$ complétée par l'axe fixe $\vec k$ de $Oz$. Le vecteur position est $\overrightarrow{OM}=r\,\vec u_r+z\,\vec k$, avec $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$, $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$ et $\dfrac{\mathrm d\vec k}{\mathrm dt}=\vec0$.

objectifs_pedagogiques_etudiants:
  - titre: "Étendre la cinématique polaire à la 3D"
    texte: |
      Savoir qu'en coordonnées cylindriques on ajoute simplement une composante selon l'axe fixe $\vec k$, calculer $\vec v$ et $\vec a$ d'un mouvement hélicoïdal, et exploiter une propriété géométrique (angle constant avec le plan $Oxy$).

objectifs_pedagogiques_enseignants:
  - titre: "Un seul ingrédient nouveau : l'axe $\\vec k$ ne tourne pas"
    texte: |
      Les étudiants maîtrisent la base polaire. L'exercice montre que passer à la 3D n'ajoute qu'un terme $\dot z\,\vec k$ à la vitesse et $\ddot z\,\vec k$ à l'accélération. Les questions (c) et (d) entraînent à {\bf raisonner sur les composantes} : angle constant, vecteur accélération horizontal et dirigé vers l'axe.

point_cours:
  - titre: "Cinématique en coordonnées cylindriques"
    texte: |
      $$\overrightarrow{OM}=r\,\vec u_r+z\,\vec k,\qquad\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta+\dot z\,\vec k,$$
      $$\vec a=\left(\ddot r-r\dot\theta^2\right)\vec u_r+\left(r\ddot\theta+2\dot r\dot\theta\right)\vec u_\theta+\ddot z\,\vec k.$$

remarques_pedagogiques_ecueils_classiques:
  - titre: "Confondre la coordonnée polaire $\\theta$ et l'angle de la vitesse avec l'horizontale"
    texte: |
      $\theta$ repère la position de $m$ dans le plan $Oxy$ ; l'angle $\alpha$ de $\vec v$ avec le plan $Oxy$ est un autre angle, défini par $\tan\alpha=v_z/\|\vec v_\perp\|$, qui vaut ici $h/a$.
  - titre: "Oublier que $h$ est une longueur par radian"
    texte: |
      $z=h\theta$ avec $\theta$ en radians : $[h]=\mathrm L$ (le radian est sans dimension). Le {\bf pas} de l'hélice (montée en un tour) vaut $2\pi h$, et non $h$.
  - titre: "Penser que $\\vec a$ est nul si $\\|\\vec v\\|$ est constant"
    texte: |
      Un mouvement hélicoïdal uniforme a quand même une accélération : $\vec a=-a\dot\theta^2\vec u_r$ (centripète). C'est la même situation que pour le cercle.

remarques_pedagogiques_conseils_animation:
  - titre: "Faire manipuler une vraie hélice"
    texte: |
      Un ressort, un tire-bouchon ou un escalier en colimaçon (ou une feuille enroulée autour d'un cylindre) permettent de visualiser que l'hélice est une droite qui s'enroule : la pente est constante, d'où l'angle constant de la question (c).

bilan:
  - titre: "L'hélice, c'est un cercle plus une montée régulière"
    texte: |
      $$\vec v=\dot\theta\,(a\,\vec u_\theta+h\,\vec k),\qquad\|\vec v\|=|\dot\theta|\sqrt{a^2+h^2},\qquad\tan\alpha=\frac ha.$$
      Si $\dot\theta$ est constant, $\|\vec v\|$ est constant et $\vec a=-a\dot\theta^2\,\vec u_r$ est horizontale et dirigée vers l'axe $Oz$ : la composante verticale ne modifie pas l'accélération, comme au tir vertical à vitesse verticale constante.

aller_plus_loin:
  - niveau: licence
    titre: "Courbure et torsion de l'hélice"
    texte: |
      Pour un mouvement uniforme, l'accélération est normale : $\|\vec a\|=v^2/\rho$ donne le {\bf rayon de courbure} $\rho=\dfrac{a^2+h^2}{a}$ (qui vaut $a$ pour $h=0$, le cercle, et tend vers l'infini quand $a\to0$ ou $h\to\infty$, la droite). La {\bf torsion} de l'hélice, mesurant son écart au plan, vaut $\dfrac{h}{a^2+h^2}$. Une hélice a donc une courbure et une torsion constantes.
  - niveau: master
    titre: "Particule chargée dans un champ magnétique uniforme"
    texte: |
      Une particule de charge $q$ et de masse $m$ dans un champ $\vec B=B\,\vec k$ avec une vitesse $v_\perp$ perpendiculaire et $v_\parallel$ parallèle à $\vec B$ décrit une hélice d'axe $\vec B$, de rayon $a=\dfrac{mv_\perp}{|q|B}$, de pulsation $\omega_c=\dfrac{|q|B}m$ et de pas $2\pi\dfrac{v_\parallel}{\omega_c}$. Identifier les paramètres $a$ et $h=v_\parallel/\omega_c$ de l'exercice, et expliquer le guidage des particules chargées le long des lignes de champ (aurores polaires, confinement magnétique).

accroche_point_cours_essentiel:
  - titre: "Une trajectoire qui monte en tournant"
    duree_introduction: "3 à 5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Un ressort, une vis, un escalier en colimaçon, la molécule d'ADN : la trajectoire d'un point qui tourne autour d'un axe tout en avançant le long de cet axe est une {\bf hélice}. Si l'on déroule le cylindre sur lequel elle est tracée, que devient-elle ? Et l'inclinaison de la vitesse, est-elle constante ?
    texte: |
      {\bf Idée clé : en coordonnées cylindriques, on ajoute à la base polaire un axe fixe $\vec k$.} La vitesse gagne une composante $\dot z\,\vec k$, l'accélération une composante $\ddot z\,\vec k$ :
      $$\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta+\dot z\,\vec k.$$
      Pour l'hélice ($r=a$, $z=h\theta$) : $\vec v=\dot\theta\,(a\,\vec u_\theta+h\,\vec k)$. La composante horizontale ($a\dot\theta$) et la composante verticale ($h\dot\theta$) sont proportionnelles : {\bf l'inclinaison de la vitesse est constante}.

outils_mathematiques:
  - titre: "Dérivée composée et dérivée d'un produit"
    texte: |
      $z=h\theta(t)$ donne $\dot z=h\dot\theta$ et $\ddot z=h\ddot\theta$ ($h$ constant). Même règle que pour toute fonction d'une fonction du temps.
  - titre: "Pythagore dans l'espace"
    texte: |
      $\vec u_\theta$ et $\vec k$ sont orthogonaux et unitaires : $\|a\dot\theta\,\vec u_\theta+h\dot\theta\,\vec k\|=|\dot\theta|\sqrt{a^2+h^2}$.
  - titre: "Angle entre un vecteur et un plan"
    texte: |
      L'angle $\alpha$ entre $\vec v$ et le plan $Oxy$ est celui entre $\vec v$ et sa projection horizontale : $\tan\alpha=\dfrac{v_z}{\|\vec v_{\text{horizontale}}\|}=\dfrac{h\dot\theta}{a\dot\theta}=\dfrac ha$. On retrouve l'idée de pente : $\alpha=\arctan(h/a)$.
  - titre: "Hélice et cylindre déroulé"
    texte: |
      Si l'on déroule le cylindre en un rectangle, $\theta$ devient l'abscisse curviligne $a\theta$, et l'hélice devient la droite $z=\dfrac ha\,(a\theta)$ : une droite de pente $h/a$. La longueur de l'hélice entre deux tours est $2\pi\sqrt{a^2+h^2}$ (Pythagore sur le triangle $2\pi a$, $2\pi h$).
  - titre: "Produit scalaire et orthogonalité"
    texte: |
      $\vec a\cdot\vec v=0$ si $\|\vec v\|$ est constante : $\tfrac12\dfrac{\mathrm d}{\mathrm dt}\|\vec v\|^2=\vec a\cdot\vec v$. En 3D comme en 2D, un mouvement uniforme a une accélération normale à la trajectoire.

liens_autres_disciplines:
  - discipline: "Mathématiques (géométrie différentielle)"
    texte: |
      L'hélice est la courbe de l'espace de courbure et de torsion constantes. Elle se déroule en une droite sur le cylindre : on utilise la notion de longueur d'arc et de développable.
  - discipline: "Électromagnétisme"
    texte: |
      Une particule chargée dans un champ magnétique uniforme décrit une hélice autour des lignes de champ (aurores polaires, cyclotron, tokamak) : $a$ est le rayon de Larmor et le pas dépend de la vitesse parallèle à $\vec B$.
  - discipline: "Biologie et chimie"
    texte: |
      La double hélice de l'ADN a un rayon d'environ $1$ nm et un pas d'environ $3{,}4$ nm : $h=\dfrac{3{,}4}{2\pi}\approx0{,}54$ nm, soit $\tan\alpha=h/a\approx0{,}54$ et $\alpha\approx28^\circ$.
  - discipline: "Mécanique et technologie"
    texte: |
      Une vis ou un tire-bouchon transforme une rotation en translation avec le {\bf pas} $2\pi h$. L'angle d'hélice d'un filetage ou d'un engrenage hélicoïdal est défini par $\tan\alpha=h/a$.

questions:
  - id: q1
    enonce: |
      (a) Compléter la figure avec les données du problème : représenter l'axe $Oz$, le point $M$, sa projection $m$ sur $Oxy$, les coordonnées cylindriques $(r,\theta,z)$ et la base $(\vec u_r,\vec u_\theta,\vec k)$.
    coup_de_pouce: |
      $\overrightarrow{OM}=\overrightarrow{Om}+\overrightarrow{mM}$ avec $\overrightarrow{Om}=a\,\vec u_r$ et $\overrightarrow{mM}=z\,\vec k$.
    correction: |
      $\overrightarrow{OM}=a\,\vec u_r+h\theta\,\vec k$ ; $\vec u_r$ dirigé de $O$ vers $m$, $\vec u_\theta$ perpendiculaire à $\vec u_r$ dans le plan horizontal, $\vec k$ vertical ascendant.
    solution:
      - titre: "(a) Construction de la figure"
        texte: |
          On trace le cylindre d'axe $Oz$ et de rayon $a$. Le point $m$ est la projection de $M$ sur $Oxy$, à la distance $a$ de $O$, à l'angle $\theta$ de $Ox$. On trace alors :
          \begin{itemize}
            \item $\vec u_r$ : horizontal, de $O$ vers $m$ (direction radiale) ;
            \item $\vec u_\theta$ : horizontal, perpendiculaire à $\vec u_r$, dans le sens des $\theta$ croissants ;
            \item $\vec k$ : vertical, vers le haut ; $\overrightarrow{mM}=z\,\vec k$ avec $z=h\theta$.
          \end{itemize}
          Le vecteur position est $\overrightarrow{OM}=a\,\vec u_r+h\theta\,\vec k$. Quand $\theta$ augmente de $2\pi$, le point revient à la même position $m$ mais à l'altitude $2\pi h$ plus haute : c'est le {\bf pas} de l'hélice.

  - id: q2
    enonce: |
      (b) Établir l'expression du vecteur vitesse $\vec v$ et du vecteur accélération $\vec a$ de $M$ et leur norme.
    coup_de_pouce: |
      Dérivez $\overrightarrow{OM}=a\,\vec u_r+h\theta\,\vec k$ par rapport au temps. $a$, $h$ et $\vec k$ sont constants ; seuls $\vec u_r$ et $\theta$ varient.
    correction: |
      $\vec v=a\dot\theta\,\vec u_\theta+h\dot\theta\,\vec k$, $\|\vec v\|=|\dot\theta|\sqrt{a^2+h^2}$ ; $\vec a=-a\dot\theta^2\,\vec u_r+a\ddot\theta\,\vec u_\theta+h\ddot\theta\,\vec k$, $\|\vec a\|=\sqrt{a^2\dot\theta^4+(a^2+h^2)\ddot\theta^2}$.
    solution:
      - titre: "(b) Vecteur vitesse"
        texte: |
          $$\vec v=a\,\frac{\mathrm d\vec u_r}{\mathrm dt}+h\dot\theta\,\vec k=\boxed{a\dot\theta\,\vec u_\theta+h\dot\theta\,\vec k}.$$
          Les vecteurs $\vec u_\theta$ et $\vec k$ sont orthogonaux et unitaires :
          $$\|\vec v\|=\boxed{|\dot\theta|\sqrt{a^2+h^2}}.$$
      - titre: "(b) Vecteur accélération"
        texte: |
          $$\vec a=a\ddot\theta\,\vec u_\theta+a\dot\theta\,\frac{\mathrm d\vec u_\theta}{\mathrm dt}+h\ddot\theta\,\vec k=\boxed{-a\dot\theta^2\,\vec u_r+a\ddot\theta\,\vec u_\theta+h\ddot\theta\,\vec k}.$$
          Les trois composantes étant orthogonales,
          $$\|\vec a\|=\sqrt{a^2\dot\theta^4+a^2\ddot\theta^2+h^2\ddot\theta^2}=\boxed{\sqrt{a^2\dot\theta^4+(a^2+h^2)\,\ddot\theta^2}}.$$
          On retrouve la formule générale du point de cours avec $\dot r=\ddot r=0$ et $\ddot z=h\ddot\theta$.

  - id: q3
    enonce: |
      (c) Montrer que le vecteur vitesse $\vec v$ fait avec le plan $Oxy$ un angle constant.
    coup_de_pouce: |
      Décomposez $\vec v$ en une partie horizontale (dans $Oxy$) et une partie verticale (selon $\vec k$). L'angle avec le plan est celui entre $\vec v$ et sa partie horizontale.
    correction: |
      $\tan\alpha=\dfrac{v_z}{\|\vec v_{\text{hor}}\|}=\dfrac ha$ : indépendant du temps et de $\theta(t)$.
    solution:
      - titre: "(c) Angle avec le plan $Oxy$"
        texte: |
          La partie horizontale de $\vec v$ est $a\dot\theta\,\vec u_\theta$, de norme $a|\dot\theta|$ ; la partie verticale est $h\dot\theta\,\vec k$. L'angle $\alpha$ que fait $\vec v$ avec le plan $Oxy$ vérifie
          $$\tan\alpha=\frac{|h\dot\theta|}{a|\dot\theta|}=\boxed{\frac ha}\qquad\Longleftrightarrow\qquad\sin\alpha=\frac{h}{\sqrt{a^2+h^2}}.$$
          Cette valeur ne dépend ni de $t$, ni de $\theta$, ni de la loi $\theta(t)$ choisie (tant que $\dot\theta\neq0$) : l'angle est constant, ce qui est la propriété caractéristique de l'hélice (pente constante).

  - id: q4
    enonce: |
      (d) Montrer que, si le mouvement est uniforme, la norme du vecteur vitesse $\|\vec v\|$ est constante et que le vecteur accélération passe par l'axe du cylindre et est parallèle au plan $Oxy$.
    coup_de_pouce: |
      Mouvement uniforme signifie $\|\vec v\|=$ cte. Que cela impose-t-il à $\dot\theta$, puis à $\ddot\theta$ ? Reportez dans $\vec a$.
    correction: |
      $\|\vec v\|=|\dot\theta|\sqrt{a^2+h^2}$ constante $\Rightarrow\dot\theta$ constant $\Rightarrow\ddot\theta=0$ et $\vec a=-a\dot\theta^2\,\vec u_r$ : horizontal, dirigé vers l'axe $Oz$.
    solution:
      - titre: "(d) Norme constante"
        texte: |
          Le mouvement est uniforme lorsque $\|\vec v\|$ est constante. Comme $\|\vec v\|=|\dot\theta|\sqrt{a^2+h^2}$ avec $a^2+h^2$ constant et non nul, cela équivaut à $|\dot\theta|=$ cte, donc à $\dot\theta=\omega$ constant et $\ddot\theta=0$. Réciproquement, $\dot\theta$ constant donne $\|\vec v\|$ constante : on a l'équivalence.
      - titre: "(d) Accélération"
        texte: |
          Avec $\ddot\theta=0$, l'expression de la question (b) se réduit à
          $$\boxed{\vec a=-a\omega^2\,\vec u_r},\qquad\|\vec a\|=a\omega^2.$$
          $\vec a$ n'a pas de composante selon $\vec k$ : il est {\bf parallèle au plan $Oxy$}. Il est dirigé selon $-\vec u_r$, c'est-à-dire de $M$ vers le point $(0,0,z)$ de l'axe $Oz$ situé à la même altitude : la droite d'action de $\vec a$ {\bf coupe l'axe du cylindre}, perpendiculairement à celui-ci. On retrouve l'accélération centripète du mouvement circulaire de rayon $a$ : monter à vitesse verticale constante ($\dot z=h\omega$) n'ajoute aucune accélération.
