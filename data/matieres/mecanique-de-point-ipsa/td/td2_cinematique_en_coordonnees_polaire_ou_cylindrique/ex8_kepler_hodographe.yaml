id: td2_ex8
intitule: "Ellipse de Kepler, loi des aires et hodographe"
td: td2
facultatif: true
seance: 2

cours_rattache:
  - cinematique.coordonnees_polaires
  - cinematique.base_polaire
  - cinematique.vecteur_vitesse
  - cinematique.vecteur_acceleration

metadonnees:
  duree_estimee: "50 min"
  difficulte: 5
  priorite: 1
  type_exercice: "Approfondissement / Problème de synthèse"
  indispensable: false

enonce_intro: |
  Une planète $M$ décrit, autour du Soleil placé en $O$ (foyer de l'orbite), une ellipse d'équation polaire
  $$r(\theta)=\frac p{1+e\cos\theta},\qquad0\le e<1,$$
  où $p$ (le {\bf paramètre}) et $e$ (l'{\bf excentricité}) sont des constantes. Le mouvement est tel que la quantité
  $$C=r^2\dot\theta$$
  (la {\bf constante des aires}) est conservée. On se place dans la base polaire $(\vec u_r,\vec u_\theta)$ et on note
  $\vec u_y$ le vecteur fixe de l'axe $Oy$ (perpendiculaire à l'axe focal $Ox$). Le but est de déterminer toute la
  cinématique de ce mouvement {\bf sans aucune hypothèse sur les forces} : on retrouvera la loi de la force.

prerequis:
  - titre: "Accélération en base polaire"
    texte: |
      $\vec a=(\ddot r-r\dot\theta^2)\,\vec u_r+\dfrac1r\dfrac{\mathrm d}{\mathrm dt}\left(r^2\dot\theta\right)\vec u_\theta$, avec $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$.
  - titre: "Dérivée de $1/(1+e\\cos\\theta)$"
    texte: |
      $\dfrac{\mathrm d}{\mathrm d\theta}\left(\dfrac p{1+e\cos\theta}\right)=\dfrac{p\,e\sin\theta}{(1+e\cos\theta)^2}$. Avec $r=\dfrac p{1+e\cos\theta}$ : $\dfrac{\mathrm dr}{\mathrm d\theta}=\dfrac{r^2}p\,e\sin\theta$.
  - titre: "Composantes de $\\vec u_y$ dans la base polaire"
    texte: |
      $\vec u_y=\sin\theta\,\vec u_r+\cos\theta\,\vec u_\theta$ (projeter $\vec u_y$ sur $\vec u_r$ et $\vec u_\theta$).

objectifs_pedagogiques_etudiants:
  - titre: "Retrouver les lois de Kepler par la cinématique seule"
    texte: |
      Savoir montrer que $r^2\dot\theta=$ cte équivaut à une accélération radiale, calculer $\vec v$ le long de l'ellipse, reconnaître que son extrémité décrit un {\bf cercle} (hodographe), en déduire $\vec a$ en $1/r^2$, les vitesses extrêmes aux apsides et la période, avec une application à la Terre.

objectifs_pedagogiques_enseignants:
  - titre: "Un grand résultat obtenu par un calcul court, une fois la bonne variable choisie"
    texte: |
      Le calcul de $\vec v$ se simplifie spectaculairement en introduisant $\vec u_y$ : $\vec v=\dfrac Cp\left(\vec u_\theta+e\,\vec u_y\right)$. L'hodographe circulaire en découle, puis $\vec a=-\dfrac{C^2}{p\,r^2}\vec u_r$ en une ligne. Faire remarquer qu'{\bf aucune loi de force} n'a été utilisée : la loi en $1/r^2$ est une {\bf conséquence} de la trajectoire et de la loi des aires. Exercice de synthèse, à garder pour les meilleurs groupes ou pour l'introduction au chapitre « mouvement à force centrale ».

point_cours:
  - titre: "Loi des aires"
    texte: |
      $a_\theta=\dfrac1r\dfrac{\mathrm d}{\mathrm dt}(r^2\dot\theta)$ : l'accélération est {\bf radiale} ($a_\theta=0$) si et seulement si $C=r^2\dot\theta$ est constante. L'aire balayée par le rayon vecteur par unité de temps est $\dfrac{\mathrm dA}{\mathrm dt}=\dfrac12r^2\dot\theta=\dfrac C2$ ({\bf vitesse aréolaire}).
  - titre: "Hodographe"
    texte: |
      L'{\bf hodographe} est la courbe décrite par l'extrémité du vecteur vitesse quand on le reporte à partir d'un point fixe. Pour le mouvement circulaire uniforme, c'est un cercle ; pour une ellipse de Kepler, c'est aussi un cercle, mais {\bf non centré} sur l'origine.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Croire que $\\dot\\theta$ est constant"
    texte: |
      Seul $r^2\dot\theta$ est constant : $\dot\theta=C/r^2$ est maximal au périhélie ($r$ minimal), minimal à l'aphélie.
  - titre: "Écrire $\\dot r=r'(\\theta)$"
    texte: |
      Il faut $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dot\theta$ (dérivée composée). Oublier $\dot\theta$ conduit à une vitesse radiale fausse (et non homogène).
  - titre: "Penser que la vitesse est maximale à $\\theta=\\pi/2$"
    texte: |
      $\|\vec v\|^2=\left(\dfrac Cp\right)^2(1+2e\cos\theta+e^2)$ est maximale pour $\cos\theta=1$ : au {\bf périhélie} ($\theta=0$), pas au « milieu » de l'orbite.

remarques_pedagogiques_conseils_animation:
  - titre: "Tracer l'hodographe avec Python"
    texte: |
      Pour $e=0{,}5$, tracer les points $(v_x,v_y)$ le long de l'orbite : on obtient un cercle dont le centre est décalé de $Ce/p$ selon $Oy$. Faire repérer sur le cercle le point correspondant au périhélie ($\theta=0$ : $\vec v=\frac Cp(1+e)\,\vec u_y$, point le plus haut) et celui de l'aphélie ($\theta=\pi$ : $\vec v=-\frac Cp(1-e)\,\vec u_y$, point le plus bas).

bilan:
  - titre: "Kepler sans les forces"
    texte: |
      Loi des aires $\Rightarrow$ $\vec a\parallel\vec u_r$. Pour $r=p/(1+e\cos\theta)$ : $\vec v=\dfrac Cp\left(\vec u_\theta+e\,\vec u_y\right)$, hodographe = cercle de rayon $C/p$ centré en $\dfrac{Ce}p\vec u_y$ ; $\vec a=-\dfrac{C^2}{p\,r^2}\vec u_r$ (attractive, en $1/r^2$) ; $v_{\max}=\dfrac Cp(1+e)$ au périhélie, $v_{\min}=\dfrac Cp(1-e)$ à l'aphélie, $\dfrac{v_{\max}}{v_{\min}}=\dfrac{1+e}{1-e}$ ; $T=\dfrac{2\pi ab}C$.

aller_plus_loin:
  - niveau: licence
    titre: "Troisième loi de Kepler"
    texte: |
      Avec $C^2=\mathcal G M\,p$ (constante de la force), l'aire de l'ellipse est $\pi ab$ avec $b^2=ap$ ; la loi des aires donne $T=\dfrac{2\pi ab}C$. En déduire $\dfrac{T^2}{a^3}=\dfrac{4\pi^2}{\mathcal GM}$.
  - niveau: master
    titre: "Les trois types de coniques et l'énergie"
    texte: |
      Pour $e=1$ (parabole) et $e>1$ (hyperbole), le même calcul donne $\vec v=\dfrac Cp(\vec u_\theta+e\,\vec u_y)$. Montrer que l'hodographe est alors un cercle {\bf passant par $O$} ($e=1$) ou {\bf entourant l'origine} ($e<1$), et que l'origine est {\bf extérieure} au cercle ($e>1$), ce qui permet de classer les trajectoires liées ou de diffusion.

accroche_point_cours_essentiel:
  - titre: "La vitesse d'une planète dessine un cercle"
    duree_introduction: "3 à 5 min, avant de lire l'énoncé"
    question_d_accroche: |
      Une planète décrit une ellipse. Si l'on reporte, à partir d'un même point, les vecteurs vitesse successifs, quelle courbe trace leur extrémité ? Une ellipse comme l'orbite ? Autre chose ? Newton a retrouvé la loi de la gravitation à partir de l'ellipse de Kepler : peut-on faire de même avec de la seule cinématique ?
    texte: |
      {\bf Idée clé : la loi des aires $r^2\dot\theta=C$ remplace une loi de force.} Elle donne $\dot\theta=C/r^2$, donc $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dfrac C{r^2}$ et $r\dot\theta=\dfrac Cr$. Avec $r=p/(1+e\cos\theta)$ : $\dot r=\dfrac{Ce}p\sin\theta$ et $r\dot\theta=\dfrac Cp(1+e\cos\theta)$. Le vecteur vitesse s'écrit alors
      $$\vec v=\frac Cp\left(\vec u_\theta+e\,\vec u_y\right).$$

outils_mathematiques:
  - titre: "Dérivée composée sur une courbe polaire"
    texte: |
      $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\,\dot\theta$ et $\ddot\theta$ se déduit de $r^2\dot\theta=C$ par $\dfrac{\mathrm d}{\mathrm dt}$.
  - titre: "Équation d'un cercle"
    texte: |
      L'ensemble des points $(v_x,v_y)$ tels que $v_x^2+(v_y-v_c)^2=\rho_h^2$ est un cercle de centre $(0,v_c)$ et de rayon $\rho_h$. Pour l'hodographe : $v_c=\dfrac{Ce}p$ et $\rho_h=\dfrac Cp$.
  - titre: "Propriétés de l'ellipse"
    texte: |
      Périhélie $r_{\min}=\dfrac p{1+e}$ ($\theta=0$), aphélie $r_{\max}=\dfrac p{1-e}$ ($\theta=\pi$), demi-grand axe $a=\dfrac p{1-e^2}$, demi-petit axe $b=\dfrac p{\sqrt{1-e^2}}$, aire $\pi ab$, et $b^2=ap$.
  - titre: "Norme d'un vecteur dans la base polaire"
    texte: |
      $\|\vec v\|^2=v_r^2+v_\theta^2=\left(\dfrac Cp\right)^2\left[e^2\sin^2\theta+(1+e\cos\theta)^2\right]=\left(\dfrac Cp\right)^2\left(1+2e\cos\theta+e^2\right)$.
  - titre: "Dérivée d'un vecteur unitaire tournant"
    texte: |
      $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$ et $\dfrac{\mathrm d\vec u_y}{\mathrm dt}=\vec0$ (vecteur fixe).

liens_autres_disciplines:
  - discipline: "Astronomie"
    texte: |
      Orbites des planètes et des comètes (la comète de Halley a $e\approx0{,}967$), satellites artificiels (orbites de transfert), lois de Kepler.
  - discipline: "Physique : mécanique analytique"
    texte: |
      Le problème de Kepler est le prototype des mouvements à force centrale, avec deux constantes : $C$ (moment cinétique par unité de masse) et l'énergie. L'hodographe circulaire est la signature de la {\bf symétrie cachée} du problème de Kepler (vecteur de Runge--Lenz).
  - discipline: "Histoire des sciences"
    texte: |
      Kepler obtient ses lois en 1609-1619 à partir des mesures de Tycho Brahe ; Newton les relie à la gravitation en 1687 (Principia). L'hodographe est introduit par Hamilton (1846) comme outil de démonstration élégant.

questions:
  - id: q1
    enonce: |
      \begin{enumerate}[label=(\alph*)]
          \item Montrer que $a_\theta=\dfrac1r\dfrac{\mathrm d}{\mathrm dt}(r^2\dot\theta)$. En déduire que la loi des aires $r^2\dot\theta=C$ est équivalente au fait que l'accélération est {\bf radiale} (dirigée selon $\vec u_r$).
          \item Exprimer la vitesse aréolaire $\dfrac{\mathrm dA}{\mathrm dt}$ en fonction de $C$.
      \end{enumerate}
    coup_de_pouce: |
      Développez $\dfrac{\mathrm d}{\mathrm dt}(r^2\dot\theta)=2r\dot r\dot\theta+r^2\ddot\theta$ et comparez avec $r\,a_\theta=r^2\ddot\theta+2r\dot r\dot\theta$. L'aire élémentaire balayée est le secteur de rayon $r$ et d'angle $\mathrm d\theta$.
    correction: |
      $\dfrac1r\dfrac{\mathrm d}{\mathrm dt}(r^2\dot\theta)=2\dot r\dot\theta+r\ddot\theta=a_\theta$, donc $a_\theta=0\iff r^2\dot\theta=$ cte. $\dfrac{\mathrm dA}{\mathrm dt}=\dfrac12r^2\dot\theta=\dfrac C2$.
    solution:
      - titre: "(a) Composante orthoradiale de l'accélération"
        texte: |
          $\dfrac1r\dfrac{\mathrm d}{\mathrm dt}\left(r^2\dot\theta\right)=\dfrac1r\left(2r\dot r\dot\theta+r^2\ddot\theta\right)=2\dot r\dot\theta+r\ddot\theta=a_\theta$. Donc
          $$a_\theta=0\iff\frac{\mathrm d}{\mathrm dt}\left(r^2\dot\theta\right)=0\iff r^2\dot\theta=C.$$
          La loi des aires équivaut à $\vec a=a_r\,\vec u_r$ : l'accélération est {\bf radiale} (« force centrale »). Réciproquement, tout mouvement dont l'accélération est radiale vérifie la loi des aires.
      - titre: "(b) Vitesse aréolaire"
        texte: |
          Pendant $\mathrm dt$, le rayon vecteur balaye un secteur d'angle $\mathrm d\theta=\dot\theta\,\mathrm dt$ et d'aire $\mathrm dA=\tfrac12r^2\,\mathrm d\theta$ :
          $$\boxed{\frac{\mathrm dA}{\mathrm dt}=\frac12r^2\dot\theta=\frac C2}.$$
          Le rayon vecteur balaye des aires égales en des temps égaux (deuxième loi de Kepler).

  - id: q2
    enonce: |
      \begin{enumerate}[label=(\alph*),start=3]
          \item Pour l'ellipse $r=\dfrac p{1+e\cos\theta}$ avec $r^2\dot\theta=C$, calculer $\dot r$ et $r\dot\theta$ en fonction de $C$, $p$, $e$ et $\theta$.
          \item En déduire que $\vec v=\dfrac Cp\left(\vec u_\theta+e\,\vec u_y\right)$ et calculer $\|\vec v\|^2$.
          \item Montrer que l'hodographe est un cercle dont on précisera le centre et le rayon.
      \end{enumerate}
    coup_de_pouce: |
      $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dot\theta=\dfrac{r^2}pe\sin\theta\cdot\dfrac C{r^2}$. Pour (d), écrivez $e\sin\theta\,\vec u_r+e\cos\theta\,\vec u_\theta$ avec $\vec u_y=\sin\theta\,\vec u_r+\cos\theta\,\vec u_\theta$. Pour (e), repérez les composantes cartésiennes de $\vec v$ avec $\vec u_\theta=(-\sin\theta,\cos\theta)$.
    correction: |
      $\dot r=\dfrac{Ce}p\sin\theta$, $r\dot\theta=\dfrac Cp(1+e\cos\theta)$ ; $\vec v=\dfrac Cp(\vec u_\theta+e\,\vec u_y)$, $\|\vec v\|^2=\left(\dfrac Cp\right)^2(1+2e\cos\theta+e^2)$ ; hodographe : cercle de centre $\dfrac{Ce}p\vec u_y$ et de rayon $\dfrac Cp$.
    solution:
      - titre: "(c) Composantes de la vitesse"
        texte: |
          $\dot\theta=C/r^2$ donne $r\dot\theta=\dfrac Cr=\dfrac Cp(1+e\cos\theta)$. Et $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dot\theta=\dfrac{r^2e\sin\theta}p\cdot\dfrac C{r^2}$, soit
          $$\boxed{\dot r=\frac{Ce}p\sin\theta},\qquad\boxed{r\dot\theta=\frac Cp\,(1+e\cos\theta)}.$$
      - titre: "(d) Forme compacte de $\\vec v$ et norme"
        texte: |
          $$\vec v=\frac Cp\left[e\sin\theta\,\vec u_r+(1+e\cos\theta)\,\vec u_\theta\right]=\frac Cp\left[\vec u_\theta+e\left(\sin\theta\,\vec u_r+\cos\theta\,\vec u_\theta\right)\right]=\boxed{\frac Cp\left(\vec u_\theta+e\,\vec u_y\right)}.$$
          $$\|\vec v\|^2=\left(\frac Cp\right)^2\left[e^2\sin^2\theta+(1+e\cos\theta)^2\right]=\boxed{\left(\frac Cp\right)^2\left(1+2e\cos\theta+e^2\right)}.$$
      - titre: "(e) Hodographe circulaire"
        texte: |
          $\vec v-\dfrac{Ce}p\,\vec u_y=\dfrac Cp\,\vec u_\theta$ avec $\|\vec u_\theta\|=1$ : la distance de l'extrémité de $\vec v$ au point $\dfrac{Ce}p\,\vec u_y$ vaut $\dfrac Cp$, constante. L'hodographe est donc un {\bf cercle de centre $\dfrac{Ce}p\,\vec u_y$ et de rayon $\dfrac Cp$}. Comme $e<1$, l'origine est {\bf à l'intérieur} du cercle (le vecteur vitesse ne s'annule jamais) ; pour $e=0$ (orbite circulaire), le cercle est centré sur l'origine : mouvement circulaire uniforme.

  - id: q3
    enonce: |
      \begin{enumerate}[label=(\alph*),start=6]
          \item Calculer $\vec a=\dfrac{\mathrm d\vec v}{\mathrm dt}$ à partir de l'expression (d). Quelle est la loi de variation de $\|\vec a\|$ avec $r$ ? Dans quel sens la force s'exerce-t-elle ?
          \item Déterminer la vitesse aux deux apsides (périhélie $\theta=0$, aphélie $\theta=\pi$) et le rapport $v_{\max}/v_{\min}$. Vérifier avec la loi des aires.
          \item Application : pour la Terre, $e=0{,}0167$ et la vitesse orbitale moyenne vaut $29{,}8$ km/s. Estimer les vitesses au périhélie et à l'aphélie. (On pourra utiliser $v_{\max}v_{\min}=\left(\dfrac Cp\right)^2(1-e^2)$ et assimiler $\sqrt{v_{\max}v_{\min}}$ à la vitesse moyenne.)
      \end{enumerate}
    coup_de_pouce: |
      $\vec u_y$ est fixe : seul $\vec u_\theta$ varie dans $\vec v$. Pour (g), $\cos\theta=\pm1$. Pour (h), $v_{\max}v_{\min}=\left(\dfrac Cp\right)^2(1+e)(1-e)$, puis résolvez avec $v_{\max}/v_{\min}=\dfrac{1+e}{1-e}$.
    correction: |
      $\vec a=-\dfrac{C^2}{p\,r^2}\vec u_r$ : attractive, en $1/r^2$. $v_{\max}=\dfrac Cp(1+e)$, $v_{\min}=\dfrac Cp(1-e)$ ; rapport $\dfrac{1+e}{1-e}$. Terre : $v_p\approx30{,}3$ km/s, $v_a\approx29{,}3$ km/s.
    solution:
      - titre: "(f) Accélération"
        texte: |
          $\vec u_y$ est constant et $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$, donc
          $$\vec a=\frac Cp\,\frac{\mathrm d\vec u_\theta}{\mathrm dt}=-\frac Cp\,\dot\theta\,\vec u_r=-\frac Cp\cdot\frac C{r^2}\,\vec u_r=\boxed{-\frac{C^2}{p\,r^2}\,\vec u_r}.$$
          L'accélération est bien radiale (cohérent avec (a)), {\bf dirigée vers $O$} (force attractive) et proportionnelle à $1/r^2$ : on retrouve, par la seule cinématique, la loi de la gravitation de Newton. Par identification, la constante $C^2/p$ est égale à $\mathcal GM$ pour le champ de gravitation du Soleil.
      - titre: "(g) Vitesses aux apsides"
        texte: |
          $\|\vec v\|^2=\left(\dfrac Cp\right)^2(1+2e\cos\theta+e^2)$ est maximale pour $\theta=0$ et minimale pour $\theta=\pi$ :
          $$\boxed{v_{\max}=\frac Cp(1+e)},\qquad\boxed{v_{\min}=\frac Cp(1-e)},\qquad\frac{v_{\max}}{v_{\min}}=\frac{1+e}{1-e}.$$
          Contrôle avec la loi des aires : au périhélie $r_{\min}=\dfrac p{1+e}$ et $v=r\dot\theta=\dfrac C{r}$, soit $v_{\max}=\dfrac Cp(1+e)$ $\surd$ ; à l'aphélie $r_{\max}=\dfrac p{1-e}$, $v_{\min}=\dfrac Cp(1-e)$ $\surd$. Et $r_{\min}v_{\max}=r_{\max}v_{\min}=C$.
      - titre: "(h) Application numérique : la Terre"
        texte: |
          $\dfrac{v_{\max}}{v_{\min}}=\dfrac{1,0167}{0,9833}\approx1{,}034$. Avec $\sqrt{v_{\max}v_{\min}}=\dfrac Cp\sqrt{1-e^2}\approx29{,}8$ km/s et $\sqrt{1-e^2}\approx0{,}99986$ : $\dfrac Cp\approx29{,}8$ km/s. D'où
          $$v_{\max}\approx29{,}8\times1{,}0167\approx30{,}3\ \text{km/s},\qquad v_{\min}\approx29{,}8\times0{,}9833\approx29{,}3\ \text{km/s}.$$
          La vitesse de la Terre ne varie que de $3\,\%$ : l'orbite est quasi circulaire. En revanche, pour la comète de Halley ($e\approx0{,}967$), $\dfrac{v_{\max}}{v_{\min}}=\dfrac{1,967}{0,033}\approx60$ : la comète file au périhélie $60$ fois plus vite qu'à l'aphélie. {\bf Validation} : les ordres de grandeur ($\sim30$ km/s) sont ceux connus de la Terre.
