id: td2
titre: "Cinématique en coordonnées polaires (2D) et cylindriques (3D)"
chapitre_cours: "Chap. 1 — Cinématique du point matériel"
seance: 2
niveau_public: [cpge, licence]
exercices_ordre:
  - ex1_cartesien_polaire
  - ex2_mouvement_circulaire_polaire
  - ex3_cardioide
  - ex4_mouvement_helicoidal
  - ex5_tige_tournante
  - ex6_spirale_equiangulaire
  - ex7_poursuite_polygone
  - ex8_kepler_hodographe

enonce_intro: |
  {\bf Conventions valables pour tout le TD (sauf mention contraire).} Les mouvements étudiés sont ceux d'un {\bf point matériel} $M$ dans un référentiel galiléen. Les repères sont orthonormés directs : $Oxy$ dans le plan, $Oxyz$ dans l'espace ; la {\bf base polaire} $(\vec u_r,\vec u_\theta)$ est associée au point $M$, avec $\vec u_r=\overrightarrow{OM}/OM$ et $\vec u_\theta$ obtenu par rotation de $+\pi/2$ ; la {\bf base cylindrique} $(\vec u_r,\vec u_\theta,\vec k)$ la complète par l'axe fixe $Oz$. Les angles sont en radians, les grandeurs en unités du système international. Les exercices marqués {\it (facultatif)} sont des approfondissements. Les résultats littéraux doivent être établis avant toute application numérique et vérifiés par homogénéité et par des cas limites.

prerequis:
  - titre: "Cinématique cartésienne (TD1)"
    texte: |
      Savoir dériver une loi horaire pour obtenir $\vec v$ et $\vec a$, intégrer avec des conditions initiales, calculer une norme, éliminer le temps pour obtenir une trajectoire. Mouvement circulaire uniforme en cartésien : $x=R\cos\omega t$, $y=R\sin\omega t$, $\vec a=-\omega^2\overrightarrow{OM}$.
  - titre: "Dérivée d'un vecteur unitaire tournant"
    texte: |
      Pour $\vec u_r=\cos\theta\,\vec\imath+\sin\theta\,\vec\jmath$ et $\vec u_\theta=-\sin\theta\,\vec\imath+\cos\theta\,\vec\jmath$ : $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$ et $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$ (dérivée composée). Un vecteur de base {\bf fixe} ($\vec\imath$, $\vec\jmath$, $\vec k$) a une dérivée nulle.
  - titre: "Trigonométrie"
    texte: |
      Cercle trigonométrique, valeurs remarquables ($0,\ \pi/6,\ \pi/4,\ \pi/3,\ \pi/2$), $\cos^2+\sin^2=1$, formules d'addition et de duplication ($\cos2x=2\cos^2x-1$, $\sin2x=2\sin x\cos x$), angle moitié ($1+\cos\theta=2\cos^2\frac\theta2$), complément ($\cos(\frac\pi2-x)=\sin x$). Fonctions $\arctan$ et $\operatorname{atan2}$ et discussion du quadrant.
  - titre: "Fonctions exponentielle, logarithme et hyperboliques"
    texte: |
      $(\mathrm e^{\lambda t})'=\lambda\mathrm e^{\lambda t}$, $\ln$ comme réciproque, $\cosh$ et $\sinh$ ($\cosh^2-\sinh^2=1$, $\cosh'=\sinh$). Résolution de $\ddot r=\pm\omega^2r$ (solutions exponentielles ou sinusoïdales).
  - titre: "Calcul vectoriel et produits"
    texte: |
      Composantes dans une base orthonormée, norme, produit scalaire (orthogonalité), produit vectoriel dans le plan ($v_xa_y-v_ya_x$). Un vecteur se dérive composante par composante {\bf seulement si la base est fixe} ; sinon, il faut dériver aussi les vecteurs de base.
  - titre: "Courbes planes, aires et longueurs"
    texte: |
      Tracé d'une courbe point par point, équation d'un cercle et d'une droite, aire d'un secteur $\tfrac12r^2\,\mathrm d\theta$, longueur $L=\int\|\vec v\|\,\mathrm dt$, séries géométriques.
  - titre: "Dimensions et ordres de grandeur"
    texte: |
      $[\dot\theta]=\mathrm T^{-1}$ (le radian est sans dimension), $[r\dot\theta]=\mathrm{L\,T^{-1}}$, $[\vec a]=\mathrm{L\,T^{-2}}$ ; accélération centripète d'une voiture dans un virage $\sim3$ à $5\ \mathrm{m\,s^{-2}}$, vitesse orbitale de la Terre $\simeq30$ km/s.

objectifs_pedagogiques_etudiants:
  - titre: "Choisir et utiliser le système de coordonnées adapté"
    texte: |
      Passer des coordonnées cartésiennes aux coordonnées polaires, cylindriques et inversement ; choisir celles qui épousent la symétrie du problème (rotation autour d'un point ou d'un axe) ; écrire sans hésiter $\overrightarrow{OM}$, $\vec v$ et $\vec a$ dans la base polaire ou cylindrique.
  - titre: "Maîtriser les dérivées des vecteurs de base et leurs conséquences"
    texte: |
      Savoir que la base polaire {\bf tourne} avec $M$, retrouver à chaque fois $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$ et $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$, et en déduire les formules $\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta$ et $\vec a=(\ddot r-r\dot\theta^2)\,\vec u_r+(r\ddot\theta+2\dot r\dot\theta)\,\vec u_\theta$.
  - titre: "Interpréter chaque terme de la vitesse et de l'accélération"
    texte: |
      Reconnaître la composante radiale ($\dot r$), orthoradiale ($r\dot\theta$), centripète ($-r\dot\theta^2$) et de Coriolis ($2\dot r\dot\theta$) ; savoir que $\vec a\neq\vec0$ dès qu'un mouvement est circulaire, même uniforme ; lire géométriquement un résultat (vitesse maximale, arrêt, angle constant).
  - titre: "Étudier une trajectoire donnée par $r(\\theta)$"
    texte: |
      Tracer une courbe polaire (cardioïde, spirale, ellipse), déduire $r(t)$ de $r(\theta)$ et $\theta(t)$ par la règle de la chaîne $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dot\theta$, calculer longueur, rayon de courbure, accélérations tangentielle et normale.
  - titre: "Étendre à la 3D et exploiter des symétries et des lois de conservation"
    texte: |
      Ajouter l'axe fixe $\vec k$ (hélice), utiliser la symétrie d'un problème collectif (poursuite) pour le ramener à un seul mobile, exploiter la loi des aires $r^2\dot\theta=$ cte, reconnaître une accélération radiale ; retrouver sans forces une loi en $1/r^2$.
  - titre: "Compétences transversales"
    texte: |
      Faire un schéma soigné avec les bases locales, mener des calculs trigonométriques et exponentiels sans erreur de signe, {\bf valider} (homogénéité, cas limites, ordre de grandeur), utiliser Python pour tracer trajectoires, vecteurs et hodographes.

objectifs_pedagogiques_enseignants:
  - titre: "Positionnement du TD et progression"
    texte: |
      Ce TD fait suite à la cinématique cartésienne (TD1) et prépare la dynamique : les forces centrales, les mouvements circulaires et planétaires, les référentiels tournants. Il suit une progression en trois temps : (1) {\bf outils} (exercices 1 et 2 : passage cartésien $\leftrightarrow$ polaire, mouvement circulaire), (2) {\bf $r$ varie} (exercices 3, 4, 5 : cardioïde, hélice, perle sur tige, où $\dot r\neq0$ et le terme de Coriolis apparaît), (3) {\bf synthèse} (exercices 6, 7, 8 : spirale équiangulaire, poursuite, Kepler, où l'on combine géométrie, symétrie et conservation).
  - titre: "Quatre parcours selon le temps disponible"
    texte: |
      {\bf Parcours essentiel} (environ 1 h 30) : exercices 1 et 2, puis le cœur de l'exercice 3 (questions (d) à (g) : vitesse sur la cardioïde).

      {\bf Parcours renforcé} (environ 2 h 30) : ajouter l'exercice 4 (hélice, extension 3D) et le cas A de l'exercice 5 (spirale d'Archimède, terme de Coriolis).

      {\bf Parcours approfondi} (CPGE/licence, en 2\textsuperscript{e} séance ou en travail personnel, environ 3 h) : exercice 5 complet (perle libre, $\cosh$), exercice 6 (spirale équiangulaire), exercice 7 (poursuite par polygone).

      {\bf Parcours « excellence »} (colle ou projet, environ 1 h) : exercice 8 (Kepler et hodographe), à traiter après l'exercice 3 ou 6 pour que la technique $\dot r=r'(\theta)\dot\theta$ soit acquise.
  - titre: "Compétences évaluables"
    texte: |
      {\bf S'approprier} (identifier la symétrie, choisir le système de coordonnées, lire une équation polaire), {\bf Analyser} (traduire une condition géométrique en équations scalaires : $a_r=0$, angle constant, vitesse visant une cible), {\bf Réaliser} (calculs de $\vec v$, $\vec a$, normes, intégrales de longueur), {\bf Valider} (cas limites : cercle $k\to0$ ou $n\to\infty$, droite $n=2$, hélice $h\to0$ ; homogénéité ; ordres de grandeur) et {\bf Communiquer} (schéma avec bases locales, rédaction en étapes). La compétence {\bf Valider} est particulièrement rentable ici : presque tous les exercices ont un cas limite qui redonne un résultat connu.
  - titre: "Points de vigilance sur la gestion de séance"
    texte: |
      Prévoir 10 minutes de rappel sur la dérivation des vecteurs $\vec u_r$ et $\vec u_\theta$ (les étudiants les confondent avec des vecteurs fixes). Imposer un schéma avec la base locale {\bf avant} tout calcul. Séparer systématiquement ce qui relève de la {\bf trajectoire} ($r(\theta)$) et de la {\bf loi horaire} ($\theta(t)$) : les exercices 6 et 7 donnent la même courbe avec des lois horaires différentes. Donner les corrections progressivement (coup de pouce, puis correction courte, puis solution détaillée) et chronométrer (par exemple, 25 min avant la correction pour un exercice de 35 min).

point_cours:
  - titre: "Coordonnées polaires et base polaire"
    texte: |
      $$x=r\cos\theta,\quad y=r\sin\theta,\quad r=\sqrt{x^2+y^2},\quad\cos\theta=\frac xr,\quad\sin\theta=\frac yr.$$
      $\vec u_r=\cos\theta\,\vec\imath+\sin\theta\,\vec\jmath$, $\vec u_\theta=-\sin\theta\,\vec\imath+\cos\theta\,\vec\jmath$, $\overrightarrow{OM}=r\,\vec u_r$, $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$, $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$.
  - titre: "Vitesse et accélération en polaire et en cylindrique"
    texte: |
      $$\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta\ (+\dot z\,\vec k),\qquad\|\vec v\|^2=\dot r^2+r^2\dot\theta^2\ (+\dot z^2),$$
      $$\vec a=\left(\ddot r-r\dot\theta^2\right)\vec u_r+\left(r\ddot\theta+2\dot r\dot\theta\right)\vec u_\theta\ (+\ddot z\,\vec k).$$
      La composante $-r\dot\theta^2$ est {\bf centripète} ; $2\dot r\dot\theta$ est l'accélération {\bf de Coriolis}. On a aussi $a_\theta=\dfrac1r\dfrac{\mathrm d}{\mathrm dt}\left(r^2\dot\theta\right)$.
  - titre: "Mouvements de référence"
    texte: |
      {\bf Circulaire} ($r=R$) : $\vec v=R\dot\theta\,\vec u_\theta$, $\vec a=-R\dot\theta^2\,\vec u_r+R\ddot\theta\,\vec u_\theta$ ; uniforme si $\dot\theta=\omega$ : $v=R\omega$, $\vec a=-R\omega^2\,\vec u_r$.

      {\bf Hélicoïdal} ($r=a$, $z=h\theta$) : $\vec v=\dot\theta\,(a\,\vec u_\theta+h\,\vec k)$, $\tan\alpha=h/a$.

      {\bf Courbe $r(\theta)$ parcourue à $\dot\theta=\omega$} : $\dot r=r'(\theta)\,\omega$.
  - titre: "Loi des aires et accélération radiale"
    texte: |
      $\vec a\parallel\vec u_r\iff r^2\dot\theta=C=$ cte. La vitesse aréolaire est $\dfrac{\mathrm dA}{\mathrm dt}=\dfrac C2$. Une loi des aires conduit à $\dot\theta=C/r^2$ : le mobile tourne plus vite quand il est proche de $O$.
  - titre: "Composantes tangentielle et normale"
    texte: |
      $\vec a=a_t\,\vec\tau+a_n\,\vec n$ avec $a_t=\dfrac{\mathrm dv}{\mathrm dt}$, $a_n=\dfrac{v^2}\rho=\sqrt{a^2-a_t^2}$ et, dans le plan, $\rho=\dfrac{v^3}{|v_xa_y-v_ya_x|}=\dfrac{v^3}{|v_ra_\theta-v_\theta a_r|}$. Si $v=$ cte alors $\vec a\perp\vec v$.
  - titre: "Méthode d'étude d'un mouvement en polaire"
    texte: |
      (1) Schéma avec $O$, $\vec u_r$, $\vec u_\theta$ (et $\vec k$). (2) Écrire $r(t)$ et $\theta(t)$ (ou $r(\theta)$ et $\theta(t)$ et en déduire $r(t)$). (3) Dériver : $\dot r$, $\dot\theta$, $\ddot r$, $\ddot\theta$. (4) Reporter dans les formules de $\vec v$ et $\vec a$. (5) Calculer normes, angles, extrémas. (6) Valider : cas limites, homogénéité, ordre de grandeur.

remarques_pedagogiques_ecueils_classiques:
  - titre: "Dériver $\\vec u_r$ et $\\vec u_\\theta$ comme des vecteurs fixes"
    texte: |
      Écrire $\vec a=\ddot r\,\vec u_r+\ddot\theta\,\vec u_\theta$ oublie que la base tourne. Les termes $-r\dot\theta^2$ et $2\dot r\dot\theta$ viennent précisément de $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$ et $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$.
  - titre: "Écrire $\\vec v=r\\dot\\theta\\,\\vec u_\\theta$ quand $r$ varie"
    texte: |
      Cette formule n'est valable que pour $r=$ cte. Dès que $r$ varie (cardioïde, spirale, ellipse), la composante radiale $\dot r$ est non nulle et la norme de $\vec v$ est $\sqrt{\dot r^2+r^2\dot\theta^2}$.
  - titre: "Penser que $\\vec a=\\vec0$ si $\\dot r=0$ et $\\dot\\theta=$ cte"
    texte: |
      Un mouvement circulaire uniforme est accéléré : $\vec a=-R\omega^2\,\vec u_r$. Plus généralement, si $\|\vec v\|$ est constante alors $\vec a\perp\vec v$ mais $\vec a\neq\vec0$ dès que la trajectoire est courbe.
  - titre: "Oublier le terme de Coriolis $2\\dot r\\dot\\theta$"
    texte: |
      Même avec $\ddot\theta=0$, $a_\theta=2\dot r\dot\theta$ n'est pas nul si $r$ varie. C'est l'erreur la plus fréquente sur la perle sur tige, la spirale ou le mouvement radial en rotation.
  - titre: "Confondre trajectoire $r(\\theta)$ et loi horaire $\\theta(t)$"
    texte: |
      Une même courbe peut être parcourue de plusieurs façons : spirale logarithmique à $\dot\theta=\omega$ (exercice 6, durée infinie) ou à $\|\vec v\|=v$ (exercice 7, durée finie). L'équation $r(\theta)$ ne contient aucune information sur la vitesse de parcours.
  - titre: "Utiliser $\\arctan(y/x)$ sans tenir compte du quadrant"
    texte: |
      $\theta=\arctan(y/x)$ n'est valable que pour $x>0$. Utiliser $\cos\theta=x/r$ et $\sin\theta=y/r$, ou $\operatorname{atan2}(y,x)$.
  - titre: "Oublier la valeur absolue dans une racine"
    texte: |
      $\sqrt{x^2}=|x|$ : par exemple $\sqrt{4\cos^2(\theta/2)}=2|\cos(\theta/2)|$. Ne pas confondre $\theta$ et $\theta/2$ pour le maximum.
  - titre: "Confondre l'angle polaire et l'angle de la vitesse"
    texte: |
      $\theta$ repère la position ; l'angle entre $\vec v$ et $\vec u_r$ (ou avec le plan $Oxy$) est une autre grandeur : $\tan\beta=r\dot\theta/\dot r$, $\tan\alpha=h/a$.
  - titre: "Croire qu'une infinité de tours implique une durée ou une longueur infinies"
    texte: |
      Pour la spirale logarithmique, le nombre de tours est infini mais la longueur est finie (série géométrique), et la durée peut être finie (exercice 7) ou infinie (exercice 6) selon la loi horaire.
  - titre: "Oublier de vérifier les cas limites et l'homogénéité"
    texte: |
      Presque tous les résultats redonnent un cas simple ($k\to0$ : cercle ; $n=2$ : droite ; $h=0$ : cercle ; $e=0$ : cercle). C'est le meilleur test de cohérence.

remarques_pedagogiques_conseils_animation:
  - titre: "Une expérience pour sentir la rotation"
    texte: |
      Faire marcher un étudiant du centre vers le bord d'un plateau tournant, ou lancer une bille sur un plateau de vinyle : le terme de Coriolis devient perceptible. Une corde tournée avec une balle (cas $r=$ cte) permet de ressentir l'accélération centripète.
  - titre: "Prédire avant de calculer"
    texte: |
      Pour la cardioïde, la spirale, la poursuite : « où va-t-on le plus vite ? combien de tours ? les mobiles se rencontrent-ils ? ». Les pronostics sont souvent faux, ce qui motive le calcul et fait apprécier la lecture géométrique des résultats.
  - titre: "Python en séance"
    texte: |
      Tracer en 10 lignes (\texttt{numpy}, \texttt{matplotlib}) : cardioïde, spirales, trajectoires des trois drones (méthode d'Euler avec petit pas), hodographe de Kepler. Superposer $\vec v$ et $\vec a$ avec \texttt{quiver}. Fournir un fichier de départ à compléter.
  - titre: "Travail en binômes et mise en commun"
    texte: |
      Pour les exercices 6, 7, 8, demander à chaque binôme d'écrire d'abord ce que l'énoncé impose sur $\dot r$ et $r\dot\theta$ avant tout calcul, puis comparer au tableau les modélisations. Les groupes avancés enchaînent 7 puis 8 ; les autres consolident 3, 4 et 5.
  - titre: "Tableau synthétique de fin de séance"
    texte: |
      En 5 minutes : « mouvement $\to$ $r(t),\theta(t)$ $\to$ $\vec v$ $\to$ $\vec a$ $\to$ propriété remarquable » pour : cercle uniforme, cardioïde, hélice, perle libre, spirale, poursuite, Kepler.

bilan:
  - titre: "Ce qu'il faut savoir faire à la fin du TD"
    texte: |
      Passer d'un système de coordonnées à l'autre ; écrire et dériver $\overrightarrow{OM}$ en polaire et en cylindrique ; retrouver $\vec v$ et $\vec a$ avec leurs termes (centripète, Coriolis) ; étudier un mouvement le long d'une courbe $r(\theta)$ ; calculer normes, angles, rayon de courbure et longueur ; exploiter une symétrie et la loi des aires ; valider chaque résultat par des cas limites.
  - titre: "Résultats marquants du TD"
    texte: |
      Cercle uniforme : $r=R$, $\theta=\omega t$, $\vec a=-R\omega^2\,\vec u_r$. Cardioïde $r=a(1+\cos\omega t)$ : $\|\vec v\|=2a\omega|\cos(\omega t/2)|$, maximale en $\theta=0$, nulle en $O$. Hélice : $\vec v=\dot\theta(a\,\vec u_\theta+h\,\vec k)$, $\tan\alpha=h/a$, $\vec a=-a\omega^2\,\vec u_r$. Perle libre : $r=r_0\cosh\omega t$, $\vec a=2r_0\omega^2\sinh\omega t\,\vec u_\theta$. Spirale équiangulaire : $\rho=r\sqrt{1+k^2}$, $L=r_0/\cos\gamma$. Poursuite : $r=R\,\mathrm e^{-\theta\tan(\pi/n)}$, $T=\dfrac R{v\sin(\pi/n)}$. Kepler : $\vec v=\dfrac Cp(\vec u_\theta+e\,\vec u_y)$, hodographe circulaire, $\vec a=-\dfrac{C^2}{pr^2}\vec u_r$.
  - titre: "Ce qui sera réutilisé dans la suite"
    texte: |
      La base polaire et l'accélération en $-r\dot\theta^2$ serviront à la dynamique du mouvement circulaire (tension, force centripète), au pendule, aux forces centrales et au problème de Kepler (conservation du moment cinétique, énergie effective), puis aux référentiels non galiléens (Coriolis, entraînement) et aux coordonnées sphériques.

aller_plus_loin:
  - niveau: cpge
    titre: "Simulation numérique de mouvements polaires"
    texte: |
      Intégrer par la méthode d'Euler (puis \texttt{solve\_ivp}) les équations $\ddot r=r\dot\theta^2+f_r$ et $r\ddot\theta=-2\dot r\dot\theta+f_\theta$ pour la poursuite à $n$ drones ou pour une perle sur tige ; comparer à la solution analytique ($r=r_0\cosh\omega t$) et étudier l'erreur en fonction du pas.
  - niveau: licence
    titre: "Repère de Frenet et rayon de courbure en polaire"
    texte: |
      Établir, pour une courbe $r(\theta)$, la formule $\rho=\dfrac{(r^2+r'^2)^{3/2}}{r^2+2r'^2-rr''}$ et la comparer aux rayons de courbure obtenus dans le TD : cardioïde, spirale équiangulaire ($\rho=r\sqrt{1+k^2}$), ellipse. Vérifier $a_n=v^2/\rho$.
  - niveau: licence
    titre: "Coordonnées sphériques"
    texte: |
      Écrire $\overrightarrow{OM}=r\,\vec u_r$ en base sphérique $(\vec u_r,\vec u_\theta,\vec u_\varphi)$ et établir $\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta+r\sin\theta\,\dot\varphi\,\vec u_\varphi$. Traiter le mouvement d'un point à la surface d'une sphère ($r=R$) et la trajectoire d'un satellite en orbite polaire.
  - niveau: master
    titre: "Mécanique lagrangienne et coordonnées généralisées"
    texte: |
      Les coordonnées $(r,\theta)$ sont des exemples de {\bf coordonnées généralisées}. Écrire l'énergie cinétique $\tfrac12m(\dot r^2+r^2\dot\theta^2)$, les équations d'Euler--Lagrange et retrouver $a_\theta=\dfrac1r\dfrac{\mathrm d}{\mathrm dt}(r^2\dot\theta)$ (conservation de $r^2\dot\theta$ pour un potentiel central) et l'équation radiale de l'exercice 5.
  - niveau: doctorat
    titre: "Symétrie cachée du problème de Kepler"
    texte: |
      L'hodographe circulaire (exercice 8) est la manifestation de la conservation du vecteur de Runge--Lenz. Montrer que le groupe de symétrie du problème de Kepler est $SO(4)$ (ou $SO(3,1)$ pour les orbites non liées) et que l'hodographe devient un grand cercle de la sphère $S^3$ (projection de Fock).

accroche_point_cours_essentiel:
  - titre: "Un radar, une planète, un faucon : un seul système de coordonnées ?"
    duree_introduction: "5 à 8 min, avant les exercices"
    question_d_accroche: |
      Comment décrire {\bf simplement} un satellite sur son orbite, une perle sur une tige qui tourne, un faucon qui fond sur sa proie et trois drones qui se poursuivent ? Pourquoi $x(t)$ et $y(t)$ donnent-ils des équations lourdes alors que $r(t)$ et $\theta(t)$ les rendent presque évidentes ? Pourquoi la base polaire est-elle « mobile » et quelles en sont les conséquences sur l'accélération ?
    texte: |
      {\bf Idée clé : on choisit les coordonnées adaptées à la symétrie.} Pour un mouvement autour d'un point $O$, on repère $M$ par $r=OM$ et par l'angle $\theta$. La base $(\vec u_r,\vec u_\theta)$ est liée à $M$ et {\bf tourne} avec lui : $\dfrac{\mathrm d\vec u_r}{\mathrm dt}=\dot\theta\,\vec u_\theta$ et $\dfrac{\mathrm d\vec u_\theta}{\mathrm dt}=-\dot\theta\,\vec u_r$. D'où
      $$\vec v=\dot r\,\vec u_r+r\dot\theta\,\vec u_\theta,\qquad\vec a=(\ddot r-r\dot\theta^2)\,\vec u_r+(r\ddot\theta+2\dot r\dot\theta)\,\vec u_\theta.$$
      Chaque terme a un sens physique (variation de distance, rotation, centripète, Coriolis). En 3D, on ajoute simplement l'axe fixe $\vec k$.

outils_mathematiques:
  - titre: "Dérivée d'un vecteur de base et dérivée composée"
    texte: |
      Si $\vec u(\theta(t))$ : $\dfrac{\mathrm d\vec u}{\mathrm dt}=\dot\theta\,\dfrac{\mathrm d\vec u}{\mathrm d\theta}$. Pour $r(\theta(t))$ : $\dot r=\dfrac{\mathrm dr}{\mathrm d\theta}\dot\theta$ ; $\ddot r=\dfrac{\mathrm d^2r}{\mathrm d\theta^2}\dot\theta^2+\dfrac{\mathrm dr}{\mathrm d\theta}\ddot\theta$.
  - titre: "Formules trigonométriques et duplication"
    texte: |
      $\cos2x=2\cos^2x-1$, $\sin2x=2\sin x\cos x$, $1+\cos\theta=2\cos^2\tfrac\theta2$, $1-\cos\theta=2\sin^2\tfrac\theta2$, $\sin^2\theta+(1+\cos\theta)^2=2+2\cos\theta$.
  - titre: "Exponentielles, logarithmes et fonctions hyperboliques"
    texte: |
      $\cosh x=\dfrac{\mathrm e^x+\mathrm e^{-x}}2$, $\sinh x=\dfrac{\mathrm e^x-\mathrm e^{-x}}2$, $\cosh^2x-\sinh^2x=1$, $\cosh2x=\cosh^2x+\sinh^2x$, $\operatorname{arcosh}y=\ln\left(y+\sqrt{y^2-1}\right)$. Équation $\ddot r=\omega^2r$ : $r=A\cosh\omega t+B\sinh\omega t$.
  - titre: "Séparation des variables"
    texte: |
      $\dfrac{\mathrm dr}{\mathrm d\theta}=-\lambda r\iff r=r_0\mathrm e^{-\lambda\theta}$ (spirale logarithmique). Pour $\dot\theta=\dfrac\mu r$ avec $r=R-\lambda t$ : $\theta=-\dfrac\mu\lambda\ln\left(1-\dfrac t T\right)$ avec $T=R/\lambda$.
  - titre: "Intégrales de longueur et d'aire"
    texte: |
      $L=\int\|\vec v\|\,\mathrm dt$ ; aire d'un secteur polaire $A=\tfrac12\int r^2\,\mathrm d\theta$ ; $\displaystyle\int_0^\infty\mathrm e^{-\lambda t}\,\mathrm dt=\dfrac1\lambda$ ; $\displaystyle\int_0^{2\pi}|\cos\tfrac\theta2|\,\mathrm d\theta=4$.
  - titre: "Rayon de courbure"
    texte: |
      Dans le plan : $\rho=\dfrac{v^3}{|v_ra_\theta-v_\theta a_r|}$. Si $v=$ cte : $\rho=v^2/\|\vec a\|$. Pour un cercle $\rho=R$, une droite $\rho=\infty$.
  - titre: "Équations de coniques et hodographe"
    texte: |
      Ellipse de foyer $O$ : $r=\dfrac p{1+e\cos\theta}$, $a=\dfrac p{1-e^2}$, $b^2=ap$. L'hodographe est le lieu de l'extrémité de $\vec v$ ; pour Kepler c'est un cercle de rayon $C/p$ centré en $\dfrac{Ce}p\,\vec u_y$.
  - titre: "Produit scalaire et orthogonalité"
    texte: |
      $\vec a\cdot\vec v=\tfrac12\dfrac{\mathrm d\|\vec v\|^2}{\mathrm dt}$ : $\|\vec v\|=$ cte $\iff\vec a\perp\vec v$. L'angle entre deux vecteurs se lit sur $\cos\varphi=\dfrac{\vec A\cdot\vec B}{\|\vec A\|\|\vec B\|}$.

liens_autres_disciplines:
  - discipline: "Mathématiques"
    texte: |
      Nombres complexes (module et argument), courbes polaires (cardioïde, spirales, coniques), changement de variables dans les intégrales doubles ($\mathrm dA=r\,\mathrm dr\,\mathrm d\theta$), courbes de poursuite, géométrie différentielle (courbure, torsion de l'hélice).
  - discipline: "Astronomie et planétologie"
    texte: |
      Lois de Kepler, mouvements des planètes, comètes, satellites, trajectoires de transfert, spirales de galaxies, orbites autour d'un trou noir.
  - discipline: "Électromagnétisme"
    texte: |
      Particule chargée dans un champ magnétique uniforme (cercle, hélice, rayon de Larmor, aurores polaires, cyclotron, tokamak) ; champs à symétrie cylindrique (fil, solénoïde) ; microphones cardioïdes, diagrammes de rayonnement d'antennes.
  - discipline: "Mécanique, référentiels tournants et technologie"
    texte: |
      Force de Coriolis, plateau tournant, centrifugeuse, essoreuse, turbines, vis et engrenages hélicoïdaux (pas $2\pi h$), came et bielle-manivelle en polaire.
  - discipline: "Navigation, radar et robotique"
    texte: |
      Un radar, un sonar ou un lidar mesure une distance et un angle : mesures polaires converties en cartésien. Guidage et navigation proportionnelle, algorithmes de rendez-vous de drones et de robots en formation.
  - discipline: "Biologie et éthologie"
    texte: |
      Approche en spirale du faucon pèlerin, poursuite d'une proie, vol des insectes autour d'une lumière, géométrie de l'ADN (double hélice, rayon $\sim1$ nm, pas $3{,}4$ nm), coquilles en spirale (nautile).
  - discipline: "Informatique et simulation"
    texte: |
      Représentation de trajectoires par intégration numérique (Euler, Runge--Kutta), moteurs physiques de jeux vidéo, animation d'orbites, algorithmes de poursuite et de flocage.
