# Chaque entrée = un PDF généré.
#   matiere       : dossier dans data/matieres/<matiere>/
#   type_doc      : "td" | "tp" | "cours" (défaut "td")
#   doc           : nom du document
#   auteur        : (optionnel) surcharge l'auteur du document
#   etablissement : (optionnel) ex: IPSA, Sorbonne, etc.
#   promo         : (optionnel) ex: A2, L3, M1
#   annee         : (optionnel) ex: 2025-2026

# =====================================================================
# Couleur de l'ANGLAIS (titres et textes écrits {\color{blue} ...} dans les YAML)
# Un seul réglage pour les PDF (LaTeX) et pour le site (Quartz).
# Valeur : un hex ("#1565C0") ou un nom de couleur ("blue", "teal").
# `anglais_web` (optionnel) : autre teinte pour le site seulement -- utile si la
# couleur choisie est trop sombre sur le thème sombre de Quartz (ex. "#4A90E2").
# Changer ce réglage rend les PDF « périmés » (build.py --stale les refait).
# =====================================================================
couleurs:
  anglais: "#1565C0"
  # anglais_web: "#4A90E2"

# =====================================================================
# Publication : quel PROFIL de visibilité pour chaque cours, TP et TD
# (voir web/visibility_profiles.yaml : avant_seance, pendant_seance_avec_indices,
#  corrige_resultats_seuls, corrige_complet, all)
#
#   ./web/publish_profile.sh auto        -> applique CE bloc, document par document
#   ./web/publish_profile.sh <profil>    -> force UN profil partout (ignore ce bloc)
#
# Exemple d'usage en classe :
#   chapitre terminé        -> corrige_complet   (tout : corrections et solutions)
#   chapitre en cours       -> pendant_seance_avec_indices   (énoncés + aides)
#   pas encore abordé       -> avant_seance      (énoncés seulement)
#
# Le profil d'un document règle À LA FOIS : le contenu des pages Quartz / JSON /
# notebooks (corrections, solutions, coups de pouce) ET les PDF mis en ligne
# (énoncé / aides / corrigé / fiche enseignant, via `pdf_publies` du profil).
#
# Forme courte :   <document>: <profil>
# Forme détaillée (surcharger certains exercices) :
#   <document>:
#     profil: pendant_seance_avec_indices
#     exercices:
#       ex3_equation_ondes: corrige_complet     # cet exercice-là est déjà corrigé en classe
# Un document non listé prend le `defaut` de sa matière, puis le `defaut` global.
# =====================================================================
publication:
  defaut: all
  matieres:
    agregation-mathematiques:   # Préparation Agrégation de Mathématiques
      defaut: all
      td:
        dev1_exemple: all   # Développement — exemple (gabarit à compléter)
    agregation-physique:   # Préparation Agrégation de Physique
      defaut: all
      cours:
        lecon_oscillateurs: all   # Leçon — Oscillateurs mécaniques, portrait de phase
    mecanique-de-point-ipsa:   # Mécanique du point — IPSA
      defaut: all
      cours:
        chap1_intro: all   # Chapitre 1 — : introduction
      td:
        td1_cinematique_cartesiennes: all  # Cinématique en coordonnées cartésiennes
        td2_cinematique_en_coordonnees_polaire_ou_cylindrique: all   # Cinématique en coordonnées polaires (2D) et cylindriques (3D)
        td3_base_de_frenet: # avant_seance   # Base de Frenet, rayon de courbure et accélérations tangentielle et nor
          profil: all
          exercices:
            ex1_base_frenet: all
            ex2_mouvement_curviligne_uniforme: all
            ex3_circuit_monaco: all
            ex4_abscisse_curviligne: all
            ex5_cycloide: all
            ex6_raccordement_clothoide: all
            ex7_cercle_adherence: all
            ex8_tir_parabolique_frenet: all
    
    onip-iogs:   # Outils Numériques pour l'Ingénieur·e en Physique (ONIP)
      defaut: all
      td:
        td1_intro: all   # Intro — Prise en main de PyCharm, débogage et bonnes pratiques Python
        td2_seance2: all   # Séance 2 — Listes, fonctions, Numpy et matplotlib
        td3_seance3: all  # Séance 3 — FFT 1D/2D, meshgrid et tramage
    physique-ondes-ipsa:   # Physique des ondes
      defaut: all
      cours:
        chap1_intro: all   # Chapitre 1 — Ondes mécaniques : introduction
      td:
        td1_corde: all   # Propagation des ondes mécaniques sur une corde
        td2_ondes_sonores: all   # Propagation des ondes sonores dans un fluide
        td3_reflexion_transmission: all   # Coefficients de réflexion et transmission, impédance
      tp:
        tp1_corde_ressort: pendant_seance_avec_indices   # 
    piscines-de-sciences-et-methodologie:   # Piscine de sciences et méthodologie
      defaut: all 
      td:
        td1_grandeurs_physiques: all    # GRANDEURS PHYSIQUES Dimensions, unités et analyse dimensionnelle
        td2_derivation_et_differentielle: all    # DÉRIVATION ET DIFFÉRENTIELLE (6h) Interprétation en Physique
        td3_fonctions_derives_integrale: all    # FONCTIONS, DERIVES, INTEGRALE (4h) Description mathématique du mouveme
        td4_vecteurs_en_physique: all    # VECTEURS EN PHYSIQUE (4h)
    recherche-integrabilite-quantique:   # Recherche personnelle — Intégrabilité quantique
      defaut: all 
      cours:
        intro_bethe: all   # Notes — Introduction à l'ansatz de Bethe
    traveaux_pratiques-ipsa:   # Travaux pratiques — IPSA
      defaut: all 
      tp:
        astrophysique: all   # TP d'astrophysique : de la balance de Cavendish à la densité du Soleil
        general: all    # TP sur les ondes : visuels, amusants, orientés aviation

