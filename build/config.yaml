# #####################################################################
#  MODE D'EMPLOI de ce fichier  (build/config.yaml)
# #####################################################################
#  Tout ce qui se règle SANS toucher au code est ici. Les blocs, dans l'ordre :
#
#   profils          AUTEURS : nom / e-mail / bureau imprimés dans l'en-tête des PDF.
#   couleurs         couleur de l'anglais (PDF et site).
#   types_documents  ce qu'une matière peut contenir : td, tp, projet, cours... (+ les tiens).
#   rubriques        les encadrés pédagogiques du site (prérequis, objectifs, bilan...) : titre, couleur, élève/prof.
#   fichiers         fichiers rattachés à un dossier ou un exercice (Excel, PDF construit...).
#   qcm              QCM : adresse du site, accès libre à la maison, rattachement aux pages (lien + QR).
#   publication      QUEL CONTENU MONTRER, document par document (états « terminé / en cours / à venir »,
#                    profils all_eleve / all_fast / all_prof...).   <-- le bloc que l'on change le plus souvent
#   targets          la liste des PDF à construire (un bloc = un PDF).
#
#  Le QUI-VOIT-QUOI détaillé (quels encadrés, corrections, PDF) est dans web/visibility_profiles.yaml.
#
#  Commandes courantes :
#     ./web/publish_profile.sh auto           applique `publication:` ci-dessous, document par document
#     ./web/publish_profile.sh termine        FORCE un état (ou un profil) pour tous les documents
#     python3 tools/check_evolutions.py       vérifie les réglages de ce fichier (fautes de frappe, fichiers absents...)
#     python3 build/build.py <nom_du_pdf>     construit un PDF de `targets:`
#  Guide complet : GUIDE_EVOLUTIONS.md
# #####################################################################

